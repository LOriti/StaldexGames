<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rewind Zoo</title>
<meta name="description" content="Rewind Zoo: an animal merge game across two timelines. Merge on a 1986 camcorder tape and every new animal ripples forward to fix a 2026 sanctuary. Two seasons, then endless episodes.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#A6E4FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&family=VT323&display=swap">
<style>
/* Rewind Zoo — one phone-width column: HUD, 2026 sanctuary strip, story bubble, 1986 camcorder merge board, thumb controls.
   Single bright cartoon look by design (no dark theme). */
:root{
  --sky:#A6E4FF; --sky-2:#C6EFFF;
  --sun:#FFD447; --sun-soft:#FFEDA3;
  --aqua:#7DD5FF; --aqua-soft:#C8EDFF;
  --pink:#FF7AB0; --pink-soft:#FFCBE0;
  --mint:#4FE0AE; --mint-soft:#BDF5DF;
  --lime:#B9E94C; --lime-soft:#E2F7B5;
  --tang:#FF9A3D;
  --gold:#FFC21A; --gold-hi:#FFF1A8; --gold-lo:#E89B00;
  --ink:#27174B; --ink-soft:#5A4A7E;
  --paper:#FFFAF0; --sad:#E6E1EE;
  --film:#33204D; --film-2:#47306A;
  --vhs:#FFF2CF; --vhs-r:rgba(255,70,120,.75); --vhs-b:rgba(70,200,255,.75); --rec:#FF4D5E;
  --scrim:rgba(39,23,75,.62);
  --font-display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --font-body:'Fredoka',ui-rounded,system-ui,-apple-system,sans-serif;
  --font-vhs:'VT323',ui-monospace,Menlo,monospace;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--sky);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0; color:var(--ink); font-family:var(--font-body); font-size:15px;
  background-color:var(--sky);
  background-image:radial-gradient(var(--sky-2) 2.2px,transparent 2.7px);
  background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 10px;
  -webkit-tap-highlight-color:transparent;
}
/* one-screen app: fixed rows top and bottom, the 1986 board takes whatever height is left */
.app{max-width:440px;height:100%;min-height:500px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.app>*{flex:none}
.app.shake{animation:shake .35s}
.app.quake{animation:quake .5s}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes quake{15%{transform:translate(-8px,3px) rotate(-.6deg)}30%{transform:translate(8px,-3px) rotate(.6deg)}45%{transform:translate(-6px,2px)}60%{transform:translate(5px,-2px)}80%{transform:translate(-2px,1px)}}
.e{font-family:var(--emoji)}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

/* header + HUD */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1;display:flex;align-items:center;gap:4px;white-space:nowrap}
.logo span{background:var(--pink);color:var(--paper);border:2.5px solid var(--ink);border-radius:9px;padding:1px 6px 2px;transform:rotate(-4deg);display:inline-block;box-shadow:0 2px 0 var(--ink)}
.topbtns{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;box-shadow:0 2px 0 var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.round{width:30px;height:30px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);box-shadow:0 2px 0 var(--ink);cursor:pointer;font-family:var(--emoji);font-size:15px;padding:0;display:grid;place-items:center}
.hud{display:flex;gap:5px;align-items:center}
.hud .chip{padding:3px 7px;flex:none;height:32px;font-size:13.5px}
.pill{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:3px 7px;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--ink);white-space:nowrap;min-width:0;flex:none;height:32px}
.pill.lvl{flex:1 1 auto;min-width:64px;justify-content:flex-start;padding-left:9px}
.pill.tape{padding-right:3px}
.lvl b{font-family:var(--font-display);font-weight:400;font-size:15px}
.lbar{flex:1;height:9px;border:2px solid var(--ink);border-radius:99px;background:var(--sad);overflow:hidden;min-width:16px}
.lbar i{display:block;height:100%;background:var(--mint);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.plus{font:inherit;font-family:var(--font-display);font-size:15px;line-height:1;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:var(--mint);color:var(--ink);cursor:pointer;padding:0;display:grid;place-items:center;flex:none}

/* panels */
.panel{border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
.now{background:var(--paper);padding:19px 8px 8px;margin-top:9px;position:relative}
.tag{position:absolute;top:-14px;left:12px;background:var(--ink);color:var(--paper);font-family:var(--font-display);font-size:12.5px;line-height:1;padding:4px 10px 5px;border-radius:999px;letter-spacing:.03em}
.plots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.plot{position:relative;cursor:pointer;background:var(--sad);border:2.5px solid var(--ink);border-radius:12px;padding:4px 2px 5px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;transition:background .3s}
.plot:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.plot.over{box-shadow:0 0 0 3px var(--sun),0 0 14px var(--sun);transform:scale(1.05)}
.plot.nope{animation:nope .4s}
.req{position:absolute;top:-10px;right:-3px;z-index:2;width:23px;height:23px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);display:grid;place-items:center;font-family:var(--emoji);font-size:12px;line-height:1}
.req.ready{background:var(--mint);animation:ready 1s ease-in-out infinite}
.req.poke{animation:poke .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes ready{50%{transform:scale(1.2)}}
@keyframes poke{0%{transform:scale(.3)}100%{transform:none}}
.coin{position:absolute;top:-10px;left:-3px;z-index:2;display:flex;align-items:center;gap:2px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:0 4px;font-size:10px;font-weight:700;line-height:16px;white-space:nowrap;box-shadow:0 2px 0 var(--ink);font-variant-numeric:tabular-nums;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.plot .pe{font-family:var(--emoji);font-size:24px;line-height:1.15}
.plot[data-s="0"] .pe,.plot.locked .pe{filter:grayscale(1);opacity:.6}
.plot .pn{font-family:var(--font-display);font-size:12px;line-height:1}
.plot .pc{font-size:9px;line-height:1.12;color:var(--ink-soft);min-height:2.25em;display:flex;align-items:center;justify-content:center;padding:0 1px}
.plot.locked{border-style:dashed;background:transparent}
.plot.lit.c0{background:var(--sun-soft)} .plot.lit.c1{background:var(--aqua-soft)}
.plot.lit.c2{background:var(--pink-soft)} .plot.lit.c3{background:var(--mint-soft)} .plot.lit.c4{background:var(--lime-soft)}
.plot.max{box-shadow:0 0 0 3px var(--sun),0 0 16px var(--sun)}
.plot.bump{animation:bump .65s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.22) rotate(-5deg)}60%{transform:scale(.94) rotate(2deg)}100%{transform:none}}
.pips{display:flex;gap:3px;margin-top:2px}
.pips i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink)}
.pips i.on{background:var(--ink)}
.pips i.goal{box-shadow:0 0 0 2px var(--pink)}
.goal{margin-top:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:12px;font-weight:500;line-height:1.2}
.goal #goalText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gr{font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.bar{grid-column:1/-1;height:8px;border:2px solid var(--ink);border-radius:99px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);transition:width .5s cubic-bezier(.3,1.4,.5,1)}

/* story bubble */
.msg{display:flex;gap:8px;align-items:center;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:5px 9px;box-shadow:0 3px 0 var(--ink);cursor:pointer;height:50px;text-align:left;width:100%;font:inherit;color:inherit;overflow:hidden}
.msg .av{width:28px;height:28px;font-size:14px}
.msg .mt{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg .mt b{font-weight:600;color:var(--ink-soft)}
.msg.new{animation:msgIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes msgIn{from{transform:translateY(8px) scale(.96);opacity:.3}}
.av{flex:none;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--font-display);font-size:16px}
.av.kev{background:var(--mint)} .av.bev{background:var(--pink)} .av.doug{background:var(--sad)} .av.fan{background:var(--sun)}
.mb{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.who{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);display:flex;justify-content:space-between;gap:6px}
.mt{font-size:14.5px;line-height:1.3}

/* 1986 board */
.then{background:var(--film);padding:8px;position:relative;overflow:hidden;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.gridwrap{position:relative;z-index:1;flex:1 1 auto;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.then::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,140,60,.18) 100%)}
.then::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.045) 0 1px,transparent 1px 3px)}
.then.glitch{animation:glitch .42s steps(5)}
@keyframes glitch{20%{transform:translate(-4px,1px);filter:hue-rotate(50deg) saturate(1.7)}40%{transform:translate(4px,-1px);filter:hue-rotate(-40deg)}60%{transform:translate(-2px,0);filter:contrast(1.4)}80%{transform:translate(1px,1px)}100%{transform:none;filter:none}}
.vhs{position:relative;z-index:1;flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-vhs);font-size:18px;line-height:1;color:var(--vhs);letter-spacing:.03em;text-shadow:1.5px 0 var(--vhs-r),-1.5px 0 var(--vhs-b);margin-bottom:6px;font-variant-numeric:tabular-nums;min-height:20px;white-space:nowrap}
.rec i{font-style:normal;color:var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.cm{display:flex;align-items:center;gap:5px;font-size:21px;color:var(--sun)}
.cm.hit{animation:cmHit .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes cmHit{from{transform:scale(1.6)}}
.cm span{display:block;width:40px;height:7px;border:1.5px solid var(--vhs);border-radius:4px;overflow:hidden}
.cm span b{display:block;height:100%;background:var(--sun)}
.grid{position:relative;width:min(100cqw,100cqh);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:min(6px,1.4cqmin);touch-action:none;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;border-radius:13px;background:var(--film-2);box-shadow:inset 0 2px 0 rgba(0,0,0,.28);position:relative}
.cell.over{box-shadow:inset 0 0 0 3px var(--sun)}
.tile{position:absolute;inset:3px;border-radius:12px;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--emoji);font-size:clamp(16px,9cqmin,34px);line-height:1;box-shadow:0 3px 0 var(--ink);cursor:grab;transition:transform .12s,opacity .12s}
.tile .face{display:block}
.tile.c0{background:var(--sun)} .tile.c1{background:var(--aqua)} .tile.c2{background:var(--pink)} .tile.c3{background:var(--mint)} .tile.c4{background:var(--lime)}
.tile.gold{background:linear-gradient(135deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);overflow:visible;box-shadow:0 3px 0 var(--ink),0 0 14px 2px var(--gold)}
.tile.gold .tier{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.tile.gold::before{content:"";position:absolute;inset:0;border-radius:9px;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);background-size:250% 100%;animation:shine 1.8s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.tile.mys{background:repeating-linear-gradient(45deg,var(--pink) 0 8px,var(--sun) 8px 16px);animation:wiggle 1.6s ease-in-out infinite}
.tile.mys .face{filter:drop-shadow(0 2px 0 var(--ink))}
.tile.rolling{animation:none;transform:scale(1.08)}
@keyframes wiggle{0%,80%,100%{transform:none}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
.tile .tier{position:absolute;right:-6px;bottom:-6px;width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--font-display);font-weight:400;font-size:11px;display:grid;place-items:center;border:2px solid var(--paper);z-index:1}
.tile.sel{transform:translateY(-4px) scale(1.05);box-shadow:0 0 0 3px var(--sun),0 6px 0 var(--ink)}
.tile.dim{opacity:.25}
.tile.t5{animation:legend 1.4s linear infinite}
@keyframes legend{0%,100%{box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--sun)}33%{box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--pink)}66%{box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--mint)}}
.tile .send{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--pink);color:var(--paper);font-family:var(--font-display);font-style:normal;font-size:10px;padding:1px 6px;border-radius:999px;border:2px solid var(--ink);letter-spacing:.05em;white-space:nowrap;z-index:1}
.tile.mys .send{background:var(--ink)}
.tile .want{position:absolute;left:-6px;top:-6px;z-index:1;width:19px;height:19px;border-radius:50%;background:var(--mint);border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-family:var(--emoji);font-size:9px;line-height:1}
.tile.pop{animation:pop .45s cubic-bezier(.2,1.9,.4,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg)}100%{transform:none}}
.tile.spawn{animation:drop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes drop{0%{transform:translateY(-34px) scale(.4);opacity:0}}
.tile.settle{animation:settle .25s ease-out}
@keyframes settle{0%{transform:scale(1.1)}100%{transform:none}}
.tile.ghost{position:fixed;inset:auto;z-index:50;pointer-events:none;transform:scale(1.15) rotate(-5deg);box-shadow:0 10px 0 var(--ink);transition:none;animation:none}

/* controls */
.controls{display:grid;grid-template-columns:70px 1fr;gap:10px;padding-bottom:4px}
.btn{font:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.crate{background:var(--sun);font-family:var(--font-display);font-size:23px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px}
.crate .e{font-size:26px}
.crate small{font-family:var(--font-body);font-size:13px;font-weight:600;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 8px}
.crate.shake{animation:nope .4s}
@keyframes nope{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bin{background:var(--pink);font-family:var(--font-display);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px}
.bin .e{font-size:22px}
.bin.over{background:var(--tang);transform:scale(1.06)}
.hint{margin:0;font-size:12px;text-align:center;color:var(--ink-soft);text-wrap:balance}

/* discovery toast */
.toast{position:fixed;z-index:55;left:50%;top:calc(10px + env(safe-area-inset-top,0px));width:min(360px,calc(100% - 32px));transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:9px 12px;pointer-events:none}
.toast.in{animation:toastIn .45s cubic-bezier(.2,1.6,.4,1)}
.toast.out{animation:toastOut .28s ease-in forwards}
@keyframes toastIn{from{transform:translate(-50%,-120%)}}
@keyframes toastOut{to{transform:translate(-50%,-140%);opacity:0}}
.te{font-family:var(--emoji);font-size:38px;line-height:1;flex:none;background:var(--sun);border:2.5px solid var(--ink);border-radius:14px;width:54px;height:54px;display:grid;place-items:center}
.tb{display:flex;flex-direction:column;gap:1px;min-width:0}
.tk{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--pink)}
.tb b{font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.05}
.tf{font-size:12.5px;line-height:1.3;color:var(--ink-soft)}

/* fx layer */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
.float{position:absolute;font-family:var(--font-display);font-size:21px;color:var(--paper);white-space:nowrap;
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 4px var(--ink)}
.float.small{font-size:16px;color:var(--mint)}
.float.big{font-size:34px;color:var(--sun)}
.float.gold{font-size:28px;color:var(--gold)}
.float.huge{font-size:46px;color:var(--pink)}
.spark{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2.5px solid var(--ink)}
.dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:1.5px solid var(--ink)}

/* modals */
.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);max-width:380px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;animation:cardIn .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardIn{from{transform:translateY(24px) scale(.9);opacity:0}}
.kicker{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
.card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1;text-wrap:balance}
.card p{margin:0;line-height:1.45}
.art{font-family:var(--emoji);font-size:34px;text-align:center;letter-spacing:4px;background:var(--film);border:2.5px solid var(--ink);border-radius:16px;padding:12px 8px 8px;line-height:1.2}
.art small{display:block;font-family:var(--font-vhs);font-size:18px;letter-spacing:.05em;color:var(--vhs);text-shadow:1.5px 0 var(--vhs-r),-1.5px 0 var(--vhs-b);margin-top:6px}
.how{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.how li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35;counter-increment:s}
.how li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);font-family:var(--font-display);font-size:13px;display:grid;place-items:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px;font-family:var(--font-display);font-size:19px;padding:11px 14px}
.row .btn.small{font-size:15px;padding:8px 12px}
.btn.go{background:var(--mint)} .btn.alt{background:var(--sun)} .btn.quiet{background:var(--paper)}
.btn:disabled{opacity:.5;cursor:default}
.reward{font-family:var(--font-display);font-size:22px;text-align:center}
.adbox{background:var(--film);color:var(--vhs);font-family:var(--font-vhs);font-size:26px;text-align:center;padding:34px 10px;border-radius:16px;border:2.5px solid var(--ink);line-height:1.1}
.adbox .e{display:block;font-size:46px;margin-bottom:6px}
.log{margin:0;padding:0;list-style:none;display:grid;gap:8px;max-height:48vh;overflow-y:auto}
.log li{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.35}
.log .av{width:26px;height:26px;font-size:13px}
.log b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.album{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center}
.an{font-family:var(--font-display);font-size:14px}
.acells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.acell{aspect-ratio:1;border-radius:10px;border:2px solid var(--ink);background:var(--film-2);color:var(--vhs);font-family:var(--font-display);font-size:16px;display:grid;place-items:center;padding:0;cursor:default}
.acell.f{font-family:var(--emoji);font-size:22px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.acell.f.c0{background:var(--sun)} .acell.f.c1{background:var(--aqua)} .acell.f.c2{background:var(--pink)} .acell.f.c3{background:var(--mint)} .acell.f.c4{background:var(--lime)}

@media (prefers-reduced-motion: reduce){
  .tile.t5,.tile.mys,.tile.gold::before,.rec i,.req.ready,.req.poke,.coin,.plot.nope{animation:none}

<div class="app" id="app">
  <div class="hud">
    <div class="pill lvl" title="Sanctuary level"><b id="lvl">Lv 1</b><span class="lbar"><i id="lvlBar"></i></span></div>
    <span class="pill" title="Fans"><span class="e">🎟</span><span id="fans">0</span></span>
    <span class="pill tape" title="Tape (energy)"><span class="e">📼</span><span id="tape">40</span><button class="plus" id="adBtn" aria-label="Watch an ad for more tape">+</button></span>
    <button class="chip" id="albumBtn" aria-label="Open animal album"><span class="e">📖</span><span id="albumN">0</span></button>
    <button class="round" id="mute" aria-label="Toggle sound">🔊</button>
  </div>

  <section class="panel now" aria-label="2026 sanctuary">
    <span class="tag">2026 · Now</span>
    <div class="plots" id="plots"></div>
    <div class="goal"><span id="goalText">Goal</span><span class="gr" id="goalNum"></span><div class="bar"><i id="goalBar"></i></div></div>

    <span class="av kev" id="msgAv">K</span>
    <span class="mt"><b id="msgWho">Kev:</b> <span id="msgText"></span></span>
  </button>

  <section class="panel then" id="then" aria-label="1986 tape">
    <div class="vhs">
      <span class="rec"><i>●</i> REC</span>
      <span class="cm" id="cm" hidden><strong id="cmN">×2</strong><span><b id="cmBar"></b></span></span>
      <span id="stamp">JUN 14 1986 4:12:00 PM</span>
    </div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>
  </section>

  <div class="controls">
    <button class="btn bin" id="bin" aria-label="Bin selected animal"><span class="e">🗑</span>Bin</button>
    <button class="btn crate" id="crate"><span class="e">📦</span>Crate<small>1 📼</small></button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div id="fx"></div>
<div class="modal" id="modal" hidden></div>

/* Rewind Zoo — synthesized sound effects (no audio files). Starts after first tap. */
(function () {
  const RZ = window.RZ;
  let ac = null;

  function ctx() {
    if (RZ.S && RZ.S.muted) return null;

      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  const note = n => 261.63 * Math.pow(2, n / 12);

  function tone(f, d = 0.12, type = 'triangle', v = 0.12, delay = 0) {
    const a = ctx(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);

<script>
/* Rewind Zoo — visual juice: floating text, bursts, ripple sparks, glitch, shake, confetti. */
(function () {
  const RZ = window.RZ;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const layer = () => document.getElementById('fx');

  function center(el) {
    if (Array.isArray(el)) return el;
    const r = el.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  }

  function floatText(x, y, text, cls = '') {
    const s = document.createElement('div');
    s.className = 'float ' + cls; s.textContent = text;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    layer().append(s);
    const a = s.animate([
      { transform: 'translate(-50%,-50%) scale(.5)', opacity: 0 },
      { transform: 'translate(-50%,-90%) scale(1.15)', opacity: 1, offset: 0.22 },
      { transform: 'translate(-50%,-230%) scale(1)', opacity: 0 }],
      { duration: RM ? 700 : 1150, easing: 'ease-out' });
    a.onfinish = () => s.remove();
  }

  function burst(x, y, colVar, count = 10) {
    if (RM) return;
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'dot'; d.style.left = x + 'px'; d.style.top = y + 'px';
      d.style.background = `var(${i % 3 === 0 ? '--paper' : colVar})`;
      layer().append(d);
      const ang = Math.PI * 2 * i / count + Math.random() * 0.4, r = 32 + Math.random() * 30;
      const a = d.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${Math.cos(ang) * r}px,${Math.sin(ang) * r}px) scale(.3)`, opacity: 0 }],
        { duration: 520, easing: 'cubic-bezier(.2,.8,.3,1)' });
      a.onfinish = () => d.remove();
    }
  }

  function fly(from, toEl, colVar, done) {
    const [x1, y1] = center(from), [x2, y2] = center(toEl);
    if (RM) { done(); return; }
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = x1 + 'px'; s.style.top = y1 + 'px';
    s.style.background = `var(${colVar})`; s.style.boxShadow = `0 0 16px var(${colVar})`;
    layer().append(s);
    const dx = x2 - x1, dy = y2 - y1, bend = (x1 < x2 ? -1 : 1) * 70;
    const a = s.animate([
      { transform: 'translate(0,0) scale(.5)' },
      { transform: `translate(${dx / 2 + bend}px,${dy / 2}px) scale(1.5)`, offset: 0.5 },
      { transform: `translate(${dx}px,${dy}px) scale(.8)` }],
      { duration: 620, easing: 'ease-in-out' });
    a.onfinish = () => { s.remove(); done(); };
  }

  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function glitch() { if (!RM) restart(document.getElementById('then'), 'glitch'); }
  function shake(big) { if (!RM) restart(document.getElementById('app'), big ? 'quake' : 'shake'); }

  function confetti(n = 140) {
    if (RM) return;
    const cv = document.createElement('canvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.className = 'confetti';
    document.body.append(cv);
    const g = cv.getContext('2d'); g.scale(dpr, dpr);
    const cs = getComputedStyle(document.documentElement);
    const cols = ['--sun', '--pink', '--mint', '--aqua', '--lime', '--tang'].map(v => cs.getPropertyValue(v).trim());
    const ink = cs.getPropertyValue('--ink').trim();
    const P = [];
    for (let i = 0; i < n; i++) P.push({
      x: W / 2 + (Math.random() - 0.5) * W * 0.4, y: H * 0.38,
      vx: (Math.random() - 0.5) * 15, vy: -Math.random() * 15 - 5,
      r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 9, c: cols[i % cols.length] });
    const t0 = performance.now();
    (function step(t) {
      g.clearRect(0, 0, W, H);
      for (const p of P) {
        p.vy += 0.42; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        g.save(); g.translate(p.x, p.y); g.rotate(p.r);
        g.fillStyle = p.c; g.strokeStyle = ink; g.lineWidth = 1.5;
        g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
        g.restore();
      }
      if (t - t0 < 2400) requestAnimationFrame(step); else cv.remove();
    })(t0);
  }

  RZ.fx = { RM, center, floatText, burst, fly, glitch, shake, confetti, restart };
})();

(function () {

  }

    s.areas = s.areas || (s.chapter >= 2 ? 5 : 4);
    if (!s.v) { if (s.chapter >= 1) s.chapter++; s.v = 2; }   // v2 inserted the First Customers chapter
    if (s.v === 2) {   // v3 added Season 2 after the Season 1 finale (index 7)

    s.visitAt = s.visitAt || Date.now();

    s.level = s.level || 1; s.regenAt = s.regenAt || Date.now();

  }

  }

    const animal = () => { const c = Math.floor(R() * S.areas), t = 1 + Math.floor(R() * 5); return D.chains[c].items[t - 1][1].replace(/\s*\(.*\)/, '').toLowerCase(); };
    const plural = a => /(fish|sheep)$/.test(a) ? a : /wolf$/.test(a) ? a.slice(0, -1) + 'ves' : /[^aeiou]y$/.test(a) ? a.slice(0, -1) + 'ies' : a + 's';
    const fill = str => {   // one animal and one area per line, so the joke stays consistent
      const a = animal(), ar = D.chains[Math.floor(R() * S.areas)].area;

        .replace(/\{animal\}/g, a).replace(/\{area\}/g, ar).replace(/\{n\}/g, String(n + 1));

    while (picks.length < 2) { const i = Math.floor(R() * E.scenes.length); if (!picks.includes(i)) picks.push(i); }
    const text = picks.map(i => fill(E.scenes[i]));

      .replace(/\{animal\}/g, a).replace(/\{area\}/g, D.chains[Math.floor(R() * S.areas)].area).replace(/\{n\}/g, String(1 + Math.floor(R() * 99)));

  function goalText(g) {

    S.grid[i] = null; if (sel === i) sel = null;
    S.req[c] = null; S.reqAt[c] = Date.now() + D.REQ_DELAY;
    S.happy[c] = Math.min(10, S.happy[c] + 1);
    S.stats.orders++; S.stats.chOrders++;
    renderGrid(); renderPlots();
    fx.burst(from[0], from[1], D.COL[c]); sfx.select();
    fx.fly(from, plotAt(c), D.COL[c], () => {
      renderPlots(c);
      const [px, py] = fx.center(plotAt(c));
      fx.floatText(px, py - 10, 'THANKS!', 'big'); fx.burst(px, py, '--sun', 14);
      setTimeout(() => fx.floatText(px, py + 14, `+${fans} 🎟 +${tape} 📼`, 'small'), 200);
      sfx.order(); buzz([10, 30, 10]);
      S.tape += tape; addFans(fans);
      say('fan', pick(D.reviews).replace('{a}', (it.g ? 'golden ' : '') + name));
      save(); checkChapter();
    });
    save(); return true;
  }
  function wrongArea(c) {
    const el = plotAt(c); if (el) fx.restart(el, 'nope');
    sfx.bad();
    if (c >= S.areas) { say('kev', `The ${D.chains[c].area} isn't open yet.`, false); return; }
    const r = S.req[c], ch = D.chains[c];
    say('kev', r ? `${ch.area} visitors want a ${ch.items[r.t - 1][0]} ${ch.items[r.t - 1][1]}.` : `${ch.area} visitors are happy for now. New request soon.`, false);
  }
  function collect(c) {
    const v = Math.floor(S.visit[c]); if (v < D.VISIT_SHOW) return false;
    S.visit[c] -= v;
    const el = plotAt(c), from = fx.center(el.querySelector('.coin') || el);
    refreshPlots(); fx.burst(from[0], from[1], '--sun', 12); sfx.coin(); buzz(8);
    for (let k = 0; k < 3; k++) setTimeout(() => fx.fly(from, $('#fans'), '--sun', () => {
      sfx.coin();
      if (k === 2) { addFans(v); const [x, y] = fx.center($('#fans')); fx.floatText(x, y + 26, `+${v}`, 'big'); save(); checkChapter(); }
    }), k * 90);
    return true;
  }
  function tapArea(c) {
    sfx.unlock();
    if (c >= S.areas) { wrongArea(c); return; }
    if (sel !== null) { const s = sel; setSel(null); if (!fulfill(s, c)) wrongArea(c); return; }
    if (collect(c)) return;
    const r = S.req[c], ch = D.chains[c];
    if (r) {
      const i = findItem(c, r.t);
      if (i >= 0) { fulfill(i, c); return; }
      say('kev', `${ch.area} visitors want a ${ch.items[r.t - 1][0]} ${ch.items[r.t - 1][1]}. Merge one up and drag it here.`, false);
      poke(plotAt(c).querySelector('.req'));
    } else say('kev', `${ch.area}: ${stagesOf(c)[S.stage[c]][1]}. New visitor request coming soon.`, false);
  }

  function adForTape() {
    ui.ad('+20 📼', () => {
      S.tape += 20; renderHUD(); sfx.ripple();
      const [x, y] = fx.center($('#tape')); fx.floatText(x, y + 24, '+20 📼', 'big'); save();
    });
  }

  function introDone() {
    S.intro = true; save(); sfx.unlock(); sfx.fanfare();
    say('bev', 'Is this thing on? Hello, future! Say hi, Doug.');
    setTimeout(() => say('kev', 'See the bubbles on my areas? Visitors want those animals. Merge one up and drag it here.'), 3500);
    checkChapter();
  }

  function reset() {
    const muted = S.muted; setState(fresh()); S.muted = muted;
    sel = null; chapterOpen = false; combo = 0; shownFans = 0; rolling.clear();
    markStarters(); save(); renderAll(); say('kev', "Nan's old camcorder still works. Apparently. Let's see what's on the tape.", false);
    ui.intro();
  }

  /* ---------- input ---------- */
  function setSel(i) { const p = sel; sel = i; if (p !== null && p !== i) renderCell(p); if (i !== null) renderCell(i); }

  function tap(i) {
    sfx.unlock();
    if (rolling.has(i)) return;
    const it = S.grid[i];
    if (sel === null) {
      if (!it) return;
      if (it.m) { openMystery(i); return; }
      if (it.t === 5) { deliver(i); return; }
      setSel(i); sfx.select(); return;
    }
    if (sel === i) { setSel(null); return; }
    const s = sel; sel = null; renderCell(s); act(s, i);
  }

  let overEl = null;
  function setOver(el) { if (overEl === el) return; overEl && overEl.classList.remove('over'); overEl = el; el && el.classList.add('over'); }

  gridEl.addEventListener('pointerdown', e => {
    const cell = e.target.closest('.cell'); if (!cell) return;
    drag = { i: +cell.dataset.cell, x0: e.clientX, y0: e.clientY, moved: false };
  });
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8 || !S.grid[drag.i] || rolling.has(drag.i)) return;
      drag.moved = true; setSel(null);
      const src = cellAt(drag.i).querySelector('.tile');
      const r = src.getBoundingClientRect(), g = src.cloneNode(true);
      g.classList.remove('pop', 'spawn', 'sel', 'settle'); g.classList.add('ghost');
      g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
      document.body.append(g); src.classList.add('dim');
      Object.assign(drag, { ghost: g, src, w: r.width, h: r.height });
      sfx.select();
    }
    drag.ghost.style.left = (e.clientX - drag.w / 2) + 'px';
    drag.ghost.style.top = (e.clientY - drag.h / 2) + 'px';
    const t = document.elementFromPoint(e.clientX, e.clientY);
    setOver(t ? (t.closest('#bin') || t.closest('.plot') || t.closest('.cell')) : null);
  });
  function endDrag(e, cancel) {
    if (!drag) return; const d = drag; drag = null; setOver(null);
    if (d.moved) {
      d.ghost.remove(); d.src && d.src.classList.remove('dim');
      if (cancel) return;
      const t = document.elementFromPoint(e.clientX, e.clientY);
      if (t && t.closest('#bin')) { discard(d.i); return; }
      const p = t && t.closest('.plot');
      if (p) { const pc = +p.dataset.plot; if (!fulfill(d.i, pc)) wrongArea(pc); return; }
      const c = t && t.closest('.cell'); if (c) act(d.i, +c.dataset.cell);
    } else if (!cancel) tap(d.i);
  }
  window.addEventListener('pointerup', e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  $('#crate').onclick = () => { sfx.unlock(); spawn(); };
  $('#bin').onclick = () => { if (sel !== null) discard(sel); else say('bev', 'Drag an animal onto the bin to let it go. Gently.', false); };
  $('#adBtn').onclick = adForTape;
  $('#mute').onclick = () => { S.muted = !S.muted; renderHUD(); save(); };
  $('#msg').onclick = ui.log;
  plotsEl.addEventListener('click', e => { const p = e.target.closest('.plot'); if (p) tapArea(+p.dataset.plot); });
  plotsEl.addEventListener('keydown', e => {
    const p = e.target.closest('.plot');
    if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tapArea(+p.dataset.plot); }
  });
  $('#albumBtn').onclick = ui.album;

  /* ---------- clocks ---------- */
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  let vt = new Date(1986, 5, 14, 16, 12, 0).getTime();
  function tick() {
    const d = new Date(vt), h = d.getHours(), p = n => String(n).padStart(2, '0');
    $('#stamp').textContent = `${MON[d.getMonth()]} ${p(d.getDate())} 1986 ${h % 12 || 12}:${p(d.getMinutes())}:${p(d.getSeconds())}${h < 12 ? 'AM' : 'PM'}`;
    vt += 1000;
    if (S.tape < MAX_TAPE) { if (Date.now() - S.regenAt >= REGEN_MS) { S.tape++; S.regenAt = Date.now(); $('#tape').textContent = S.tape; save(); } }
    else S.regenAt = Date.now();
    tickAreas();
  }
  let tickN = 0, areaRenderDue = false;
  function tickAreas() {
    const now = Date.now(), dt = Math.max(0, Math.min(now - S.visitAt, D.OFFLINE_CAP_S * 1000)) / 1000;
    S.visitAt = now;
    for (let c = 0; c < S.areas; c++) {
      S.visit[c] = Math.min(visitCap(c), S.visit[c] + visitRate(c) * dt);
      if (!S.req[c] && now >= S.reqAt[c]) { newRequest(c); areaRenderDue = true; }
    }
    if (areaRenderDue && !drag) {
      areaRenderDue = false;
      renderPlots(); renderGrid();
      plotsEl.querySelectorAll('.req').forEach(poke);
    } else refreshPlots();
    if (++tickN % 5 === 0) save();
  }

  /* ---------- boot ---------- */
  function markStarters() { S.grid.forEach(v => { if (v && !v.m) { const k = keyOf(v.c, v.t); if (!S.found.includes(k)) S.found.push(k); } }); }

  RZ.game = { completeChapter, adForTape, introDone, reset, goalInfo, chapter, fmt, checkChapter, stagesOf, chapterLabel: () => S.chapter < S2_START ? `Season 1 · Chapter ${S.chapter + 1}` : `Season 2 · Chapter ${S.chapter - S2_START + 1}` };

  gridEl.innerHTML = range(N).map(i => `<div class="cell" data-cell="${i}"></div>`).join('');
  markStarters();
  S.level = Math.max(S.level, levelOf(S.fans));
  renderAll(); tick(); setInterval(tick, 1000);
  const last = S.log[S.log.length - 1];
  if (last) say(last[0], last[1], false);
  else say('kev', "Nan's old camcorder still works. Apparently. Let's see what's on the tape.", false);
  if (!S.intro) ui.intro(); else checkChapter();
})();

</script>
</body>
