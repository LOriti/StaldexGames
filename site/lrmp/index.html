<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Unlisted: not linked from the site, not for search engines. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>L&amp;R Meal Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/lrmp/assets/index-9152phIV.js"></script>
  <link rel="stylesheet" crossorigin href="/lrmp/assets/index-910ibjG5.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Keto · plan &middot; cook &middot; reheat</div>
      <h1>L&amp;R&nbsp;<em>Meal&nbsp;Planner</em></h1>
      <div class="summary">Paint the month by category, and each day flows into the weekly plan —
        <b>leftovers become lunches, surplus goes to the freezer.</b></div>
    </header>

    <div class="controls">
      <div class="seg" id="tabBar" role="group" aria-label="View">
        <button data-tab="recipes" aria-pressed="false">Recipes</button>
        <button data-tab="month" aria-pressed="false">Month</button>
        <button data-tab="weekly" aria-pressed="true">Weekly</button>
        <button data-tab="shopping" aria-pressed="false">Shopping</button>
      </div>
    </div>

    <div id="recipesView" hidden></div>
    <div id="monthView" hidden></div>
    <div id="weeklyView" hidden></div>
    <div id="shoppingView" hidden></div>

    <div id="recipeModal" class="modal" hidden>
      <div class="modal-back" data-close="1"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="Recipe">
        <button class="modal-x" data-close="1" aria-label="Close recipe">&#10005;</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <footer>
      <div class="key">
        <span><i class="swatch" style="background:var(--curry)"></i>Curry</span>
        <span><i class="swatch" style="background:var(--fry)"></i>Fry / BBQ</span>
        <span><i class="swatch" style="background:var(--assembly)"></i>Assembly</span>
        <span><i class="swatch" style="background:var(--soup)"></i>Soup &amp; Stew</span>
        <span><i class="swatch" style="background:var(--bake)"></i>Bake</span>
      </div>
      Leftover key: <b style="color:#5a9a5a">keeps</b> reheats well &middot;
      <b style="color:#c98a4a">fresh</b> best same day &middot;
      <b style="color:#7a8aa6">parts</b> components keep.
      <div class="sync-row">
        <span id="syncStatus" title="This plan syncs automatically across devices">&#9729; &hellip;</span>
      </div>
    </footer>
  </div>
  <div id="toast"></div>
</body>
</html>
