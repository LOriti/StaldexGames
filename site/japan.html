<style>
:root{
  --paper:#f3ecdd; --paper-2:#efe6d3; --paper-edge:#e6d9bd;
  --ink:#1a2230; --ink-soft:#5c6675; --line:#d9ccae;
  --shu:#c8432c; --kin:#a97c2f; --kin-lite:#c9a35c; --matcha:#4f7d63;
  --spine:#cdba98; --felt:#20242c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(120% 120% at 50% 0%, #2a2f38 0%, var(--felt) 60%, #14171d 100%);
  color:var(--ink);font-family:'Newsreader',Georgia,serif;font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.book{position:relative;display:flex;filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))}
.book::after{content:"";position:absolute;left:6%;right:6%;bottom:-26px;height:26px;background:radial-gradient(60% 100% at 50% 0,rgba(0,0,0,.4),transparent 70%)}
.spread{display:none}.spread.on{display:flex}
.page{position:relative;width:var(--pw);height:var(--ph);background:linear-gradient(180deg,var(--paper) 0%, #f0e8d7 100%);overflow:hidden;display:flex;flex-direction:column}
.page.paperfelt::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(120,100,60,.05) 1px,transparent 1px);background-size:4px 4px;mix-blend-mode:multiply}
.page.left{border-radius:8px 0 0 8px;box-shadow:inset -22px 0 34px -26px rgba(60,42,15,.55)}
.page.right{border-radius:0 8px 8px 0;box-shadow:inset 22px 0 34px -26px rgba(60,42,15,.55)}
.spine{width:16px;height:var(--ph);flex:0 0 16px;background:linear-gradient(90deg,rgba(60,42,15,.05) 0%,rgba(60,42,15,.28) 42%,rgba(30,20,6,.42) 50%,rgba(60,42,15,.28) 58%,rgba(60,42,15,.05) 100%)}
.runhead{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:16px 30px 10px;font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
.runhead .chap{color:var(--shu);font-weight:700}
.pagebody{flex:1;min-height:0;overflow-y:auto;padding:6px 30px 12px}
.pagebody::-webkit-scrollbar{width:7px}
.pagebody::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.pagefoot{flex:0 0 auto;text-align:center;padding:8px;font-family:'Fraunces',serif;font-size:11.5px;color:var(--ink-soft);border-top:1px solid var(--line);margin:0 30px}
.controls{flex:0 0 auto;display:flex;align-items:center;gap:14px;width:100%;max-width:720px}
.btn{background:rgba(243,236,221,.92);border:1px solid #b9a884;color:var(--ink);font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.16s;white-space:nowrap}
.btn:hover:not(:disabled){background:#fff;border-color:var(--shu);color:var(--shu)}
.btn:disabled{opacity:.32;cursor:default}
.progress{flex:1;height:3px;background:rgba(243,236,221,.28);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--shu);transition:width .35s}
.counter{font-family:'Fraunces',serif;font-size:13px;color:var(--paper);min-width:74px;text-align:center;opacity:.85}
h1{font-family:'Fraunces',serif;font-weight:600;line-height:1.02;letter-spacing:-.01em}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:25px;line-height:1.1;letter-spacing:-.01em}
.eyebrow{font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--shu);font-weight:700;margin-bottom:12px}
.sub{color:var(--ink-soft);font-size:14px;margin-bottom:16px;font-style:italic}
.platepage{padding:0;position:relative;justify-content:flex-end}
.platepage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.platecap{position:relative;padding:22px 26px 26px;color:var(--paper);background:linear-gradient(0deg,rgba(12,14,20,.82) 0%,rgba(12,14,20,.5) 55%,transparent 100%)}
.platecap .kick{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;color:var(--kin-lite);margin-bottom:8px}
.platecap h2{color:var(--paper);font-size:30px}
.platecap .date{font-family:'Inter',sans-serif;font-size:11.5px;letter-spacing:.06em;color:rgba(243,236,221,.82);margin-top:8px}
.platecap .essence{font-style:italic;font-size:14.5px;color:rgba(243,236,221,.92);margin-top:12px;max-width:36ch}
.platepage.onmap .platecap{background:linear-gradient(0deg,rgba(241,232,214,.97) 0%,rgba(241,232,214,.72) 55%,rgba(241,232,214,0) 100%);color:var(--ink)}
.platepage.onmap .platecap .kick{color:var(--shu)}
.platepage.onmap .platecap h2,.platepage.onmap .platecap .date{color:var(--ink)}
.platepage.onmap .platecap .essence{color:var(--ink-soft)}
.platebadge{position:absolute;top:22px;left:26px;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:rgba(200,67,44,.9);color:#fff}
.platebadge.gold{background:rgba(169,124,47,.92)}.platebadge.green{background:rgba(79,125,99,.92)}
.ribbon{position:absolute;top:22px;right:24px;display:flex;gap:0;align-items:center}
.ribbon .dot{width:7px;height:7px;border-radius:50%;background:rgba(243,236,221,.42)}
.ribbon .seg{width:14px;height:1.5px;background:rgba(243,236,221,.42)}
.ribbon .dot.here{background:var(--shu);box-shadow:0 0 0 3px rgba(200,67,44,.28);transform:scale(1.25)}
.ribbon .dot.done,.ribbon .seg.done{background:var(--kin-lite)}
.platepage.onmap .ribbon .dot,.platepage.onmap .ribbon .seg{background:rgba(26,34,48,.26)}
.platepage.onmap .ribbon .dot.here{background:var(--shu)}
.platepage.onmap .ribbon .dot.done,.platepage.onmap .ribbon .seg.done{background:var(--kin)}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:2px 0 14px}
.daynum{font-family:'Fraunces',serif;font-size:13px;color:var(--shu);font-weight:700;letter-spacing:.04em}
.daynum.gold{color:var(--kin)}.daynum.green{color:var(--matcha)}
.dayhead h2{flex:1 1 100%;margin:2px 0}
.dayhead .meta{font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
.chip{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(169,124,47,.16);color:var(--kin)}
.block{margin-bottom:16px}
.block h4{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--kin);margin-bottom:9px;font-weight:700;display:flex;align-items:center;gap:8px}
.block h4::after{content:"";flex:1;height:1px;background:var(--line)}
.plan{list-style:none}
.plan li{display:flex;gap:12px;padding:5px 0;font-size:14px;color:var(--ink);border-bottom:1px dotted var(--line)}
.plan li:last-child{border-bottom:none}
.plan li .t{flex:0 0 52px;font-family:'Inter',sans-serif;color:var(--shu);font-weight:700;font-size:10.5px;letter-spacing:.04em;padding-top:3px;text-transform:uppercase}
.tips{list-style:none}
.tips li{padding:4px 0 4px 18px;position:relative;font-size:13px;color:var(--ink-soft)}
.tips li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border:1.5px solid var(--matcha);border-radius:50%}
.steps{list-style:none;counter-reset:st}
.steps li{position:relative;padding:6px 0 6px 36px;font-size:13px;color:var(--ink);border-bottom:1px dotted var(--line);min-height:30px}
.steps li:last-child{border-bottom:none}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:5px;width:23px;height:23px;border-radius:50%;background:var(--shu);color:#fff;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.inlinemap{margin:2px 0 4px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper-2)}
.inlinemap svg{display:block;width:100%;height:auto}
.fact{margin-top:14px;background:var(--paper-2);border:1px solid var(--line);border-left:3px solid var(--kin);border-radius:0 8px 8px 0;padding:11px 15px;font-size:12.5px;color:var(--ink-soft)}
.fact b{font-family:'Inter',sans-serif;color:var(--kin);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:4px;font-weight:700}
.fact i{color:var(--ink)}
.phrase{margin-top:12px;font-size:13px;color:var(--ink-soft);padding:9px 13px;background:rgba(200,67,44,.06);border-radius:8px}
.phrase b{font-family:'Fraunces',serif;color:var(--shu);font-style:normal}
.covercap{position:relative;padding:30px 30px 34px}
.covercap .mark{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--kin-lite);font-weight:700;margin-bottom:14px}
.covercap h1{color:var(--paper);font-size:clamp(30px,4.6vw,46px)}
.covercap .dates{font-family:'Inter',sans-serif;color:rgba(243,236,221,.9);font-size:13px;letter-spacing:.08em;margin-top:14px}
.routeline{display:flex;flex-wrap:wrap;gap:6px 0;align-items:center;margin-top:22px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500}
.routeline .stop{padding:4px 9px;border:1px solid rgba(243,236,221,.35);border-radius:999px;color:var(--paper)}
.routeline .arr{color:var(--shu);padding:0 5px}
.coverhint{margin-top:24px;font-family:'Inter',sans-serif;font-size:11px;color:rgba(243,236,221,.7)}
.coverhint kbd{border:1px solid rgba(243,236,221,.4);border-radius:5px;padding:1px 6px;font-size:10px}
.halftitle{align-items:center;justify-content:center;text-align:center;padding:40px}
.halftitle .stamp{font-family:'Fraunces',serif;font-size:120px;line-height:1;color:var(--shu);opacity:.9;text-shadow:0 2px 0 rgba(0,0,0,.06)}
.halftitle .rule{width:44px;height:2px;background:var(--kin);margin:22px auto}
.halftitle .stampsub{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin-top:18px}
.halftitle .credit{font-style:italic;color:var(--ink-soft);font-size:13px;margin-top:6px}
.toc{list-style:none;margin-top:4px}
.toc li{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line);cursor:pointer;font-size:13.5px}
.toc li:hover .tt{color:var(--shu)}
.toc .tt{flex:0 0 auto;font-weight:500}
.toc .tt.sub{padding-left:16px;color:var(--ink-soft);font-style:italic}
.toc .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.toc .pg{font-family:'Fraunces',serif;color:var(--ink-soft);font-size:12px}
.toc .grp{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--kin);font-weight:700;padding:13px 0 3px;cursor:default}
.glance{list-style:none;margin-top:6px}
.glance li{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.glance li .lab{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--kin);font-weight:700;flex:0 0 96px;padding-top:2px}
.glance li b{color:var(--ink)}
.legend{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.legend span{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.legend .l-arr{background:rgba(200,67,44,.14);color:var(--shu)}
.legend .l-trv{background:rgba(169,124,47,.16);color:var(--kin)}
.legend .l-mtn{background:rgba(79,125,99,.16);color:var(--matcha)}
.legend .l-map{background:rgba(26,34,48,.1);color:var(--ink)}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:15px 16px;margin-bottom:13px}
.card h3{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--shu);margin-bottom:9px;font-weight:700}
.card ul{list-style:none}
.card li{padding:5px 0;border-bottom:1px dotted var(--line);font-size:12.5px;color:var(--ink-soft)}
.card li:last-child{border-bottom:none}
.card li b{color:var(--ink);font-weight:600}
.tablecard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper-2)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--kin);text-align:left;padding:9px 11px;border-bottom:1.5px solid var(--line);font-weight:700}
td{padding:8px 11px;border-bottom:1px solid var(--line);color:var(--ink-soft);vertical-align:top}
td:first-child{color:var(--ink);font-weight:600;white-space:nowrap;font-family:'Inter',sans-serif;font-size:11px}
tr:last-child td{border-bottom:none}
.only-narrow{display:none}
@media (max-width:820px){
  .spine{display:none}
  .page.left,.page.right{border-radius:8px}
  .spread.on{display:block}
  .spread.on .page{display:none}
  .spread.on .page.showing{display:flex}
}
@media print{
  @page{size:A4 portrait;margin:14mm}
  body{background:#fff;overflow:visible;height:auto}
  .wrap{display:block;height:auto;padding:0}
  .controls,.coverhint{display:none !important}
  .stage{display:block;height:auto}
  .book{display:block;filter:none}.book::after{display:none}
  .spread{display:block !important}.spine{display:none}
  .page{display:flex !important;width:100%;height:auto;min-height:0;border-radius:0;box-shadow:none;page-break-after:always;break-after:page}
  .spread:last-child .page.right{page-break-after:auto;break-after:auto}
  .page::before{display:none}
  .platepage{min-height:245mm}
  .platepage svg{position:relative;height:150mm}
  .platecap{background:none;color:var(--ink)}
  .platecap h2,.platecap .date,.platecap .essence{color:var(--ink)}
  .platecap .kick{color:var(--kin)}
  .pagebody{overflow:visible;padding-top:2px}
  h2{font-size:22px}.sub{margin-bottom:8px}
  .toc li{padding:1.5px 0;font-size:11.5px}.toc .grp{padding:5px 0 1px}
  .runhead{padding:10px 30px 6px}.pagefoot{padding:6px}
  .card{padding:11px 13px;margin-bottom:9px}.card li{padding:3px 0}
  .steps li{padding:4px 0 4px 34px}
  #book svg[viewBox="0 0 480 620"]{max-height:150mm;width:auto;display:block;margin:0 auto}
}
</style>
</head>

function texture(){let s="";for(let i=0;i<26;i++){const x=Math.random()*600;s+=`<line x1="${x}" y1="0" x2="${x-40}" y2="800" stroke="#fff" stroke-width="1" opacity="0.03"/>`;}return s;}
function disc(cx,cy,r,c){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>`;}
function plate(scene){
  const S=SCENES[scene]||SCENES.tokyo_city;const g1=S.sky[0],g2=S.sky[1];
  return `<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky_${scene}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${g1}"/><stop offset="1" stop-color="${g2}"/></linearGradient>
      <linearGradient id="hz_${scene}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.28"/></linearGradient>
    </defs>
    <rect width="600" height="800" fill="url(#sky_${scene})"/>
    ${S.body}
    <rect width="600" height="800" fill="url(#hz_${scene})"/>
    ${texture()}
    <rect x="14" y="14" width="572" height="772" fill="none" stroke="#f3ecdd" stroke-opacity="0.35" stroke-width="1.5"/>
  </svg>`;
}

/* ================= MAP ENGINE (parchment) ================= */
function mapBase(inner){
  return `<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
   <defs><linearGradient id="pm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e8d6"/><stop offset="1" stop-color="#e5d7bb"/></linearGradient></defs>
   <rect width="600" height="800" fill="url(#pm)"/>
   <g fill="none" stroke="#cbb892" stroke-width="1" opacity="0.5">
     ${[40,90,150,215].map(r=>`<circle cx="500" cy="600" r="${r}"/>`).join("")}
     ${[30,70,120].map(r=>`<circle cx="90" cy="220" r="${r}"/>`).join("")}
   </g>
   <g transform="translate(540 86)"><circle r="22" fill="none" stroke="#8a6a3a" stroke-width="1.5"/>
     <path d="M0 -20 L5 0 L0 20 L-5 0 Z" fill="#c8432c"/><path d="M-20 0 L0 5 L20 0 L0 -5 Z" fill="#8a6a3a" opacity="0.5"/>
     <text x="0" y="-25" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#8a6a3a">N</text></g>
   ${inner}
   <rect x="14" y="14" width="572" height="772" fill="none" stroke="#8a6a3a" stroke-opacity="0.3" stroke-width="1.5"/>
  </svg>`;
}
function terrainIcon(t,x,y){
  const g=s=>`<g transform="translate(${x} ${y})" fill="#8a6a3a">${s}</g>`;
  switch(t){
    case"city":return g(`<rect x="-11" y="-6" width="7" height="12"/><rect x="-2" y="-11" width="7" height="17"/><rect x="7" y="-3" width="6" height="9"/>`);
    case"mountain":return g(`<path d="M-12 6 L-2 -10 L8 6 Z"/><path d="M-2 -10 L2 -3 L-6 -3 Z" fill="#fff"/>`);
    case"festival":return g(`<rect x="-9" y="-11" width="2" height="19"/><path d="M-7 -10 L9 -4 L-7 2 Z" fill="#c8432c"/>`);
    case"temple":return g(`<rect x="-9" y="-6" width="2.5" height="13"/><rect x="6.5" y="-6" width="2.5" height="13"/><rect x="-12" y="-8" width="24" height="3"/><rect x="-9" y="-2" width="18" height="2.5"/>`);
    case"onsen":return g(`<circle cx="0" cy="5" r="8" fill="none" stroke="#8a6a3a" stroke-width="2"/><path d="M-4 -2 q-3 -4 0 -8 M0 -2 q-3 -4 0 -8 M4 -2 q-3 -4 0 -8" fill="none" stroke="#8a6a3a" stroke-width="1.6"/>`);
    case"sea":return g(`<path d="M-12 0 q4 -6 8 0 t8 0 t8 0" fill="none" stroke="#8a6a3a" stroke-width="2"/><path d="M-12 7 q4 -6 8 0 t8 0 t8 0" fill="none" stroke="#8a6a3a" stroke-width="2"/>`);
    case"transfer":return g(`<circle cx="-4" cy="0" r="6" fill="none" stroke="#8a6a3a" stroke-width="2"/><circle cx="4" cy="0" r="6" fill="none" stroke="#8a6a3a" stroke-width="2"/>`);
    default:return g(`<circle r="5"/>`);
  }
}
function modeIcon(i,x,y){
  const g=s=>`<g transform="translate(${x} ${y})">${s}</g>`;
  switch(i){
    case"shinkansen":return g(`<path d="M-14 3 Q-6 -6 14 -2 L14 4 L-14 4 Z" fill="#1a2230"/><circle cx="-9" cy="6" r="2" fill="#1a2230"/><circle cx="10" cy="6" r="2" fill="#1a2230"/>`);
    case"train":return g(`<rect x="-13" y="-5" width="26" height="11" rx="2" fill="#1a2230"/><rect x="-9" y="-2" width="6" height="4" fill="#f1e8d6"/><rect x="3" y="-2" width="6" height="4" fill="#f1e8d6"/>`);
    case"bus":return g(`<rect x="-13" y="-5" width="26" height="11" rx="3" fill="#4f7d63"/><rect x="-10" y="-2" width="20" height="4" fill="#f1e8d6"/><circle cx="-7" cy="7" r="2" fill="#1a2230"/><circle cx="7" cy="7" r="2" fill="#1a2230"/>`);
    default:return g(`<circle r="4" fill="#1a2230"/>`);
  }
}
function legMap(r){
  const S=r.stops,N=S.length,top=180,bot=560,cx=250;
  const ys=S.map((_,i)=>top+(bot-top)*i/(N-1));
  let path=`M ${cx} ${ys[0]}`;for(let i=1;i<N;i++)path+=` L ${cx} ${ys[i]}`;
  const nodes=S.map((s,i)=>`
    ${terrainIcon(s.t,cx-52,ys[i])}
    <circle cx="${cx}" cy="${ys[i]}" r="8" fill="${i===0||i===N-1?'#c8432c':'#f1e8d6'}" stroke="#c8432c" stroke-width="3"/>
    <text x="${cx-72}" y="${ys[i]+5}" text-anchor="end" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#1a2230">${s.n}</text>`).join("");
  const segs=r.hops.map((h,i)=>{const my=(ys[i]+ys[i+1])/2;return `
    ${modeIcon(h.i,cx+34,my-8)}
    <text x="${cx+54}" y="${my-4}" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#1a2230">${h.m}</text>
    <text x="${cx+54}" y="${my+13}" font-family="Inter,sans-serif" font-size="12" fill="#8a6a3a">${h.time}</text>`;}).join("");
  const inner=`
    <text x="58" y="92" font-family="Fraunces,serif" font-size="25" fill="#1a2230">${S[0].n} \u2192 ${S[N-1].n}</text>
    <text x="60" y="118" font-family="Inter,sans-serif" font-size="11" letter-spacing="2.5" fill="#c8432c" font-weight="700">TOTAL ${r.total.toUpperCase()} \u00b7 ${r.hops.length} LEG${r.hops.length>1?'S':''}</text>
    <path d="${path}" fill="none" stroke="#c8432c" stroke-width="3" stroke-dasharray="1 8" stroke-linecap="round"/>
    ${nodes}${segs}`;
  return mapBase(inner);
}
function trailNode(x,y,label,side,special){
  const isEnd = special==='end';
  const turn = special===true;
  const col = turn?'#a97c2f':'#c8432c';
  const r = (side==='start'||isEnd)?9:7;
  let lx,anchor;
  if(side==='l'){lx=x-16;anchor='end';}else{lx=x+16;anchor='start';}
  const star = turn?`<path d="M${x} ${y-16} l3 6 l6 1 l-4 5 l1 6 l-6 -3 l-6 3 l1 -6 l-4 -5 l6 -1 Z" fill="#a97c2f"/>`:'';
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${isEnd||side==='start'?col:'#f1e8d6'}" stroke="${col}" stroke-width="3"/>${star}
    <text x="${lx}" y="${y+4}" text-anchor="${anchor}" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#1a2230">${label}</text>`;
}

/* ================= TEMPLATES ================= */
const badgeCls = t => t==="gold"?" gold":t==="green"?" green":"";
const numCls   = t => t==="gold"?" gold":t==="green"?" green":"";
function ribbon(active){
  let h='<div class="ribbon">';
  ROUTE.forEach((_,i)=>{const cls=i<active?"done":i===active?"here":"";h+=`<span class="dot ${cls}"></span>`;if(i<ROUTE.length-1)h+=`<span class="seg ${i<active?"done":""}"></span>`;});
  return h+'</div>';
}
function heroPlate(o){
  return `<div class="pagebody platepage${o.onmap?' onmap':''}">
     ${o.svg}
     ${o.badge?`<span class="platebadge${badgeCls(o.badgeType)}">${o.badge}</span>`:""}
     ${ribbon(o.stop)}
     <div class="platecap">
       <div class="kick">${o.kick}</div><h2>${o.title}</h2>
       ${o.date?`<div class="date">${o.date}</div>`:""}
       ${o.essence?`<div class="essence">${o.essence}</div>`:""}
     </div>
   </div>`;
}
function dayDetail(d){
  return `<div class="pagebody">
    <div class="dayhead">
      <span class="daynum${numCls(d.badgeType)}">DAY ${d.n}</span>
      <span class="meta">${d.date}</span>
      ${d.route?`<span class="chip">${d.route.total} in transit</span>`:""}
      <h2>${d.title}</h2>
    </div>
    <div class="block"><h4>The Plan</h4><ul class="plan">
      ${d.plan.map(p=>`<li><span class="t">${p[0]}</span><span>${p[1]}</span></li>`).join("")}
    </ul></div>
    <div class="block"><h4>Good to Know</h4><ul class="tips">
      ${d.know.map(k=>`<li>${k}</li>`).join("")}
    </ul></div>
    ${d.phrase?`<div class="phrase"><b>${d.phrase[0]}</b> \u2014 ${d.phrase[1]}</div>`:""}
    <div class="fact"><b>Fun fact</b>${d.fact}</div>
  </div>`;
}
function featBlock(b){
  if(b.kind==='plan')return `<div class="block"><h4>${b.h}</h4><ul class="plan">${b.items.map(p=>`<li><span class="t">${p[0]}</span><span>${p[1]}</span></li>`).join("")}</ul></div>`;
  if(b.kind==='steps')return `<div class="block"><h4>${b.h}</h4><ol class="steps">${b.items.map(x=>`<li>${x}</li>`).join("")}</ol></div>`;
  if(b.kind==='map')return `<div class="block"><h4>${b.h}</h4><div class="inlinemap">${TRAILMAPS[b.map]()}</div></div>`;
  return `<div class="block"><h4>${b.h}</h4><ul class="tips">${b.items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
}
function featureDetail(f){
  return `<div class="pagebody">
    <div class="dayhead"><span class="daynum gold">\u25c6</span><span class="meta">${f.kick}</span><h2>${f.title}</h2></div>
    ${f.blocks.map(featBlock).join("")}
    ${f.phrase?`<div class="phrase"><b>${f.phrase[0]}</b> \u2014 ${f.phrase[1]}</div>`:""}
    ${f.fact?`<div class="fact"><b>Fun fact</b>${f.fact}</div>`:""}
  </div>`;
}
function featureHero(d){
  const f=d.feature, svg=f.map?BIGMAPS[f.map]():plate(f.scene);
  return heroPlate({svg:svg,kick:f.kick,title:f.title,essence:f.essence,stop:d.stop,onmap:!!f.map,badge:f.map?"Walking Map":"",badgeType:"green"});
}
/* ================= BUILD SPREADS ================= */
const spreads=[]; const toc=[];
spreads.push({
 left:`<div class="pagebody halftitle paperfelt"><div class="stamp">旅</div><div class="rule"></div><div class="stampsub">A Travel Book</div><div class="credit">assembled by Leon Oriti</div></div>`,
 right:`<div class="pagebody platepage">${plate("fuji_waves")}
   <div class="covercap"><div class="mark">Trip Book \u00b7 One-Stop Companion</div>
     <h1>Japan,<br>Midsummer<br><span style="color:#f0c9a0">Sixteen Nights</span></h1>
     <div class="dates">24 July \u2013 9 August 2026</div>
     <div class="routeline">${ROUTE.map((s,i)=>`<span class="stop">${s}</span>${i<ROUTE.length-1?'<span class="arr">\u2192</span>':''}`).join("")}</div>
     <div class="coverhint">Turn with the buttons, <kbd>\u2190</kbd> <kbd>\u2192</kbd> keys, or a swipe.</div></div></div>`,
 chapL:"Cover",chapR:"Cover"});
spreads.push({
 left:`<div class="pagebody paperfelt"><h2>Contents</h2><p class="sub">Tap any line to jump there.</p><ul class="toc" id="toc"></ul></div>`,
 right:`<div class="pagebody paperfelt"><h2>At a Glance</h2><p class="sub">The whole trip in a breath.</p>
   <ul class="glance">
     <li><span class="lab">Dates</span><span><b>16 nights</b> \u00b7 24 Jul \u2013 9 Aug 2026 (peak summer)</span></li>
     <li><span class="lab">Shape</span><span>Tokyo hub \u2192 mountains \u2192 old capital \u2192 sea \u2192 alps \u2192 onsen \u2192 Tokyo</span></li>
     <li><span class="lab">Reading it</span><span>Travel days open on a <b>map</b>; days out open on a <b>scene</b></span></li>
     <li><span class="lab">Big days</span><span>Fuji Rock, Fushimi, Kamik\u014dchi & Kusatsu each run two spreads</span></li>
     <li><span class="lab">One rule</span><span>Sightsee early, hide from the midday heat, come alive again at dusk</span></li>
   </ul>
   <div class="legend"><span class="l-arr">Arrival / City</span><span class="l-trv">Travel / Festival</span><span class="l-mtn">Mountains / Onsen</span><span class="l-map">\u25c6 Feature spread</span></div></div>`,
 chapL:"Contents",chapR:"Contents"});
function briefPage(b){return `<div class="pagebody paperfelt"><h2>${b.title}</h2><p class="sub">${b.sub}</p>
  ${b.cards.map(c=>`<div class="card"><h3>${c.h}</h3><ul>${c.items.map(it=>`<li><b>${it[0]}</b> \u2014 ${it[1]}</li>`).join("")}</ul></div>`).join("")}</div>`;}
spreads.push({left:briefPage(briefings[0]),right:briefPage(briefings[1]),chapL:"Before You Fly",chapR:"On the Ground",
  tocL:{group:"Pre-Travel",title:"Before You Fly"},tocR:{group:"Pre-Travel",title:"On the Ground"}});
function loopMap(){
  return `<svg viewBox="0 0 480 620" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
    <rect width="480" height="620" fill="#efe6d3"/>
    <path d="M40 40 h400 v540 h-400 Z" fill="none" stroke="#d9ccae" stroke-width="1.5"/>
    <path d="M260 250 L300 110 M300 110 L150 440 M150 440 L95 300 M95 300 L235 360 M235 360 L350 300 M350 300 L260 250" fill="none" stroke="#c8432c" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/>
    <g font-family="Inter,sans-serif" font-size="12" font-weight="700">
      ${[[260,250,"Tokyo",0],[300,110,"Naeba",1],[150,440,"Kyoto",1],[95,300,"Kanazawa",1],[235,360,"Kamik\u014dchi",0],[350,300,"Kusatsu",1]].map(p=>`
        <circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#c8432c"/>
        <text x="${p[0]+(p[3]?12:-12)}" y="${p[1]+4}" fill="#1a2230" text-anchor="${p[3]?'start':'end'}">${p[2]}</text>`).join("")}
    </g>
    <text x="40" y="600" font-family="Inter,sans-serif" font-size="9" letter-spacing="2" fill="#a97c2f">SCHEMATIC \u2014 NOT TO SCALE</text>
  </svg>`;
}
spreads.push({
 left:`<div class="pagebody paperfelt"><h2>Intercity Legs</h2><p class="sub">Every big move of the trip, in one table.</p>
   <div class="tablecard"><table><tr><th>Leg</th><th>Route</th><th>Time</th><th>Notes</th></tr>
   ${transit.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table></div></div>`,
 right:`<div class="pagebody paperfelt"><h2>The Loop</h2><p class="sub">Clockwise out of Tokyo and back again.</p>${loopMap()}</div>`,
 chapL:"Transit",chapR:"Transit",tocL:{group:"Pre-Travel",title:"Intercity Legs"}});
days.forEach(d=>{
  const heroA = d.route
    ? heroPlate({svg:legMap(d.route),kick:`Day ${d.n} \u00b7 Moving day`,title:d.title,date:d.date,essence:d.essence,badge:d.badge||"Travel",badgeType:d.badgeType||"gold",stop:d.stop,onmap:true})
    : heroPlate({svg:plate(d.scene),kick:`Day ${d.n} \u00b7 ${d.place}`,title:d.title,date:d.date,essence:d.essence,badge:d.badge,badgeType:d.badgeType,stop:d.stop,onmap:false});
  spreads.push({left:heroA,right:dayDetail(d),chapL:d.place,chapR:d.place,tocL:{group:d.place,title:`Day ${d.n} \u00b7 ${d.title}`}});
  if(d.feature){
    spreads.push({left:featureHero(d),right:featureDetail(d.feature),chapL:d.place,chapR:d.place,tocL:{group:d.place,title:d.feature.title,sub:true}});
  }
});
/* ================= RENDER ================= */
const book=document.getElementById('book');
let total=spreads.length, leafTotal=total*2;
spreads.forEach((sp,i)=>{
  const w=document.createElement('div');w.className='spread';w.dataset.i=i;
  w.innerHTML=`
    <div class="page left paperfelt showing">
      <div class="runhead"><span class="chap">${sp.chapL||''}</span><span>Japan \u00b7 Jul\u2013Aug 2026</span></div>
      ${sp.left}<div class="pagefoot">\u2014 ${i*2+1} \u2014</div></div>
    <div class="spine"></div>
    <div class="page right paperfelt">
      <div class="runhead"><span>Japan \u00b7 Jul\u2013Aug 2026</span><span class="chap">${sp.chapR||''}</span></div>
      ${sp.right}<div class="pagefoot">\u2014 ${i*2+2} \u2014</div></div>`;
  book.appendChild(w);
  if(sp.tocL)toc.push(Object.assign({},sp.tocL,{idx:i}));
  if(sp.tocR)toc.push(Object.assign({},sp.tocR,{idx:i}));
});
(function buildTOC(){
  const el=document.getElementById('toc');if(!el)return;let last="";
  toc.forEach(t=>{
    if(!t.sub && t.group!==last){last=t.group;const g=document.createElement('li');g.className='grp';g.innerHTML=`<span class="grp">${t.group}</span>`;el.appendChild(g);}
    const li=document.createElement('li');
    li.innerHTML=`<span class="tt${t.sub?' sub':''}">${t.sub?'\u21b3 ':''}${t.title}</span><span class="dots"></span><span class="pg">${t.idx*2+1}</span>`;
    li.addEventListener('click',()=>go(t.idx));el.appendChild(li);
  });
})();
/* ================= NAV ================= */
const spreadEls=[...document.querySelectorAll('.spread')];
let cur=0,leaf=0;
const prev=document.getElementById('prev'),next=document.getElementById('next'),
      bar=document.getElementById('bar'),counter=document.getElementById('counter'),flip=document.getElementById('flip');
function narrow(){return window.matchMedia('(max-width:820px)').matches;}
function render(){
  spreadEls.forEach((el,i)=>el.classList.toggle('on',i===cur));
  if(narrow()){const pages=spreadEls[cur].querySelectorAll('.page');pages.forEach((p,pi)=>p.classList.toggle('showing',pi===leaf));}
  const pos=narrow()?cur*2+leaf+1:cur+1, tot=narrow()?leafTotal:total;
  bar.style.width=(pos-1)/(tot-1)*100+'%';
  counter.textContent=narrow()?`p. ${cur*2+leaf+1} / ${leafTotal}`:`${cur+1} / ${total}`;
  prev.disabled=narrow()?(cur===0&&leaf===0):cur===0;
  next.disabled=narrow()?(cur===total-1&&leaf===1):cur===total-1;
  flip.style.display=narrow()?'inline-block':'none';
  fit();
}
function go(i){if(i<0||i>=total)return;cur=i;leaf=0;render();spreadEls[cur].querySelectorAll('.pagebody').forEach(pb=>pb.scrollTop=0);}
function stepNext(){if(narrow()){if(leaf===0){leaf=1;render();return;}if(cur<total-1){cur++;leaf=0;render();}}else if(cur<total-1)go(cur+1);}
function stepPrev(){if(narrow()){if(leaf===1){leaf=0;render();return;}if(cur>0){cur--;leaf=1;render();}}else if(cur>0)go(cur-1);}
next.addEventListener('click',stepNext);prev.addEventListener('click',stepPrev);flip.addEventListener('click',stepNext);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')stepNext();if(e.key==='ArrowLeft')stepPrev();});
let x0=null;
document.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(dx<-45)stepNext();else if(dx>45)stepPrev();x0=null;},{passive:true});
/* ================= FIT ================= */
const RATIO=3/4;
function fit(){
  const stage=document.querySelector('.stage');
  const availH=stage.clientHeight-10,availW=stage.clientWidth-10;let ph,pw;
  if(narrow()){ph=Math.min(availH,availW/RATIO);pw=ph*RATIO;if(pw>availW){pw=availW;ph=pw/RATIO;}}
  else{ph=availH;pw=ph*RATIO;let sw=pw*2+16;if(sw>availW){sw=availW;pw=(sw-16)/2;ph=pw/RATIO;}if(ph>availH){ph=availH;pw=ph*RATIO;}}
  document.documentElement.style.setProperty('--pw',pw+'px');
  document.documentElement.style.setProperty('--ph',ph+'px');
}
window.addEventListener('resize',render);
render();go(0);
</script>
