<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow" />
<title>BRIZZY — Massive Attack, Brisbane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0b0c; --panel:#141416; --panel2:#1b1b1e; --line:#2a2a2e;
  --text:#ececeb; --dim:#8e8e94; --faint:#5c5c62;
  --sig:#e0242b;          /* signal red — the one accent */
  --gap:#d9a441;          /* amber — days with nothing in them yet */
  --ok:#5ec98a;
  --disp:"Space Grotesk",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--disp);
  font-size:16px;line-height:1.55;
  padding:0 18px 96px;max-width:820px;margin:0 auto;
  -webkit-tap-highlight-color:transparent;
}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ---------- header ---------- */
header{padding:56px 0 30px;border-bottom:1px solid var(--line)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--sig)}
h1{font-size:clamp(46px,15vw,104px);line-height:.86;font-weight:700;letter-spacing:-.03em;margin:10px 0 14px}
h1 .slash{color:var(--sig)}
.lede{color:var(--dim);font-size:15px;max-width:46ch}

/* ---------- countdown ---------- */
.count{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
.count .unit{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-width:76px;text-align:center}
.count .n{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em;display:block}
.count .u{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.count .unit.hero .n{color:var(--sig)}
.count.done .unit{border-color:var(--sig)}
.countlabel{flex-basis:100%;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.window{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--dim);margin-top:18px}
.window b{color:var(--text);font-weight:500}

/* ---------- sections ---------- */
section{padding:38px 0;border-bottom:1px solid var(--line)}
h2{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);margin-bottom:20px}
h2 b{color:var(--sig);font-weight:500}
h2 .tally{color:var(--gap);border:1px dashed var(--gap);border-radius:4px;padding:1px 7px;margin-left:8px;letter-spacing:.14em}

.tbc{color:var(--faint);font-style:italic}
.tbc::after{content:" · to confirm";font-size:10px;font-style:normal;letter-spacing:.1em;text-transform:uppercase}

/* ---------- alerts ---------- */
.alertbox{border:1px solid var(--sig);border-radius:10px;background:linear-gradient(180deg,rgba(224,36,43,.10),rgba(224,36,43,.03));padding:16px 18px;margin-top:34px}
.alerthd{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--sig);margin-bottom:12px}
.alert + .alert{margin-top:13px;padding-top:13px;border-top:1px solid rgba(224,36,43,.28)}
.alert .at{font-size:15.5px;font-weight:700;line-height:1.3}
.alert .ad{font-size:13.5px;color:var(--dim);margin-top:4px}

/* ---------- itinerary ---------- */
.day.away{opacity:.92}
.day.away .daylabel .dn{color:var(--faint)}

/* Gaps — days with nothing in them yet, so they're obvious at a glance. */
.day.gapday{
  background:repeating-linear-gradient(135deg,rgba(217,164,65,.05) 0 8px,transparent 8px 16px);
  border-left:2px dashed var(--gap);
  margin:0 -14px;padding-left:12px;padding-right:14px;border-radius:8px;
}
.day.gapday .daylabel .dn{color:var(--gap)}
.gapchip{
  display:inline-block;margin-top:5px;font-family:var(--mono);font-size:9px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--gap);
  border:1px dashed var(--gap);border-radius:4px;padding:1px 6px;
}
.slot.open .t{color:var(--gap);font-weight:600}
.slot.open .w{color:var(--gap)}
.slot.open .w em{color:var(--dim)}
.day{display:grid;grid-template-columns:88px 1fr;gap:18px;padding:16px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:none}
.day.gigday{background:linear-gradient(90deg,rgba(224,36,43,.07),transparent);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:8px}
.daylabel .dn{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--sig)}
.daylabel .dd{font-size:15px;font-weight:700;line-height:1.2;margin-top:2px}
.daylabel .dw{font-size:12px;color:var(--faint)}
.slots{display:flex;flex-direction:column;gap:9px}
.slot{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:baseline}
.slot .t{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.slot .w{font-size:14.5px}
.slot .w em{display:block;font-style:normal;font-size:12.5px;color:var(--dim);margin-top:1px}
.slot.key .w{font-weight:700}
.slot.key .t{color:var(--sig)}
@media(max-width:560px){
  .day{grid-template-columns:1fr;gap:10px}
  .daylabel{display:flex;align-items:baseline;gap:10px}
  .daylabel .dd{margin-top:0}
}

/* Where you sleep that night — sits at the foot of the day it belongs to. */
.slot.bed{margin-top:3px;padding-top:9px;border-top:1px dashed var(--line)}
.slot.bed .t{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.slot.bed .w{font-weight:600}

/* ---------- ideas for the gaps ---------- */
.ideagrp + .ideagrp{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
.ideahd{margin-bottom:13px}
.iwhen{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gap)}
.ilabel{font-size:18px;font-weight:700;margin-top:2px}
.ilead{font-size:13.5px;color:var(--dim);margin-top:4px;max-width:56ch}

/* ---------- lists / extras ---------- */
.picks{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.picks{grid-template-columns:1fr 1fr}}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.pick .nm{font-weight:700;font-size:15px}
.pick .mt{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sig);margin-top:2px}
.pick .ln{font-size:13.5px;color:var(--dim);margin-top:6px}
.notes{display:flex;flex-direction:column;gap:10px}
.note-row{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14.5px}
.note-row .b{color:var(--sig);font-family:var(--mono);font-size:12px;line-height:1.7}
.note-row .x{color:var(--dim)}
.note-row .x b{color:var(--text);font-weight:600}

/* ---------- format switcher ---------- */
.view{display:none}
.view.active{display:block}
.switcher{
  position:sticky;top:0;z-index:60;display:flex;gap:3px;
  background:rgba(11,11,12,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);margin:0 -18px;padding:10px 18px;
}
.switcher button{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);background:transparent;border:1px solid transparent;border-radius:999px;
  padding:7px 15px;cursor:pointer;
}
.switcher button:hover{color:var(--text)}
.switcher button.on{background:var(--sig);color:#fff}
.switcher button:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

/* ---------- RUN SHEET ---------- */
.e-wrap{font-family:var(--mono);padding-top:30px}
.e-mast{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  border-bottom:2px solid var(--text);padding-bottom:12px;margin-bottom:4px}
.e-mast h1{font-family:var(--disp);font-weight:700;font-size:clamp(34px,9vw,48px);line-height:1;letter-spacing:-.02em}
.e-mast .meta{text-align:right;font-size:10.5px;color:var(--dim);line-height:1.8;letter-spacing:.06em}
.e-mast .meta b{color:var(--sig);font-weight:500}
.e-day{display:flex;align-items:center;gap:12px;background:var(--text);color:var(--ink);
  padding:6px 12px;margin-top:20px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.e-day .dn{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:0;text-transform:none}
.e-day .dtag{opacity:.7}
.e-day .ds{margin-left:auto;opacity:.7}
.e-row{display:grid;grid-template-columns:56px 24px 1fr auto;gap:0 12px;align-items:baseline;
  padding:7px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.e-row .t{color:var(--faint);font-size:11.5px;white-space:nowrap}
.e-row .ic{font-family:var(--disp)}
.e-row .what b{font-weight:500;color:var(--text)}
.e-row.key .what b{color:var(--text);font-weight:600}
.e-row.key .t{color:var(--sig)}
.e-row .what .d{color:var(--faint)}
.e-row.open .what b{color:var(--gap)}
.e-st{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap}
.e-st.ok{background:rgba(94,201,138,.14);color:var(--ok)}
.e-st.todo{background:rgba(217,164,65,.16);color:var(--gap)}
.e-st.opt{background:var(--panel2);color:var(--faint)}
.e-st.open{background:rgba(217,164,65,.16);color:var(--gap)}
.e-block{padding:8px 12px 8px 92px;font-size:11.5px;color:var(--dim);border-bottom:1px solid var(--line);line-height:1.6}
.e-block b{color:var(--text);font-weight:500}
.e-key{margin-top:18px;display:flex;gap:16px;flex-wrap:wrap;font-size:10.5px;color:var(--faint);letter-spacing:.06em}
.e-key span{display:flex;align-items:center;gap:6px}
.e-key i{width:8px;height:8px;border-radius:2px;display:inline-block}
.e-key i.ok{background:var(--ok)}.e-key i.todo{background:var(--gap)}
.e-key i.opt{background:var(--line2,#37343f)}.e-key i.open{background:var(--gap)}
@media(max-width:640px){
  .e-row{grid-template-columns:48px 1fr auto;gap:0 8px}
  .e-row .ic{display:none}
  .e-block{padding-left:12px}
}

/* ---------- DOSSIER ---------- */
.f-wrap{display:grid;grid-template-columns:270px 1fr;gap:20px;padding-top:30px}
@media(max-width:860px){.f-wrap{grid-template-columns:1fr}}
.f-side{position:sticky;top:56px;align-self:start;display:flex;flex-direction:column;gap:9px}
@media(max-width:860px){.f-side{position:static}}
.f-side h1{font-family:var(--disp);font-weight:700;font-size:36px;line-height:.95;letter-spacing:-.03em}
.f-side .sub{color:var(--dim);font-size:12.5px;margin:5px 0 4px}
.f-side .sub b{color:var(--sig)}
.f-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.f-card h4{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.f-kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;align-items:baseline}
.f-kv span:first-child{color:var(--dim);white-space:nowrap}
.f-kv span:last-child{text-align:right}
.f-chips{display:flex;flex-wrap:wrap;gap:5px}
.f-chip{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--panel2);color:var(--dim)}
.f-chip.g{background:rgba(217,164,65,.14);color:var(--gap)}
.f-main{display:flex;flex-direction:column;gap:10px}
.f-dayrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.f-dayrow.hot{border-color:rgba(224,36,43,.5)}
.f-dayrow.gap{border-style:dashed;border-color:rgba(217,164,65,.45)}
.f-dh{display:flex;align-items:baseline;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.f-dh .d{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sig)}
.f-dayrow.gap .f-dh .d{color:var(--gap)}
.f-dh .n{font-size:18px;font-weight:700;letter-spacing:-.01em}
.f-dh .s{margin-left:auto;font-size:11.5px;color:var(--faint)}
.f-track{display:flex;flex-wrap:wrap;padding:5px 7px}
.f-slot{flex:1 1 145px;min-width:145px;padding:8px;border-right:1px dashed var(--line)}
.f-slot:last-child{border-right:0}
.f-slot .t{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.f-slot .w{font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.35}
.f-slot .m{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.45}
.f-slot.hot .w,.f-slot.hot .t{color:var(--sig)}
.f-slot.open .w,.f-slot.open .t{color:var(--gap)}

footer{padding:30px 0 0;color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
a{color:var(--text)}
a:focus-visible,summary:focus-visible{outline:2px solid var(--sig);outline-offset:3px}
</style>
</head>

<footer id="foot"></footer>

/* ============================================================================
   RENDER — no need to touch below here.
   ========================================================================= */
const $ = id => document.getElementById(id);
const TBC = '<span class="tbc">—</span>';

const DAYNAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Parse "YYYY-MM-DD" as a local date (avoids the UTC-shift trap of new Date(str)).
function parseDate(iso){
  if (!iso) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso.trim());
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3]);
}
function fmtDate(iso){
  const d = parseDate(iso);
  return d ? `${d.getDate()} ${MONTHS[d.getMonth()]}` : null;
}
function fmtLong(iso){
  const d = parseDate(iso);
  return d ? `${DAYNAMES[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : null;
}

/* ---- header ---- */
$('lede').textContent = TRIP.lede;
$('kicker').textContent = `Brisbane · ${TRIP.gig.artist}`;

/* ---- countdown ---- */
function renderCount(){
  const box = $('count');

  // Count to the gig once its date is known; until then, to wheels-up.
  const gigDay = parseDate(TRIP.gig.date);
  const d      = gigDay || parseDate(TRIP.start);
  const clock  = gigDay ? (TRIP.gig.doors || "19:00") : (TRIP.flights.out.dep || "00:00");
  const label  = gigDay ? "Until doors" : "Until wheels up";

  if (!d){
    box.innerHTML = `<div class="unit hero" style="min-width:auto;padding-left:18px;padding-right:18px">
      <span class="n">?</span><span class="u">No dates yet</span></div>`;
    return;
  }
  const [hh, mm] = clock.split(":").map(Number);
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh || 0, mm || 0);
  const diff = target - new Date();

  if (diff <= 0){
    box.className = "count done";
    box.innerHTML = `<div class="unit hero" style="min-width:auto;padding-left:18px;padding-right:18px">
      <span class="n">▶</span><span class="u">${gigDay ? "It's happening" : "You're off"}</span></div>`;
    return;
  }
  const s = Math.floor(diff / 1000);
  const parts = [
    ["Days",    Math.floor(s / 86400), true],
    ["Hours",   Math.floor(s / 3600) % 24, false],
    ["Minutes", Math.floor(s / 60) % 60, false],
    ["Seconds", s % 60, false]
  ];
  box.className = "count";
  box.innerHTML = parts.map(([u, n, hero]) =>
    `<div class="unit${hero ? ' hero' : ''}"><span class="n">${String(n).padStart(2,"0")}</span><span class="u">${u}</span></div>`
  ).join("") + `<div class="countlabel">${label}</div>`;
}
renderCount();
setInterval(renderCount, 1000);

/* ---- trip window strip ---- */
(function(){
  const a = parseDate(TRIP.start), b = parseDate(TRIP.end);
  if (!a || !b) return;
  const nights = Math.round((b - a) / 86400000);
  const el = document.createElement("div");
  el.className = "window";
  el.innerHTML = `<b>${fmtLong(TRIP.start)}</b> → <b>${fmtLong(TRIP.end)}</b> · ${nights} nights`;
  $('count').insertAdjacentElement("afterend", el);
})();

/* ---- alerts ---- */
$('alerts').innerHTML = (TRIP.alerts && TRIP.alerts.length)
  ? `<div class="alertbox">
       <div class="alerthd">Needs sorting — ${TRIP.alerts.length}</div>
       ${TRIP.alerts.map(a => `<div class="alert"><div class="at">${a.t}</div><div class="ad">${a.d}</div></div>`).join("")}
     </div>`
  : "";

/* ---- itinerary ---- */
function dayMeta(day, i){
  const d = parseDate(day.date);
  return {
    d, i,
    isGig: day.gig || (day.date && day.date === TRIP.gig.date),
    allOpen: day.slots.length > 0 && day.slots.every(sl => sl.open),
    away: !!day.away,
    num: `Day ${i + 1}`,
    date: d ? `${d.getDate()} ${MONTHS[d.getMonth()]}` : null,
    wday: d ? DAYNAMES[d.getDay()] : (day.title || ""),
    wshort: d ? DAYNAMES[d.getDay()].slice(0,3) : ""
  };
}
function cls(m){
  return `${m.isGig ? ' gigday' : ''}${m.away ? ' away' : ''}${m.allOpen ? ' gapday' : ''}`;
}

$('days').innerHTML = TRIP.itinerary.map((day, i) => {
  const m = dayMeta(day, i);
  return `<div class="day${cls(m)}">
    <div class="daylabel">
      <div class="dn">${m.num}</div>
      <div>
        <div class="dd">${m.date || TBC}</div>
        <div class="dw">${m.wday}</div>
        ${m.allOpen ? `<div class="gapchip">Empty</div>` : ""}
      </div>
    </div>
    <div class="slots">${day.slots.map(sl => {
      if (sl.stay) return `<div class="slot bed">
        <div class="t">bed</div>
        <div class="w">${sl.w}${sl.note ? `<em>${sl.note}</em>` : ""}</div>
      </div>`;
      return `<div class="slot${sl.key ? ' key' : ''}${sl.open ? ' open' : ''}">
        <div class="t">${sl.open ? "+" : (sl.t || "—")}</div>
        <div class="w">${sl.w}${sl.note ? `<em>${sl.note}</em>` : ""}</div>
      </div>`;
    }).join("")}
    </div>
  </div>`;
}).join("");

/* ---- gap tally ---- */
(function(){
  const empty = TRIP.itinerary.filter(d => d.slots.length && d.slots.every(s => s.open)).length;
  const partial = TRIP.itinerary.filter(d => d.slots.some(s => s.open) && !d.slots.every(s => s.open)).length;
  if (!empty && !partial){ $('gapcount').textContent = ""; return; }
  const bits = [];
  if (empty) bits.push(`${empty} empty`);
  if (partial) bits.push(`${partial} part-planned`);
  $('gapcount').innerHTML = `<span class="tally">${bits.join(" · ")}</span>`;
})();

/* ---- notes ---- */
$('notes').innerHTML = TRIP.notes.map(n =>
  `<div class="note-row"><div class="b">${n.b}</div><div class="x">${n.t}</div></div>`).join("");

/* ---- ideas, grouped by the gap they fill ---- */
$('ideas').innerHTML = TRIP.ideas.map(g => {
  const d = parseDate(g.for);
  const when = d ? `${DAYNAMES[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}` : "";
  return `<div class="ideagrp">
    <div class="ideahd">
      <div class="iwhen">${when}</div>
      <div class="ilabel">${g.label}</div>
      ${g.lead ? `<div class="ilead">${g.lead}</div>` : ""}
    </div>
    <div class="picks">${g.picks.map(p =>
      `<div class="pick"><div class="nm">${p.nm}</div><div class="mt">${p.mt}</div><div class="ln">${p.ln}</div></div>`
    ).join("")}</div>
  </div>`;
}).join("");

$('foot').textContent = `staldex.com/brizzy — unlisted`;

/* ============================================================================
   ALTERNATE FORMATS — same TRIP data, different shape.
   ========================================================================= */
const ST = { ok: "Booked", todo: "Action", opt: "Loose" };

function daysToGig(){
  const d = parseDate(TRIP.gig.date);
  if (!d) return null;
  const [hh, mm] = (TRIP.gig.doors || TRIP.gig.setTime || "20:00").split(":").map(Number);
  const diff = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm) - new Date();
  return diff > 0 ? Math.ceil(diff / 86400000) : 0;
}

/* ---- RUN SHEET ---- */
function renderRun(){
  const n = daysToGig();
  const rows = TRIP.itinerary.map((day, i) => {
    const m = dayMeta(day, i);
    const head = `<div class="e-day">
      <span class="dn">${m.wday}</span>
      <span class="dtag">${day.tag || ""}</span>
      <span class="ds">${m.date || ""}</span>
    </div>`;
    const body = day.slots.map(sl => {
      if (sl.stay) return `<div class="e-block"><b>Bed:</b> ${sl.w}${sl.note ? ` — ${sl.note}` : ""}</div>`;
      if (sl.open) return `<div class="e-row open">
        <span class="t">—</span><span class="ic">＋</span>
        <span class="what"><b>${sl.w}</b>${sl.note ? ` <span class="d">— ${sl.note}</span>` : ""}</span>
        <span class="e-st open">Open</span></div>`;
      return `<div class="e-row${sl.key ? ' key' : ''}">
        <span class="t">${sl.t || ""}</span>
        <span class="ic">${sl.ic || ""}</span>
        <span class="what"><b>${sl.w}</b>${sl.note ? ` <span class="d">— ${sl.note}</span>` : ""}</span>
        ${sl.st ? `<span class="e-st ${sl.st}">${ST[sl.st]}</span>` : `<span class="e-st"></span>`}</div>`;
    }).join("");
    return head + body;
  }).join("");

  return `<div class="e-wrap">
    <div class="e-mast">
      <h1>BRIZZY</h1>
      <div class="meta">
        RUN SHEET · MASSIVE ATTACK, BRISBANE ENTERTAINMENT CENTRE<br>
        LEON + RAHANA · BASE: BRIDGEMAN DOWNS · ${n !== null ? `SHOW IN <b>${n} DAY${n === 1 ? "" : "S"}</b>` : ""}
      </div>
    </div>
    ${rows}
    <div class="e-key">
      <span><i class="ok"></i>Booked — locked in</span>
      <span><i class="todo"></i>Action — needs doing</span>
      <span><i class="opt"></i>Loose — optional</span>
      <span><i class="open"></i>Open — nothing planned</span>
    </div>
  </div>`;
}

/* ---- DOSSIER ---- */
function renderDossier(){
  const n = daysToGig();
  const g = TRIP.gig, c = TRIP.car;
  const beds = TRIP.itinerary.flatMap(d => d.slots.filter(s => s.stay).map(s => s.w));

  const kv = (k, v) => v ? `<div class="f-kv"><span>${k}</span><span>${v}</span></div>` : "";

  const side = `<aside class="f-side">
    <div>
      <h1>Brizzy</h1>
      <p class="sub">${g.artist} · ${fmtDate(g.date)} · ${n !== null ? `show in <b>${n} day${n === 1 ? "" : "s"}</b>` : ""}</p>
    </div>

    <div class="f-card">
      <h4>Show</h4>
      ${kv("Venue", g.venue)}
      ${kv("Date", fmtLong(g.date))}
      ${kv("On stage", g.setTime)}
      ${kv("Doors", g.doors || "—")}
      ${kv("Getting there", "Uber, ~15 min")}
    </div>

    <div class="f-card">
      <h4>Flights</h4>
      ${kv("Out", `${fmtDate(TRIP.flights.out.date)} · ${TRIP.flights.out.dep}`)}
      ${kv("Lands", TRIP.flights.out.arr)}
      ${kv("Back", `${fmtDate(TRIP.flights.back.date)} · ${TRIP.flights.back.dep}`)}
      ${kv("Booking", TRIP.flights.out.ref)}
    </div>

    <div class="f-card">
      <h4>Hire car</h4>
      ${kv("Booking", c.ref)}
      ${kv("Vehicle", c.what)}
      ${kv("Out", c.from)}
      ${kv("Back", c.to)}
      ${kv("Cost", c.cost)}
      ${kv("Terms", c.extra)}
    </div>

    <div class="f-card">
      <h4>Beds</h4>
      ${beds.map(b => `<div class="f-kv"><span>${b.split(" · ")[0]}</span><span>${b.split(" · ")[1] || ""}</span></div>`).join("")}
    </div>

    ${TRIP.alerts.length ? `<div class="f-card">
      <h4>Open items</h4>
      <div class="f-chips">${TRIP.alerts.map(a => `<span class="f-chip g">${a.t}</span>`).join("")}</div>
    </div>` : ""}
  </aside>`;

  const main = `<main class="f-main">${TRIP.itinerary.map((day, i) => {
    const m = dayMeta(day, i);
    const slots = day.slots.filter(s => !s.stay);
    const bed = day.slots.find(s => s.stay);
    return `<div class="f-dayrow${m.isGig ? ' hot' : ''}${m.allOpen ? ' gap' : ''}">
      <div class="f-dh">
        <span class="d">${m.wshort} ${m.date || ""}</span>
        <span class="n">${day.tag || m.wday}</span>
        ${bed ? `<span class="s">${bed.w}</span>` : ""}
      </div>
      <div class="f-track">${slots.map(sl => `
        <div class="f-slot${sl.key ? ' hot' : ''}${sl.open ? ' open' : ''}">
          <p class="t">${sl.open ? "—" : (sl.t || "")}</p>
          <p class="w">${sl.ic ? sl.ic + " " : ""}${sl.w}</p>
          ${sl.note ? `<p class="m">${sl.note}</p>` : ""}
        </div>`).join("")}
      </div>
    </div>`;
  }).join("")}</main>`;

  return `<div class="f-wrap">${side}${main}</div>`;
}

/* ---- switcher ---- */
const FORMATS = {
  detailed: { label: "Detailed", build: null },
  run:      { label: "Run sheet", build: renderRun },
  dossier:  { label: "Dossier",   build: renderDossier }
};

function setFormat(key){
  if (!FORMATS[key]) key = "detailed";
  Object.keys(FORMATS).forEach(k => {
    const el = $('view-' + k);
    if (!el) return;
    if (k === key && FORMATS[k].build && !el.dataset.built){
      el.innerHTML = FORMATS[k].build();
      el.dataset.built = "1";
    }
    el.classList.toggle("active", k === key);
  });
  document.querySelectorAll("#switcher button").forEach(b =>
    b.classList.toggle("on", b.dataset.fmt === key));
  try { localStorage.setItem("brizzy.fmt", key); } catch(e){}
  window.scrollTo({ top: 0 });
}

$('switcher').innerHTML = Object.entries(FORMATS).map(([k, v]) =>
  `<button type="button" data-fmt="${k}">${v.label}</button>`).join("");
$('switcher').addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) setFormat(b.dataset.fmt);
});

let savedFmt = "detailed";
try { savedFmt = localStorage.getItem("brizzy.fmt") || "detailed"; } catch(e){}
setFormat(savedFmt);
</script>
