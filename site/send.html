<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow" />
<title>SEND IT — A Northbridge Bucks Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0b14; --panel:#171224; --panel2:#1f1930; --line:#2c2340;
  --text:#ece7f2; --dim:#9a90b0;
  --neon:#ff2e88; --amber:#ffb347; --zone:#2ee6a8; --danger:#ff5252; --klr:#7c5cff;
  --disp:"Fraunces",serif; --body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--text);font-family:var(--body);height:100%}
body{padding:8px 10px;max-width:900px;margin:0 auto;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;gap:6px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.neon{
  font-family:var(--disp);font-weight:900;font-size:clamp(26px,6vw,40px);letter-spacing:.02em;
  color:var(--neon);
  text-shadow:0 0 5px rgba(255,46,136,.9),0 0 18px rgba(255,46,136,.5);
  animation:flick 7s infinite;
}
@keyframes flick{0%,86%,88%,92%,100%{opacity:1}87%,91%{opacity:.35;text-shadow:none}}
@media (prefers-reduced-motion: reduce){.neon{animation:none}}
.sub{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:right}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats.afters{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 8px;text-align:center}
.stat.hidden{display:none}
.stat .lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stat .val{font-family:var(--disp);font-weight:900;font-size:18px}
#legendVal{color:var(--amber)}
#billVal{color:var(--danger)}
#degenVal{color:var(--zone)}

.gauge{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.gauge .row{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.track{position:relative;height:18px;border-radius:5px;background:#0a0812;overflow:hidden;border:1px solid var(--line)}
.track.slim{height:9px;margin-top:6px}
.zoneBand{position:absolute;top:0;bottom:0;background:rgba(46,230,168,.14);border-left:1px dashed rgba(46,230,168,.6);border-right:1px dashed rgba(46,230,168,.6)}
.zoneBand span{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.2em;color:var(--zone);white-space:nowrap}
.fill{position:absolute;top:0;bottom:0;left:0;transition:width .5s ease}
#buzzFill{background:linear-gradient(90deg,#5a4b7d,var(--neon))}
#heatFill{background:linear-gradient(90deg,#7d3a2b,var(--danger))}
.state{font-size:11px;margin-top:5px;font-weight:600;min-height:14px}

.boys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
@media(min-width:640px){.boys{grid-template-columns:repeat(8,1fr)}}
.boy{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 2px;text-align:center;font-size:10.5px;transition:opacity .4s}
.boy .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boy .st{color:var(--dim);font-size:9px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boy.buck .nm{color:var(--amber)}
.boy.warn{border-color:var(--danger)}
.boy.wait{opacity:.55;border-style:dashed}
.boy.gone{opacity:.28;filter:grayscale(1)}

.spot{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.spot .dot{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);flex:none}
.spot .nm{font-weight:700;font-size:13px;color:var(--text)}
.spot .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.spot .vibe{margin-left:auto;font-size:10px;color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Feed: newest line on top, older lines clipped — never scrolls. */
.logBox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;flex:1;min-height:60px;overflow:hidden;display:flex;flex-direction:column;font-size:12.5px;line-height:1.5;-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent);mask-image:linear-gradient(to bottom,#000 62%,transparent)}
.logBox p{margin-bottom:4px;color:var(--dim);flex:none}
.logBox p:first-child{color:var(--text)}
.logBox p.hot{color:var(--text)}
.logBox p.leg{color:var(--amber)}
.logBox p.bad{color:var(--danger)}
.logBox p.gd{color:var(--zone)}

.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.act{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 3px 9px;cursor:pointer;text-align:center;color:var(--text);overflow:hidden}
.act:active{transform:scale(.96)}
.act:disabled{opacity:.4;cursor:default}
.act .ico{font-size:22px;line-height:1.1}
.act .nm{font-size:11px;font-weight:700;margin-top:2px}
.act .pr{font-size:9.5px;color:var(--dim)}
.act .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--neon);width:0%}
.act.gear{border-color:#3a2c66}
.act.gear .pr{color:var(--klr)}
.card button:disabled{opacity:.4;cursor:default}

.overlay{position:fixed;inset:0;background:rgba(6,4,12,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;max-width:460px;width:100%;padding:18px;max-height:88vh;overflow-y:auto}
.card h2{font-family:var(--disp);font-weight:900;font-size:22px;margin-bottom:7px;color:var(--neon)}
.card p{color:var(--dim);font-size:13.5px;line-height:1.5;margin-bottom:12px}
.card .tog{display:flex;gap:6px;margin:0 0 10px}
.card .tog .tg{flex:1;width:auto;margin:0;padding:7px 4px;text-align:center;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.card .tog .tg.on{background:var(--neon);color:var(--ink);border-color:var(--neon)}
.card .sheet{margin:0 0 10px;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:9px}
.card .sh-t{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.card .sh-r{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:3px 0;border-top:1px solid var(--line)}
.card .sh-r:first-of-type{border-top:0}
.card .sh-l{color:var(--dim)}
.card .sh-v{font-weight:700;color:var(--text)}
.card .sh-v.amber{color:var(--amber)}
.card .sh-v.danger{color:var(--danger)}
.card .sh-v.zone{color:var(--zone)}
.card .reel{margin:0 0 12px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px}
.card .reel div{font-size:11px;color:var(--dim);line-height:1.5;margin-bottom:2px}
.card .reel .rl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);margin-bottom:5px}
.card button{display:block;width:100%;margin-top:7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;text-align:left}
.card button:hover{border-color:var(--neon)}
.card .big{background:var(--neon);color:var(--ink);text-align:center;border-color:var(--neon);font-size:14px}
.card .kick{background:var(--zone);color:var(--ink);text-align:center;border-color:var(--zone);font-size:14px}
</style>
</head>
<body>

<header>
  <div class="neon">SEND IT</div>
  <div class="sub">One bucks night in Northbridge<br>last til sunrise</div>
</header>

<div class="stats" id="statsRow">
  <div class="stat"><div class="lbl">Time</div><div class="val" id="clockVal">7:00pm</div></div>
  <div class="stat"><div class="lbl">Legend</div><div class="val" id="legendVal">0</div></div>
  <div class="stat"><div class="lbl">Card Bill</div><div class="val" id="billVal">$0</div></div>
  <div class="stat hidden" id="degenStat"><div class="lbl">Degen</div><div class="val" id="degenVal">0</div></div>
</div>

<div class="gauge">
  <div class="row"><span>Buzz — hit zero and the night's over</span><span id="buzzPct">0</span></div>
  <div class="track">
    <div class="zoneBand" id="zoneBand"><span>THE ZONE</span></div>
    <div class="fill" id="buzzFill"></div>
  </div>
  <div class="row" style="margin-top:6px"><span>Heat</span><span id="heatPct">0</span></div>
  <div class="track slim"><div class="fill" id="heatFill"></div></div>
  <div class="state" id="buzzState">Stone-cold sober. Embarrassing, frankly.</div>
</div>

<div class="boys" id="boysRow"></div>

<div class="spot" id="spotRow"></div>

<div class="logBox" id="logBox"></div>

<div class="acts" id="actsRow"></div>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
"use strict";
/* ---------------- state ---------------- */
const S = {
  tick:0, ticksTotal:132, running:false, over:false, kickon:false,
  buzz:0, heat:0, bill:0, billMark:0, legend:0, streak:0,
  seated:0, dexTicks:0, mdTicks:0, cokeTicks:0, ketTicks:0, soakTicks:0,
  venue:0, walking:0, arcPos:0, moveCd:13, ambientCd:0, started:false,
  day:1, dayEndTick:0, pendingConflict:null, usedChat:{}, usedChaos:new Set(),
  degen:0, aftersStart:0, nightLegend:0, peakBuzz:0, shadow:false, usedShadow:new Set(),
  kCount:0, travisHole:0, rayDone:false, sandyCd:0,
  jezCd:14, robinCd:11, leroyCd:17, picklesCd:9,
  reel:[],
  flags:{cone:false,deano:false,tattoo:false,bruce:false,rivals:false,rivalAlly:false,squad:false},
  boys:[
    {id:"bucko",  n:"Bucko",  buck:true, up:true, st:"the buck"},
    {id:"travis", n:"Travis", up:true, st:"suspiciously chipper"},
    {id:"sandy",  n:"Sandy",  up:true, st:"pacing it"},
    {id:"jez",    n:"Jez",    up:true, st:"hospo veteran"},
    {id:"robin",  n:"Robin",  up:true, st:"the joker"},
    {id:"ray",    n:"Ray",    up:true, st:"mingling"},
    {id:"leroy",  n:"Leroy",  up:true, st:"scheming"},
    {id:"pickles", n:"Pickles", up:true, st:"loud American"},
  ],
  cds:{}, eventCd:8
};
const ZONE=[42,75];
const KEBAB=5, KICKON=6;

const VENUES=[
  {n:"Grass Monkey", tag:"pub", price:1.0, legend:1.0, heat:.5, door:false, blurb:"Sticky carpet. Honest schooners.", left:false},
  {n:"Mustard Bar", tag:"live", price:1.15, legend:1.4, heat:.8, door:false, blurb:"A cover band doing Barnesy. Again.", left:false},
  {n:"Sneaky Terry's", tag:"speakeasy", price:1.5, legend:1.6, heat:.6, door:true, blurb:"You knock on a fridge to get in. The fridge is judgemental.", left:false},
  {n:"Retro Shitty", tag:"club", price:1.7, legend:2.4, heat:1.5, door:true, opens:36, blurb:"Doof doof. The bouncer remembers faces.", left:false},
  {n:"Connies", tag:"late club", price:1.6, legend:2.0, heat:1.2, door:true, opens:60, blurb:"Opens midnight. Best dance floor in the hemisphere.", left:false},
  {n:"Kebab Alley", tag:"street", price:1.0, legend:.4, heat:.3, door:false, blurb:"Garlic sauce fixes most things.", left:false},
  {n:"Leroy's Flat", tag:"kick-ons", price:.4, legend:1.8, heat:.9, door:false, blurb:"Someone's already on aux. The neighbours are already awake.", left:false, hidden:true},
];

/* ---------------- helpers ---------------- */
const $=id=>document.getElementById(id);
function say(t,cls){
  const p=document.createElement("p"); if(cls)p.className=cls; p.textContent=t;
  const b=$("logBox"); b.prepend(p); while(b.children.length>7)b.lastChild.remove();
  if((cls==="leg"||cls==="bad") && S.reel.length<60) S.reel.push([clockStr(),t,cls]);
}
function buzz(d){ S.buzz=Math.min(100,Math.max(0,S.buzz+d)); if(S.buzz>S.peakBuzz)S.peakBuzz=S.buzz; }
function leg(d){ S.legend=Math.max(0,Math.round(S.legend+d)); }
function heat(d){ S.heat=Math.min(100,Math.max(0,S.heat+d)); }
function heatRisk(amt,msg){ if(Math.random()<.5){ heat(amt); say(msg,"bad"); } }
function relieve(amt){ S.bill=Math.max(0,S.bill-amt); }
function spend(amt){ if(!amt)return; S.bill+=amt;
  if(S.bill-S.billMark>=250){ S.billMark=S.bill;
    say(["Your bank sends a text: 'Did you REALLY just spend this in Northbridge? Reply YES or NO.' You reply YES without reading it.",
         "Tap. Tap. Tap. The card is warm to the touch now.",
         "Somewhere, your savings account files a missing persons report.",
         "The card declines nothing. The card has given up on you."][Math.floor(Math.random()*4)],"bad"); }
}
function boy(id){ return S.boys.find(b=>b.id===id); }
function boysUp(){ return S.boys.filter(b=>b.up).length; }
function downBoy(id,status,msg){ const b=boy(id); if(!b||!b.up)return; b.up=false; b.outTicks=0; b.st=status; say(msg,"bad"); renderBoys(); }
function benchBoy(id,ticks,status,msg){ const b=boy(id); if(!b||!b.up)return; b.up=false; b.outTicks=ticks; b.st=status; say(msg,"bad"); renderBoys(); }
function clockStr(){ const m=19*60 + S.tick*5; const h24=Math.floor(m/60)%24; const mm=(m%60).toString().padStart(2,"0"); const ap=h24>=12&&h24<24?"pm":"am"; let h=h24%12; if(h===0)h=12; return h+":"+mm+ap; }

/* ---------------- consumables ---------------- */
const ACTS=[
  {id:"beer", ico:"🍺", nm:"Schooner", base:9,  cd:3,  gear:false, do:()=>{ buzz(+8);  say("Schooner down. Crisp.","gd"); }},
  {id:"wine", ico:"🍷", nm:"Vino",     base:12, cd:3,  gear:false, do:()=>{ buzz(+10); say("A sophisticated glass of goon-adjacent red.","gd"); }},
  {id:"cock", ico:"🍸", nm:"Cocktail", base:24, cd:4,  gear:false, do:()=>{ buzz(+16); leg(4); say("An espresso martini. The boys pretend not to judge.","gd"); }},
  {id:"shot", ico:"🥃", nm:"Shots",    base:10, cd:2,  gear:false, do:()=>{ buzz(+12); if(Math.random()<.25){leg(6);say("Tequila for the table. Someone bites the lime, skin-side. Legend behaviour.","leg");} else say("A shot vanishes. Your future self files a complaint.","gd"); }},
  {id:"water",ico:"💧", nm:"Water",    base:0,  cd:4,  gear:false, do:()=>{ buzz(-8); heat(-3); say("A tactical water. Genuinely elite move.","gd"); }},
  {id:"kebab",ico:"🥙", nm:"Kebab",    base:15, cd:10, gear:false, do:()=>{ S.soakTicks=10; heat(-3); say("Soakage acquired. The kebab slows the slide. Buzz decay halved for a bit.","gd"); }},
  {id:"coke", ico:"❄️", nm:"Racks",    base:60, cd:10, gear:true,  do:()=>{ buzz(+20); S.cokeTicks=10; heatRisk(10,"A cubicle door with four sets of shoes under it draws attention.");
      if(S.ketTicks>0){ leg(10); say("The rack lands on the ket and the whole night snaps into balance. Calibrated. Untouchable. This is the good stuff.","leg"); }
      else say("Everyone in the cubicle is now an expert on cryptocurrency.","hot"); }},
  {id:"md",   ico:"💊", nm:"Pinger",   base:30, cd:14, gear:true,  do:()=>{ S.mdTicks=16; buzz(+2); say("Pinger down. Nothing yet... but it's on its way up. Legend ×2 once it lands.","hot"); }},
  {id:"k",    ico:"🐴", nm:"K",        base:35, cd:12, gear:true,  do:()=>{ buzz(+16); S.ketTicks=12; S.kCount++;
      if(S.cokeTicks>0){ leg(10); say("The ket settles onto the coke like a saddle on a horse. You are, briefly, a functioning superbeing — no seat for you tonight.","leg"); }
      else if(S.buzz>70 && Math.random()<.5){ S.seated=5; say("The K takes full hold and the seat becomes your entire universe. You will be here a while.","bad"); }
      else say("The room tips a hard, warm diagonal and simply stays there. This is the good stuff.","hot");
      if(boy("travis").up && S.travisHole===0 && S.kCount>=4 && Math.random() < .25*(S.kCount-3)) travisEvent();
  }},
  {id:"dex",  ico:"⚡", nm:"Dexie",    base:12, cd:12, gear:true,  do:()=>{ S.dexTicks=16; say("Laser focus acquired. Buzz decay slowed. You explain your business idea to Leroy, who immediately improves it.","hot"); }},
];

/* ---------------- character events (triggered) ---------------- */
function travisEvent(){
  showEvent({t:"Travis has FINALLY gone under",
    p:"You thought Travis was pacing himself. Travis was not pacing himself. A forensic review of the night reveals he's been quietly running his own private program in the cubicle since 8:45pm — his stash makes yours look like a sample pack. The tank is empty. Travis is now furniture, staring at a gig poster like it's the Sistine Chapel. Security is doing laps.",
    o:[["Babysit him in a booth",()=>{buzz(-4);boy("travis").st="booth · recovering";say("You park Travis with a water and stand guard. He resurfaces asking what year it is, then asks if anyone's keen for another.","gd");renderBoys();setTimeout(()=>{const t=boy("travis");if(t.up)t.st="suspiciously chipper";renderBoys();},9000);}],
       ["He'll ride it out",()=>{S.travisHole=6;boy("travis").st="one with the wall";renderBoys();say("Travis is riding it out in full public view. Bold strategy given his intake.","hot");}]]});
}
function sandyEvent(){
  showEvent({t:"Sandy has entered the sloppy zone",
    p:"Sandy is hugging strangers, has told the bartender 'I love you, no I mean it', and is one drink away from a very public chapter.",
    o:[["Water and fresh air, now",()=>{buzz(-5);boy("sandy").st="rebooting";say("You walk Sandy around the block. Order restored. Sandy denies everything.","gd");renderBoys();setTimeout(()=>{const s=boy("sandy");if(s.up)s.st="pacing it";renderBoys();},9000);}],
       ["Sandy's a big kid",()=>{ if(Math.random()<.45){downBoy("sandy","chundered · cab home","Sandy has redecorated a bin on James St and been poured into a cab. Godspeed.");leg(-10);} else {say("Sandy pulls up mid-slop and orders chips. A warrior's recovery.","gd");leg(8);boy("sandy").st="pacing it";renderBoys();} }]]});
}
function rayEvent(){
  showEvent({t:"Ray's met someone",
    p:"1am. Ray — grinning, luminous, best night of his life — has been chatting to someone at the bar for twenty minutes and floats over: 'Boys. BOYS. I think this is it.'",
    o:[["Wingman him out the door",()=>{downBoy("ray","picked up · legend","Ray departs to a standing ovation from the whole table. What a way to go.");leg(30);}],
       ["Invoke the boys' night clause",()=>{ if(Math.random()<.7){say("Ray gets a number, does a little spin, and RECOMMITS to the night. 'Skydiving at sunrise, boys. I'm booking it NOW.'","leg");leg(12);boy("ray").st="locked in";renderBoys();} else {downBoy("ray","picked up anyway","Ray mouths 'sorry lads' from the doorway. The heart wants what it wants.");} }]]});
}

/* ---------------- random events (no repeats; f: follow-up chains) ---------------- */
const EVENTS=[
 {t:"Karaoke ambush",p:"Bucko has seized the mic and is committing to 'Khe Sanh' with his whole chest.",
  o:[["Back him up on air guitar",()=>{leg(30);buzz(3);say("The whole venue joins the chorus. Scenes.","leg");}],
     ["Drag him off stage",()=>{leg(-10);say("The crowd boos you personally.","bad");}]]},
 {t:"The shoey proposal",c:()=>boy("robin").up,p:"Robin has removed a shoe, filled it, and is holding it aloft while making direct eye contact with you. This is either a prank or a dare. Possibly both.",
  o:[["Do the shoey",()=>{leg(25);buzz(8);heatRisk(6,"The bouncer notes your existence.");say("It tastes like poor decisions and Rexona. Robin is visibly moved.","leg");}],
     ["Decline respectfully",()=>{leg(-8);say("Robin drinks it himself without breaking eye contact. Somehow worse.","bad");}]]},
 {t:"Robin's round",c:()=>boy("robin").up,p:"Robin has 'shouted jaegerbombs' for the table. Yours smells suspiciously like soy sauce.",
  o:[["Drink it anyway, show no fear",()=>{leg(15);say("It WAS soy sauce. You finish it deadpan. Robin is furious and delighted. Psychological victory.","leg");}],
     ["Swap glasses while he's distracted",()=>{if(Math.random()<.6){leg(20);say("Robin drinks his own soy sauce. The table erupts. Reverse-prank of the year.","leg");}else{buzz(10);say("He saw you swap. Yours was the real one all along. Robin is playing 4D chess.","hot");}}]]},
 {t:"Walk-through",p:"Two coppers are doing a slow lap of the venue, hands on belts, vibes at zero.",
  o:[["Act natural",()=>{ if(S.buzz>85){heat(22);say("Your version of 'natural' is a slow-motion wink. They clock you instantly.","bad");} else if(boy("pickles").up&&Math.random()<.4){heat(10);say("Pickles greets them with 'OFFICERS! Love the outfits!' at 110 decibels.","bad");} else say("You examine a beer coaster with academic interest. They move on.","gd"); }],
     ["Tactical smoko outside",()=>{heat(5);buzz(-3);say("You stand outside not smoking. Slightly suspicious, mostly fine.","hot");}]]},
 {t:"Nang proposal",c:()=>boy("travis").up,p:"Someone Travis befriended in the smoking area — of course it was Travis — has a box of nangs and a car park in mind.",
  o:[["Absolutely not, we have standards",()=>{leg(8);say("Growth. The boys nod. Even Travis's new mate respects it.","gd");}],
     ["It's a bucks night, isn't it?",()=>{leg(15);heat(18);buzz(5);say("Balloon animals for adults. A ranger writes something down from across the car park.","bad");}]]},
 {t:"Floor pharmaceutical",c:()=>boy("travis").up,p:"Travis has found an unidentified pill on the floor of the toilets and is holding it up like Simba. Given his track record tonight, this is deeply concerning.",
  o:[["Slap it out of his hand",()=>{leg(10);say("Duty of care executed. Travis mourns briefly, then respects it. 'Waste,' he whispers.","gd");}],
     ["Let the man cook",()=>{heat(8);if(Math.random()<.5){buzz(20);say("Travis ascends to another plane and starts hugging the DJ booth.","bad");}else{say("It was a Mentos. Travis reports feeling 'minty', with detectable disappointment.","gd");leg(5);}}]]},
 {t:"Shout o'clock",p:"It's your shout. Every remaining boy turns to you expectantly.",
  o:[["Shout the round",()=>{const c=boysUp()*9;spend(c);leg(15);buzz(6);say("You shout the round ($"+c+" on the card, a problem for Future You). Songs may be written about this.","leg");}],
     ["Fake a phone call",()=>{leg(-10);say("Everyone can see your screen is off.","bad");}]]},
 {t:"Kerb negotiation",c:()=>boy("robin").up,p:"Robin wants to jaywalk across William St to beat the kebab rush, 'as a bit'.",
  o:[["Send it",()=>{if(Math.random()<.6){leg(8);say("Frogger complete. First in line.","leg");}else{heat(12);say("A traffic cop materialises from thin air with a notepad.","bad");}}],
     ["Use the crossing",()=>{say("You wait for the green man like absolute legends of civic order.","gd");leg(3);}]]},
 {t:"The guest list",c:()=>boy("leroy").up,p:"At the door, Leroy steps forward and announces — with total conviction — that you are 'the visiting under-23s development squad' and should be on the list. The bouncer looks at Travis. Travis waves.",
  o:[["Commit to the bit",()=>{if(Math.random()<.6){S.flags.squad=true;leg(30);say("The bouncer WAVES YOU THROUGH. You are now, officially, an elite sporting organisation. Leroy signs something on the way in.","leg");}else{heat(8);leg(-5);say("The bouncer asks which position Pickles plays. Pickles says 'quarterback'. The bit collapses instantly.","bad");}}],
     ["Abort the bit",()=>{say("You physically steer Leroy away from the door mid-sentence. He finishes the pitch to a parked car.","hot");}]]},
 {t:"The Leroy pivot",c:()=>boy("leroy").up,p:"Leroy has cornered a nightclub promoter and is pitching him a 'bucks-night-as-a-service' startup. The promoter is nodding. This is getting out of hand.",
  o:[["Play the co-founder",()=>{leg(20);say("You improvise a revenue model on a napkin. The promoter shouts your drinks 'as an angel round'. Leroy names you CFO on the spot.","leg");buzz(6);}],
     ["Extract Leroy before he signs something",()=>{say("You drag Leroy away mid-valuation. He's already texting the promoter a deck.","hot");leg(5);}]]},
 {t:"The allegiance audit",c:()=>boy("pickles").up,p:"A backpacker hears Pickles's accent and calls him 'a yank'. Pickles goes silent. Ten years. TEN YEARS in this country. He has a Bunnings PowerPass and a preferred kebab order.",
  o:[["Back your man",()=>{leg(15);say("The table erupts in Pickles's defence, citing his snag technique and his hatred of daylight saving. The backpacker formally apologises. Pickles buys him a beer anyway, at volume.","leg");}],
     ["Let Pickles handle it",()=>{leg(10);buzz(3);say("Pickles delivers a five-minute TED talk on the superiority of the Australian meat pie. The backpacker leaves a changed man.","leg");}]]},
 {t:"The expat summit",c:()=>boy("pickles").up,p:"Pickles has encountered a group of actual American tourists. They're delighted by him. He looks trapped — and, for the first time in a decade, his accent is fully relapsing in real time.",
  o:[["Extract him",()=>{leg(10);say("You pull Pickles out mid-'y'all'. He shakes it off like a wet dog. 'Cheers, that was close.'","leg");}],
     ["Let the relapse run",()=>{leg(14);buzz(4);say("Pickles goes FULL American for one glorious hour of his countrymen's shouts, then returns to the table saying 'yeah nah' with the relief of a man removing a costume.","leg");}]]},
 {t:"The tattoo window",p:"A late-night tattoo parlour glows across the street. Bucko is staring at it. 'It's my last night of freedom, boys.'",
  o:[["Talk him into something small",()=>{S.flags.tattoo=true;spend(120);leg(28);say("Bucko now has a tiny cocktail glass on his ankle ($120). The bride will find it eventually.","leg");}],
     ["Full veto, best-man privilege",()=>{leg(6);say("You invoke best-man veto powers. Bucko sulks for one song, then forgets entirely.","gd");}]]},
 {t:"E-scooter armada",p:"Four parked e-scooters. Robin has already unlocked one with the app. 'Convoy to the next venue?'",
  o:[["Assemble the armada",()=>{spend(18);if(Math.random()<.6){leg(22);buzz(4);say("Grown adults in polos glide down James St in formation. Onlookers salute.","leg");}else{heat(14);say("A council ranger films the entire convoy on his phone, nodding slowly.","bad");}}],
     ["Walk like it's 1997",()=>{buzz(-3);say("You walk. Robin rides beside you at 2km/h making seagull noises.","hot");}]]},
 {t:"The bride calls",ctx:"any",p:"Bucko's phone lights up: it's the bride. Bucko is currently wearing a traffic cone as a hat.",
  o:[["Coach him through it",()=>{S.flags.cone=true;leg(15);say("You mouth 'CONE OFF' and conduct him through a flawless 'yeah quiet one, love you'. Oscar-worthy. The cone goes back on immediately after.","leg");}],
     ["Answer it yourself",()=>{S.flags.cone=true;if(Math.random()<.5){leg(20);say("You deliver a glowing welfare report. The bride laughs and says 'keep him alive'. Trust: earned. Bucko keeps the cone.","leg");}else{buzz(-4);say("She hears Pickles scream 'SHOTS' mid-sentence. The call goes long. Buzz leaks away. The cone remains.","bad");}}]]},
 {t:"3am philosophy",ctx:"any",c:()=>boy("sandy").up,p:"Sandy, suddenly lucid, grabs your shoulder: 'Do you reckon Bucko's actually ready? Like, REALLY ready?'",
  o:[["Engage sincerely",()=>{buzz(-4);leg(18);say("Ten minutes of genuine heart-to-heart on a kerb. The boys will deny it ever happened. Legend points regardless.","leg");}],
     ["'Sandy it's 3am'",()=>{say("Sandy nods slowly. 'Yeah. Yeah, fair.' Then orders another round.","hot");buzz(3);}]]},
 {t:"Busker battle",c:()=>boy("robin").up,p:"A street performer with a loop pedal is drawing a crowd. Robin has begun beatboxing next to him, uninvited.",
  o:[["Hype the collab",()=>{if(Math.random()<.7){leg(25);say("The busker leans in. Robin's beatbox is... actually good? The crowd triples. Coins rain.","leg");}else{leg(-5);say("The busker stops the loop pedal and just stares. Longest silence of the night.","bad");}}],
     ["Apologise on his behalf",()=>{say("You drop $10 in the case as a diplomatic settlement.","hot");spend(10);}]]},
 {t:"The police horse",p:"A mounted officer is parked outside the club. The horse is majestic. The boys are transfixed.",
  o:[["Politely ask for a photo",()=>{if(S.buzz>85){heat(12);say("The officer looks at the state of you and says 'move along'. The horse agrees.","bad");}else{S.flags.bruce=true;leg(15);say("Photo granted. The horse is named Bruce. This is the best thing that has ever happened to Pickles.","leg");}}],
     ["Keep the boys moving",()=>{say("You herd the boys past. Pickles whispers 'goodbye Bruce' to a horse he never met.","gd");}]]},
 {t:"Maccas schism",p:"The party has split into two factions: Kebab Loyalists and Maccas Revisionists. Voices are being raised.",
  o:[["Rule for the kebab",()=>{leg(8);say("Tradition holds. The Revisionists grumble but comply. Garlic sauce unites all.","gd");}],
     ["Democratic vote",()=>{buzz(-2);say("The vote ties. Twenty minutes are lost to constitutional debate outside a 7-Eleven.","hot");}]]},
 {t:"Leroy's trivia hustle",c:()=>boy("leroy").up,p:"Leroy has found the pub's trivia machine and claims he's 'memorised the question bank from the TAB near work'. He wants a $20 float.",
  o:[["Fund the operation ($20)",()=>{spend(20);if(Math.random()<.55){leg(20);relieve(40);say("Leroy WAS telling the truth. He clears the machine and puts his winnings against the tab like a returning king.","leg");buzz(6);}else{say("Leroy loses it all on a question about rivers. 'Rigged,' he says, already planning phase two.","bad");}}],
     ["Cut off the funding",()=>{say("Leroy funds it himself and refuses to share the winnings on principle.","hot");}]]},
 {t:"The dance-off",c:()=>S.venue===3||S.venue===4,p:"A circle has formed on the dance floor. The circle is looking at your group. The DJ is looking at your group.",
  o:[["Send Bucko in",()=>{if(Math.random()<.65){leg(30);say("Bucko unleashes a move last seen at his year 12 ball. The circle LOSES IT.","leg");}else{leg(5);say("Bucko attempts the worm and simply lies down. The circle applauds the commitment.","leg");}}],
     ["Close ranks, protect the group",()=>{say("You form a defensive polo phalanx and shuffle away from the circle.","hot");}]]},
 {t:"Kick-on intelligence",c:()=>S.tick>70,p:"A guy called 'Deano' that nobody remembers meeting says there's a warehouse party 'literally two minutes away, bro'.",
  o:[["Trust Deano",()=>{S.flags.deano=true;buzz(-4);if(Math.random()<.4){leg(25);say("The warehouse party is REAL. There's a guy DJing off a laptop on an ironing board. Incredible scenes.","leg");}else{say("You walk 25 minutes to a locked roller door. Deano has evaporated. Deano was never real.","bad");}}],
     ["Nobody trusts a Deano",()=>{S.flags.deano=true;leg(5);say("Collective wisdom prevails. Deano nods respectfully and dissolves into the night to find another group.","gd");}]]},
 /* ---- Jez events ---- */
 {t:"Jez clocks on",c:()=>boy("jez").up,p:"The bar is four deep and one bartender is drowning. Jez's eye is twitching. Ten years of hospo muscle memory are screaming at him. He's already rolling up his sleeves.",
  o:[["Let him work",()=>{leg(22);buzz(5);say("Jez vaults the bar. Within minutes the queue is gone, the bartender is weeping with gratitude, and your table has 'staff drinks'. A master never retires.","leg");}],
     ["Drag him back to civilian life",()=>{say("You physically restrain Jez. He watches the struggling bartender the way a retired sheepdog watches sheep.","hot");}]]},
 {t:"Industry rate",c:()=>boy("jez").up&&S.bill>150,p:"Jez squints at the card total, disappears, and returns having discovered the venue manager is his old 2IC from a bar in Subiaco. 'Give me two minutes with the tab.'",
  o:[["Unleash the industry rate",()=>{const d=Math.round(S.bill*.25);relieve(d);leg(12);say("Jez returns with $"+d+" mysteriously gone from the bill and two free garlic breads. Hospo mates are the strongest force in the universe.","leg");}],
     ["Pay full price like a mug",()=>{say("Jez shrugs. 'Your funeral.' The card weeps quietly.","hot");}]]},
 /* ---- more standalone ---- */
 {t:"Pool table stakes",p:"Two locals in high-vis challenge your best two to doubles. Thirty bucks on it. Robin is already chalking a cue with menace.",
  o:[["Take the bet ($30)",()=>{spend(30);if(Math.random()<.6){relieve(60);leg(20);say("Robin and Jez run the table. The locals pay up with genuine respect and buy the winners a round.","leg");}else{say("The locals were sharks. Of course they were sharks. They're wearing high-vis at 11pm.","bad");}}],
     ["Politely decline",()=>{say("You cite an old pool injury. Nobody believes you, including the pool table.","hot");}]]},
 {t:"The jukebox coup",p:"Someone has queued six consecutive Nickelback songs on the venue jukebox and left the building. The room is suffering.",
  o:[["Stage a counter-coup ($5)",()=>{spend(5);leg(15);say("You commandeer the jukebox and drop 'Horses'. The entire venue sings the chorus as one organism. Democracy restored.","leg");}],
     ["Endure",()=>{buzz(-3);say("Six songs. SIX. The room ages visibly. Somewhere, the phantom queuer laughs.","bad");}]]},
 {t:"The missing shoe",p:"Bucko has one shoe. Nobody knows when this happened, including Bucko, who has only just noticed and seems impressed.",
  o:[["Backtrack for the shoe",()=>{buzz(-4);if(Math.random()<.6){leg(10);say("The shoe is found upright in the middle of the dance floor, untouched, like Excalibur.","leg");}else{say("The shoe is gone. The shoe has started a new life. Bucko commits to the asymmetric look.","hot");}}],
     ["Servo thongs, $12, move on",()=>{spend(12);leg(8);say("Bucko now wears one dress shoe and one servo thong, and honestly? It works.","leg");}]]},
 {t:"The photo booth",p:"An unattended photo booth glows in the corner. It fits four. There are however-many-of-you-are-left of you.",
  o:[["All in ($15)",()=>{spend(15);leg(18);say("The strip prints: four frames of escalating structural failure, Pickles's face filling 60% of each. Framed at the wedding, guaranteed.","leg");}],
     ["Dignity intact",()=>{say("You skip it. Robin does a solo session and slides the strip into your pocket later. All four frames are just his face, deadpan.","hot");}]]},
 {t:"The rival bucks",p:"Another bucks party has entered the venue — matching shirts, inflatable sheep, their own Pickles-equivalent. Eye contact is made across the room. The energy shifts.",
  o:[["Challenge them to a boat race",()=>{S.flags.rivals=true;buzz(8);if(Math.random()<.6){leg(28);say("Your table WINS the boat race. The rivals salute. Their buck buys your buck a drink. Ancient rites observed.","leg");}else{leg(5);heat(6);say("You lose the boat race but win the moral victory when their best man chunders mid-anchor leg.","bad");}}],
     ["Form an alliance",()=>{S.flags.rivals=true;S.flags.rivalAlly=true;leg(15);say("The two parties merge into one mega-bucks. Sixteen men, two inflatable sheep, one purpose.","leg");}]]},
 {t:"Goon of fortune",ctx:"home",c:()=>S.kickon,p:"A Hills Hoist has been located in the courtyard of Leroy's flat. A goon sack has been pegged to it. You know the rules. Everybody knows the rules.",
  o:[["Spin the Hoist",()=>{buzz(10);leg(20);say("The sack of destiny rotates. Pickles takes three consecutive hits and declares it 'the finest game ever devised'. He's not wrong.","leg");}],
     ["Retire undefeated",()=>{say("You watch from the step, wise and warm, as the Hoist claims victim after victim.","gd");}]]},
 /* ---- follow-up chains (f:true, unlocked by flags) ---- */
 {t:"The cone tax",f:true,c:()=>S.flags.cone,p:"At the next door, the bouncer points at Bucko's traffic cone hat. 'The cone stays outside.' Bucko clutches it. He's grown attached. He's named it Gary.",
  o:[["Surrender Gary with honours",()=>{leg(12);say("Gary is placed gently on the kerb, facing the road he came from. A moment of silence. The bouncer, moved, waves you in.","leg");}],
     ["Smuggle Gary",()=>{if(Math.random()<.5){leg(20);say("Gary enters the venue under Pickles's shirt, making Pickles briefly cone-shaped. Nobody questions it. Legendary.","leg");}else{heat(10);say("Gary is confiscated at the door. Bucko watches through the window as the bouncer puts Gary on his own head. Devastating.","bad");}}]]},
 {t:"Deano rises",f:true,c:()=>S.flags.deano,p:"Deano is BACK. Different venue, same Deano. 'Bro. BRO. Forget the warehouse. There's a rooftop thing. Invite only. I can get us in.' He appears to have acquired a lanyard from somewhere.",
  o:[["The lanyard changes everything",()=>{buzz(-3);if(Math.random()<.5){leg(30);say("THE ROOFTOP IS REAL. Fairy lights, a view of the city, someone's playing vinyl. Deano, you beautiful mirage. Deano is gone by the time you turn around.","leg");}else{say("The lanyard says 'HELLO MY NAME IS' with nothing written on it. The rooftop is a Wilson car park. Deano remains at large.","bad");}}],
     ["Not falling for Deano twice",()=>{leg(8);say("'Respect,' says Deano, meaning it, and walks directly into the night to find a group with weaker convictions.","gd");}]]},
 {t:"The tattoo reveal",f:true,c:()=>S.flags.tattoo,p:"Bucko's phone erupts. The tattoo artist posted his work to Instagram and tagged the shop's location. The bride's sister follows the shop. The clock is ticking.",
  o:[["Get ahead of it",()=>{leg(20);say("You draft Bucko's confession text personally: 'funny story, love you.' The bride replies with the skull emoji, then 'it better be small'. Crisis converted to marriage-strengthening anecdote.","leg");}],
     ["Deny everything",()=>{if(Math.random()<.5){say("The sister doesn't check her feed tonight. You've bought Bucko six days. He spends them poorly.","hot");}else{buzz(-5);leg(-5);say("Screenshot received. Bucko spends forty minutes on the phone outside. The boys hold a vigil through the window.","bad");}}]]},
 {t:"Bruce's last patrol",f:true,c:()=>S.flags.bruce,p:"3am-ish. You round a corner and there he is: BRUCE. The police horse. End of his shift. The officer recognises you. Pickles has already started walking toward the horse with his arms out.",
  o:[["Formal farewell ceremony",()=>{leg(18);say("The officer permits one (1) respectful pat each. Pickles goes last and whispers something to Bruce that makes the officer look away, emotional.","leg");}],
     ["Pickles cannot be stopped",()=>{if(Math.random()<.6){leg(25);say("Pickles hugs the horse. The horse LEANS IN. The officer takes a photo FOR you. Bruce has chosen his people.","leg");}else{heat(12);say("'Sir, step away from the horse.' Pickles complies at 4km/h, maintaining eye contact with Bruce the entire time.","bad");}}]]},
 {t:"The mega-bucks reunion",f:true,c:()=>S.flags.rivalAlly,p:"The allied bucks party has found you again at the kebab shop. Their buck and your buck are now arm in arm, planning to attend each other's weddings. The two best men lock eyes: this must be managed.",
  o:[["Sanction the brotherhood",()=>{leg(22);say("The two parties share one enormous mixed kebab order. Numbers are exchanged. A WhatsApp group called 'THE BOYS (EXTENDED UNIVERSE)' is created. It will outlive us all.","leg");}],
     ["Gently separate the bucks",()=>{leg(8);say("The bucks are peeled apart like velcro, both promising to 'defs catch up'. They will never see each other again. It was beautiful while it lasted.","gd");}]]},
 {t:"The squad audit",f:true,c:()=>S.flags.squad,p:"A club manager approaches your 'under-23s development squad' table with a clipboard: the venue would like to comp your drinks and post a photo with 'the boys from the academy'. This has gone too far. Leroy is already fixing his hair.",
  o:[["Come clean",()=>{leg(15);say("You confess everything. The manager stares... then laughs so hard he comps the round anyway 'for the commitment'. Leroy takes full credit.","leg");}],
     ["Pose for the photo",()=>{if(Math.random()<.5){leg(25);relieve(50);say("The photo is taken. Drinks are comped. Somewhere on a nightclub Instagram, eight cooked civilians are captioned 'future stars'. The bill breathes easier.","leg");}else{heat(15);say("A patron who follows the actual under-23s squints at Travis. The jig is up. You are asked to leave with a firmness usually reserved for actual athletes.","bad");}}]]},
 /* ---- extra venue jeopardy: more ways for the night to end early ---- */
 {t:"The taxi rank stand-off",c:()=>S.tick>30,p:"One cab, two groups, both swear they flagged it. The other mob is bigger and their buck has removed his shirt as a formality.",
  o:[["Concede it like gentlemen",()=>{leg(6);say("You wave them off with grace. Bucko salutes their buck. A rare outbreak of civility on William St.","gd");}],
     ["Stand your ground",()=>{ if(Math.random()< .3 + S.tick*0.004){ heat(18); endScreen("A NIGHT IN THE CELLS","A taxi-rank scuffle at this hour is a Northbridge classic and the police have seen every episode. You are gently folded into a divvy van. Bucko's speech writes itself.",false,false);} else { leg(10); heat(6); say("Chest-to-chest, then — somehow — a handshake and a shared maxi. Warm cab, cooler heads.","hot"); } }]]},
 {t:"Cut off",c:()=>S.buzz>80,p:"The bartender slides your card back and says the four words: 'You've had enough, mate.' The whole bar is watching.",
  o:[["Take the L, order water",()=>{buzz(-6);heat(-6);say("You accept the ruling with dignity and a jug of water. The bartender respects it. A redemption arc begins.","gd");}],
     ["Argue the toss",()=>{ if(Math.random()< .35 + S.tick*0.003){ heat(16); endScreen("EIGHTY-SIXED","You argued with a sober professional whose entire job is winning that argument. The group is trespassed from the venue and, by radio, the two next to it. The night folds.",false,false);} else { say("You talk your way into one last round through sheer charm. The bartender already regrets it.","hot"); buzz(4);} }]]},
 {t:"The lost buck",c:()=>S.tick>44&&boy("bucko").up,p:"Headcount: you are one Bucko short. The groom has wandered. It is the one job. It is the ONLY job.",
  o:[["Fan out and find him",()=>{buzz(-4);if(Math.random()<.75){leg(12);say("Found him. Bucko is teaching a kebab-shop cat to high-five. He is thriving. Crisis averted.","leg");}else{say("Twenty minutes lost to the search. He was in the toilet the entire time. The entire time.","hot");}}],
     ["He's a grown man",()=>{ if(Math.random()<.4){ downBoy("bucko","cab home","Bucko has put himself in a cab and gone home to bed. On his own bucks night. You had one job."); leg(-20);} else { say("Bucko reappears holding three kebabs and no memory of leaving. All is forgiven.","gd"); } }]]},
 /* ---- kick-on (house-party) events ---- */
 {t:"Noise complaint",ctx:"home",p:"A neighbour in a dressing gown is at the door. 'It's quarter to four. I've got work. I've already called the council once.' Leroy is halfway through offering him equity.",
  o:[["Apologise, turn it right down",()=>{heat(-16);say("You drop the aux to a respectful murmur and promise to wind it down. Disarmed, the neighbour accepts a garlic bread and leaves almost fondly.","gd");}],
     ["Invite him in",()=>{ if(Math.random()<.6){leg(16);heat(-8);say("The neighbour, Trevor, is now three goons deep and showing everyone photos of his caravan. Trevor rules. Trevor is one of the boys now.","leg");}else{heat(16);say("Trevor films the state of the flat 'for the council' and leaves. That is evidence, that is.","bad");} }]]},
 {t:"Someone's calling it",ctx:"home",c:()=>boy("sandy").up&&boysUp()>3,p:"Sandy is by the door with his shoes already on. 'Boys. I love you. But I'm cooked. I'm going home to be a person.'",
  o:[["Let him go with honour",()=>{leg(6);say("You walk Sandy to a cab, exchange three separate hugs, and wave him off. A dignified retirement.","gd");}],
     ["Talk him into one more",()=>{ if(Math.random()<.55){leg(12);say("Sandy takes his shoes back off. 'One more. But then I'm serious.' He is not serious. Legend.","leg");}else{downBoy("sandy","gone home","Sandy sees through you, wisely, and goes home to bed like a functioning adult. Respect.");} }]]},
 {t:"The 5am wall",ctx:"home",c:()=>boy("travis").up,p:"Travis has gone a colour not found in nature and is very still on the beanbag. This is the part of the night where someone's judgement actually matters.",
  o:[["Water, on his side, mind him",()=>{buzz(-5);leg(12);say("You put Travis on his side with a water and a bin within range and keep watch. Ten minutes on he sits bolt upright and asks if anyone's keen for eggs. Duty of care: elite.","gd");}],
     ["He'll be right",()=>{ if(Math.random()<.5){ heat(10); downBoy("travis","ambulance","Travis is not, in fact, right. An ambo is called. He's fine — hydrated, mortified, fine — but the heart goes out of the party."); if(Math.random()<.55) endScreen("THAT'S A WRAP","Once the paramedics have been and gone, nobody's really got the stomach to keep pushing. The kick-ons quietly fold. Everyone agrees it was a big one, and that Travis is a menace.",false,false); } else { say("Against all odds Travis rallies, stands, and declares himself 'reborn'. Nobody believes him, but the vibe recovers.","hot"); } }]]},
 {t:"The landlord's drive-by",ctx:"home",c:()=>S.day>=2,p:"A car pulls up out front. It is Leroy's property manager doing a 'routine' 7am drive-by on day two. The flat looks like a crime scene sponsored by goon.",
  o:[["Leroy handles it",()=>{ if(Math.random()<.6){leg(14);say("Leroy strolls out and delivers a masterclass. Within four minutes the property manager has agreed the mess is 'staging for a listing photo' and driven off. How does he DO it.","leg");}else{heat(18);say("The property manager takes photos. Many photos. Leroy's bond is now a rich and detailed history. The party sobers considerably.","bad");} }],
     ["Everyone hide",()=>{ if(Math.random()<.5){say("Eight grown men hold their breath behind a couch for six minutes. The car leaves. You have never felt more alive, or more stupid.","hot");}else{ endScreen("EVICTED AT DAWN","The property manager lets himself in. Eight men rise slowly from behind the furniture like the world's worst surprise party. Leroy's tenancy ends on the spot, and so does the party.",false,false);} }]]},
 {t:"Aux cord coup",ctx:"home",p:"Someone nobody knows has seized the aux and queued forty minutes of hard techno. The vibe is being held hostage in Leroy's own kitchen.",
  o:[["Stage a counter-coup",()=>{leg(10);buzz(4);say("You wrestle back the aux and drop a song the whole kitchen knows every word of. Order restored. Democracy, at 4am, prevails.","leg");}],
     ["Let it ride",()=>{buzz(-4);heat(5);say("Forty minutes of unbroken doof. Two people leave. A porch light comes on across the road. The kitchen enters a fugue state.","bad");}]]},
 {t:"A shadow person beckons",ctx:"home",c:()=>S.shadow,p:"One of the shadow people has peeled away from the wall and is holding the front door open for you. It is very polite. It is very tall. It would very much like you to follow it outside.",
  o:[["Do not follow the shadow person",()=>{buzz(-4);leg(14);say("You stay. You put the kettle on. The shadow person shrugs — a whole-body event — and rejoins the wall. The correct call. Almost certainly the correct call.","leg");}],
     ["Follow the shadow person",()=>{ if(Math.random()<.5){ leg(26); say("It leads you to the yard and shows you the most beautiful sunrise you have ever seen, then dissolves. You return luminous, changed, and slightly damp. Nobody asks.","leg"); } else { endScreen("THE LONG WALK","You follow the shadow person out the door and simply keep walking. The boys find you four suburbs away at a bus stop hours later — calm, barefoot, unable to explain a second of it. The kick-ons ended the moment you left. Some doors you don't hold open.",false,false); } }]]},
];

  $("buzzState").textContent=bs; $("buzzState").style.color=bc;

  document.querySelectorAll(".act").forEach(el=>{

}

/* ---------------- actions ---------------- */
function useAct(id){
  const a=ACTS.find(x=>x.id===id);
  if(S.cds[id]>0||S.over)return;
  const price=Math.round(a.base*(a.gear?1:VENUES[S.venue].price));
  spend(price); S.cds[id]=a.cd; a.do(); paint();
}
/* Venue moves are no longer free-roam — the night rolls forward through this arc,
   and a "move on" event offers each next spot. moveVenue keeps the door logic. */
const ARC=[0,1,2,3,4]; // Grass Monkey → Mustard → Sneaky Terry's → Retro Shitty → Connies
const DAY_LEN=36;      // ticks per kick-on "day" — survive three to reach folklore
function nextArcVenue(){
  for(let p=S.arcPos+1;p<ARC.length;p++){
    const i=ARC[p];
    if(!VENUES[i].opens || S.tick>=VENUES[i].opens) return {p,i};
  }
  return null;
}
function moveVenue(i){
  if(i===S.venue){ S.walking=2; renderSpot(); renderBar(); paint(); return; }
  const from=VENUES[S.venue], to=VENUES[i];
  from.left=true;
  const jezUp=boy("jez").up;
  if(to.left && to.door){
    const refuse=jezUp?.28:.45;
    if(Math.random()<refuse){
      say("The bouncer at "+to.n+" holds up a hand. 'Not tonight fellas. You LEFT.' The door is a one-way valve and you have learned this the hard way.","bad");
      S.walking=2; S.venue=KEBAB; renderSpot(); renderBar(); paint(); return;
    } else say(jezUp?"Jez greets the bouncer by name — old hospo mates. You're waved back in like royalty.":"The bouncer squints... and waves you back in. Miracle.","gd");
  }
  if(to.door && S.buzz>75){
    S.boys.filter(b=>b.up).forEach(b=>{
      let chance=.2 + (b.id==="pickles"?.12:0) - (jezUp?.05:0);
      if(Math.random()<chance) benchBoy(b.id,8,"knocked back","The bouncer takes one look at "+b.n+" and shakes his head. "+b.n+" is now negotiating from the wrong side of a velvet rope.");
    });
    if(S.buzz>90 && Math.random()<(jezUp?.35:.5)){
      say("The bouncer assesses the group's collective condition and refuses the LOT of you. 'Have a water, come back never.'","bad");
      heat(6); S.walking=2; S.venue=KEBAB; renderSpot(); renderBar(); paint(); return;
    }
  }
  // Full security stand-off: rolls only when you're maxed out, and gets likelier as the night wears on.
  if(to.door && S.buzz>82){
    const pConf=Math.min(.6,(S.buzz-80)/40*(0.22+S.tick*0.0045));
    if(Math.random()<pConf) S.pendingConflict=i;
  }
  S.walking=3; S.venue=i;
  say("The boys migrate toward "+to.n+". "+to.blurb,"hot");
  renderSpot(); renderBar(); paint();
}
function fireMoveEvent(){
  const nxt=nextArcVenue(); if(!nxt)return false;
  const to=VENUES[nxt.i];
  const doorLine=to.door?" Word is the door's picky.":"";
  showEvent({t:"Time to move on?",
    p:"The vibe here is thinning. "+to.n+" is the call — "+to.blurb.toLowerCase()+doorLine+" Do we send it, or milk this one a bit longer?",
    o:[
      ["Send it to "+to.n,()=>{ S.arcPos=nxt.p; S.moveCd=11+Math.floor(Math.random()*5); moveVenue(nxt.i); }],
      ["One more here",()=>{ S.moveCd=6+Math.floor(Math.random()*4); buzz(2); say("You stay put and sink another. No one's in a hurry — the night'll come to you.","hot"); }]
    ]});

}

    p:"7pm at the Grass Monkey. Eight polos, one buck, sticky carpet underfoot. The first tray lands and the entire night forks off this single sip. How do we open?",
    o:[
      ["Schooners all round",()=>{ spend(boysUp()*9); buzz(10); say("Eight schooners hit the table. Bucko makes a speech nobody can hear. The night is officially airborne.","gd"); }],
      ["Shots for the buck first",()=>{ spend(boysUp()*10); buzz(15); leg(8); say("Tequila for the whole table before anyone's even sat down. Bucko bites the lime skin-side. Unhinged. Legend behaviour from the jump.","leg"); }],
      ["Pace it — water first, then in (elite)",()=>{ buzz(4); heat(-3); leg(4); say("A pint of water before the first beer. The boys jeer. The boys are wrong. Future You sends thanks from 4am.","gd"); }]
    ]});
}
/* events are tagged venue (default), home, or any — so kick-ons never talk about bouncers */
function ctxOk(e){ const c=e.ctx||"venue"; return c==="any"||(S.kickon?c==="home":c==="venue"); }
function benchTwo(){
  const up=S.boys.filter(b=>b.up&&b.id!=="bucko");
  for(let n=0;n<2&&up.length;n++){ const b=up.splice(Math.floor(Math.random()*up.length),1)[0];
    benchBoy(b.id,8,"knocked back",b.n+" is stuck on the wrong side of the rope, negotiating."); }
}
function securityConflict(idx){
  const v=VENUES[idx], jezUp=boy("jez").up;
  showEvent({t:"Trouble at the door",
    p:"The bouncer at "+v.n+" plants a hand on Bucko's chest. Eight cooked blokes, one of them wearing a traffic cone, at "+clockStr()+". This can go a few ways.",
    o:[
      ["Let Jez smooth it over",()=>{ if(jezUp && Math.random()<.75){ heat(4); say("Jez steps up, talks the bouncer's language, name-drops a venue in Vic Park. You're waved in. Barely.","gd"); } else { benchTwo(); say("The bouncer isn't in the mood for the chat. A couple of the boys get pulled aside; the rest slink in.","bad"); } }],
      ["Front it out",()=>{ const pBust=Math.min(.72,.18+S.tick*0.005+(S.buzz-80)/60); if(Math.random()<pBust){ heat(20); endScreen("LOCKED UP","You told a Northbridge bouncer you 'know the owner'. You do not know the owner. Words are exchanged, then police are exchanged. The night ends in the watch house — but what a hill to die on.",false,false);} else { heat(12); say("Somehow the sheer confidence lands. The bouncer respects the audacity and lets you through, shaking his head.","hot"); } }],
      ["Cut your losses, kebab run",()=>{ buzz(-4); heat(-4); S.venue=KEBAB; say("You read the room and peel off to Kebab Alley instead. Garlic sauce heals what the door wounded.","gd"); renderSpot(); renderBar(); }]
    ]});
}
function endKickonGood(){
  const d=S.day;
  const title = d>=5?"THE UNKILLABLES" : d>=4?"THROUGH THE VEIL" : d>=3?"THREE DAYS" : d>=2?"LEGENDS OF THE KICK-ON" : "THE SKYDIVE";
  let body;
  if(d>=4) body="You step out into day "+d+"'s light with the shadow people watching politely from the yard, and somehow you're still smiling. "+boysUp()+" survivors, "+d+" days, one unbroken party. Nobody will ever believe this. Nobody needs to.";
  else if(boy("ray").up) body="Ray herds the survivors into a van — you are, apparently, going skydiving. "+d+" day"+(d>1?"s":"")+" deep, still in the same polo, you watch Perth shrink beneath you. The greatest bucks night ever run.";
  else body="You call it after "+d+" day"+(d>1?"s":"")+" on the tools. The survivors share one last kebab on Leroy's step as the city wakes up around you. Bucko is getting married. Nothing was burned down.";
  endScreen(title, body, true, false);
}
function dawnEvent(){
  S.running=false;
  const d=S.day; // day just survived
  let p, title="Dawn over Leroy's flat";
  if(d<3){
    p="Day "+d+" of the kick-ons: survived. The sun is up, the goon is warm, "+boysUp()+" of you are still technically conscious. Push into another day, or bow out a legend while you still can?";
  } else if(d===3){
    title="Beyond the veil";
    p="Three days. THREE. The kick-ons never technically stopped — you're folklore already. But the flat has started to breathe, and there are figures at the edge of the room that weren't there an hour ago. Do you dare go further?";
  } else {
    title="Beyond the veil";
    p="Day "+d+" survived. Time has gone soft and warm. The shadow people outnumber the boys now and not one of them has blinked. Sleep is a rumour told by cowards. Push deeper into the veil, or get out while a version of you still exists?";
  }
  showEvent({t:title, p:p,
    o:[
      ["Push into day "+(d+1),()=>{ S.day++; S.dayEndTick=S.tick+DAY_LEN; S.buzz=Math.max(S.buzz,30); S.heat=Math.max(0,S.heat-12);
          if(S.day>=4 && !S.shadow){ S.shadow=true; say("Day "+S.day+". You have not slept in over sixty hours. The shadow people have arrived — tall, patient, standing just past every doorway. Nobody mentions them. It would be rude.","bad"); }
          else say("Day "+S.day+". Nobody has been to bed. The neighbours have stopped asking. This is a siege now.","leg"); }],
      ["Bow out a legend",()=>{ endKickonGood(); }]
    ]});
}

/* ---------------- modal ---------------- */
function showEvent(ev){
  S.running=false;
  const c=$("card");
  c.innerHTML=`<h2>${ev.t}</h2><p>${ev.p}</p>`;
  ev.o.forEach(([label,fn])=>{
    const b=document.createElement("button"); b.textContent=label;
    b.onclick=()=>{ $("overlay").classList.remove("show"); fn(); S.running=true; paint(); };
    c.appendChild(b);
  });
  $("overlay").classList.add("show");
}
function reelHtml(){
  if(!S.reel.length)return "";
  let picks=S.reel;
  if(picks.length>6){ picks=[]; const step=S.reel.length/6; for(let i=0;i<6;i++)picks.push(S.reel[Math.floor(i*step)]); }
  return `<div class="reel"><div class="rl">Highlight reel</div>`+
    picks.map(r=>`<div><span style="color:${r[2]==="leg"?"var(--amber)":"var(--danger)"}">${r[0]}</span> — ${r[1]}</div>`).join("")+`</div>`;
}
function rank(v){ return v>=1000?"CERTIFIED FOLK HERO": v>=600?"ABSOLUTE WEAPON": v>=300?"GOOD SOLDIER": v>=120?"PARTICIPANT":"DESIGNATED DISAPPOINTMENT"; }
function degenRank(d){ return d>=900?"UNGOVERNABLE": d>=500?"FERAL": d>=250?"CERTIFIED DEGEN": d>=100?"LOOSE UNIT":"MERELY KEEN"; }
function statBlock(title,rows){
  return `<div class="sheet"><div class="sh-t">${title}</div>`+
    rows.map(r=>`<div class="sh-r"><span class="sh-l">${r[0]}</span><span class="sh-v ${r[2]||''}">${r[1]}</span></div>`).join("")+`</div>`;
}
function nightRows(){
  const v=S.kickon?S.nightLegend:S.legend;
  return [["Legend",v,"amber"],["Boys standing",boysUp()+"/8",""],["Peak buzz",Math.round(S.peakBuzz),""],["Card bill","$"+S.bill,"danger"],["Rank",rank(v),""]];
}
function afterRows(){
  return [["Days survived",S.day,"zone"],["Degen score",S.degen,"zone"],["Total legend",S.legend,"amber"],["Card bill","$"+S.bill,"danger"],["Degen rank",degenRank(S.degen),"zone"]];
}
function nightSheet(){ return statBlock("The night",nightRows()); }
function comboSheet(){ return statBlock("The night",nightRows())+statBlock("The kick-ons",afterRows()); }
function scoreSheets(){
  if(!S.kickon) return nightSheet();
  return `<div class="tog"><button class="tg" data-s="n">Night</button><button class="tg on" data-s="k">Night + Kick-ons</button></div>
    <div id="sheetN" style="display:none">${nightSheet()}</div>
    <div id="sheetK">${comboSheet()}</div>`;
}
function endScreen(title,body,win,offerKickon){
  S.over=true;S.running=false;
  let extra="";
  if(win && !S.kickon && boy("ray").up) extra=" Ray is already talking about the 9am skydive he booked. On your card.";
  const c=$("card");
  c.innerHTML=`<h2 style="color:${win?"var(--zone)":"var(--danger)"}">${title}</h2>
    <p>${body}${extra}</p>${scoreSheets()}${reelHtml()}`;
  c.querySelectorAll(".tg").forEach(el=>el.onclick=()=>{
    const k=el.dataset.s==="k";
    $("sheetK").style.display=k?"":"none"; $("sheetN").style.display=k?"none":"";
    c.querySelectorAll(".tg").forEach(t=>t.classList.toggle("on",t===el));
  });
  if(offerKickon){
    const k=document.createElement("button"); k.className="kick"; k.textContent="KICK ON — Leroy's flat, 3 more hours";
    k.onclick=()=>{ startKickons(); };
    c.appendChild(k);
  }
  const b=document.createElement("button"); b.className="big"; b.textContent=offerKickon?"Call it a perfect night":"Run it back";
  b.onclick=()=>{ if(offerKickon){b.textContent="Run it back";offerKickonDone(c);} else location.reload(); };
  $("overlay").classList.add("show");
  c.appendChild(b);
}
function offerKickonDone(c){
  c.querySelectorAll("button").forEach(x=>x.remove());
  const b=document.createElement("button"); b.className="big"; b.textContent="Run it back";
  b.onclick=()=>location.reload(); c.appendChild(b);
}
function startKickons(){
  S.kickon=true; S.over=false; S.venue=KICKON;
  S.day=1; S.dayEndTick=S.tick+DAY_LEN;
  S.nightLegend=S.legend; S.aftersStart=S.tick;
  S.buzz=Math.max(S.buzz,30); S.heat=Math.max(0,S.heat-20);
  $("overlay").classList.remove("show");
  renderSpot(); renderBar();
  say("KICK-ONS. The survivors pile into two Ubers to Leroy's flat. Someone is already on aux. The sun is a rumour. Northbridge is shut — it's the flat and the kebab run only.","leg");
  say("New rules: goon-priced drinks, neighbours instead of bouncers. Heat now means noise complaints. Survive the sunrise and you can push on. How far? Only one way to find out.","hot");
  S.running=true; paint();
}

/* ---------------- main loop ---------------- */
function step(){
  if(!S.running||S.over)return;
  S.tick++;
  for(const k in S.cds) if(S.cds[k]>0)S.cds[k]--;
  if(S.walking>0){ S.walking--; buzz(-2);
    if(S.walking===0){
      if(S.pendingConflict!=null){ const idx=S.pendingConflict; S.pendingConflict=null; securityConflict(idx); paint(); return; }
      say("Arrived at "+VENUES[S.venue].n+".","gd");
    }
  }
  if(S.seated>0){S.seated--; if(S.seated===0)say("You have risen from the seat. The seat will be missed.","gd");}
  S.boys.forEach(b=>{ if(!b.up && b.outTicks>0){ b.outTicks--; if(b.outTicks===0){ b.up=true; b.st=b.id==="pickles"?"loud American":"back in"; say(b.n+" has snuck back in through the smokers' area like it never happened.","gd"); renderBoys(); } } });
  let decay = S.kickon?2.8:2.2;
  if(S.dexTicks>0){decay*=.45;S.dexTicks--;}
  if(S.soakTicks>0){decay*=.5;S.soakTicks--;}
  if(S.ketTicks>0){decay*=.6;}                    // ket is potent — it holds your buzz right up
  const combo = S.cokeTicks>0 && S.ketTicks>0;    // coke + ket in tandem: pays legend and kills the seat
  if(combo){ leg(2); }
  // Pinger: gentle come-up, then it LANDS — how hard is down to chance (freight train, or a dud).
  if(S.mdTicks>0){
    if(S.mdTicks>10) buzz(+3);
    S.mdTicks--;
    if(S.mdTicks===10) pingerLands();
    if(S.mdTicks===0){ buzz(-18); say("The comedown arrives like a tax invoice. Jaw finally relaxes.","bad"); }
  }
  if(S.cokeTicks>0){S.cokeTicks--; if(S.cokeTicks===0){buzz(-14);say("The rack wears off mid-sentence. The sentence was about crypto.","bad");}}
  if(S.ketTicks>0){S.ketTicks--; if(S.ketTicks===0){buzz(-8);say("The K-hole releases you back into the room, blinking. Everything's very loud again.","bad");}}
  buzz(-decay);
  if(S.buzz<=0 && S.tick>6){
    const e=SOBER_ENDINGS[Math.floor(Math.random()*SOBER_ENDINGS.length)];
    endScreen(e[0],e[1],false,false); paint(); return;
  }
  if(S.seated===0 && S.buzz>=ZONE[0] && S.buzz<=ZONE[1]){
    S.streak++;
    let g = 3 * VENUES[S.venue].legend * (boysUp()/8) * (1+Math.min(S.streak,20)*.05);
    if(S.mdTicks>0)g*=2;
    if(boy("ray").up)g+=0.8;
    leg(g);
  } else S.streak=0;
  // Degen score — only accrues in afters. Ramps every hour you keep going; doubles when you push above the zone.
  if(S.kickon){
    let d = 1 + Math.floor((S.tick-S.aftersStart)/12);
    if(S.buzz>ZONE[1]) d*=2;
    S.degen += d;
  }
  /* ---- character ticks ---- */
  if(S.travisHole>0){
    S.travisHole--;
    if(!S.kickon && Math.random()<.3){S.travisHole=0;heat(10);downBoy("travis","thrown out","Security escorts Travis to the street with the gentle firmness of men who have seen this exact thing 4,000 times.");}
    else if(S.travisHole===0){const t=boy("travis");if(t.up){t.st="suspiciously chipper";say("Travis returns from the wall. 'What a piece,' he says of the gig poster, and orders a beer like nothing happened.","gd");renderBoys();}}
  }
  if(S.sandyCd>0)S.sandyCd--;
  if(boy("sandy").up && S.buzz>82 && S.sandyCd===0 && Math.random()<.25){ S.sandyCd=18; sandyEvent(); paint(); return; }
  /* Ambient character chatter is throttled to at most one line every couple of ticks,
     so the feed stays readable and the pop-up events carry the night. */
  if(S.ambientCd>0)S.ambientCd--;
  S.jezCd--;
  if(boy("jez").up && S.jezCd<=0 && S.ambientCd<=0){ S.jezCd=13+Math.floor(Math.random()*8); S.ambientCd=2; fireChatter("jez"); }
  S.robinCd--;
  if(boy("robin").up && S.robinCd<=0 && S.ambientCd<=0){ S.robinCd=12+Math.floor(Math.random()*8); S.ambientCd=2; fireChatter("robin"); }
  S.leroyCd--;
  if(boy("leroy").up && S.leroyCd<=0 && S.ambientCd<=0){ S.leroyCd=15+Math.floor(Math.random()*8); S.ambientCd=2; fireChatter("leroy"); }
  S.picklesCd--;
  if(boy("pickles").up && S.picklesCd<=0 && S.ambientCd<=0){ S.picklesCd=9+Math.floor(Math.random()*7); S.ambientCd=2; fireChatter("pickles"); }
  if(!S.rayDone && boy("ray").up && S.tick>=60){ S.rayDone=true; rayEvent(); paint(); return; }
  if(S.buzz>90 && S.ambientCd<=0 && Math.random()<.30){ S.ambientCd=2; heat(8*VENUES[S.venue].heat); fireChaos(); }
  if(S.shadow && S.ambientCd<=0 && Math.random()<.28){ S.ambientCd=2; fireShadow(); }
  if(S.heat>0 && Math.random()<.5)heat(-1);
  // venue moves — the night rolls forward through the arc, offered as an event
  S.moveCd--;
  if(!S.kickon && S.walking===0 && S.seated===0 && S.buzz>=12 && S.moveCd<=0 && S.tick<S.ticksTotal-6){
    if(fireMoveEvent()){ paint(); return; } else S.moveCd=8;
  }
  // random events — no repeats, context-gated (venue vs house), follow-ups favoured once unlocked
  S.eventCd--;
  if(S.eventCd<=0 && (S.kickon || S.tick<S.ticksTotal-4)){
    S.eventCd=9+Math.floor(Math.random()*6);
    const avail=EVENTS.filter(e=>!e.used&&(!e.c||e.c())&&ctxOk(e));
    const follow=avail.filter(e=>e.f);
    const pool=(follow.length&&Math.random()<.5)?follow:avail;
    if(pool.length){ const ev=pool[Math.floor(Math.random()*pool.length)]; ev.used=true; showEvent(ev); paint(); return; }
  }
  // kick-on attrition — the further you push, the more the party takes. Scales per day.
  if(S.kickon){
    if(Math.random() < .015*S.day) heat(2+2*S.day);
    if(Math.random() < .012*S.day){
      const up=S.boys.filter(b=>b.up&&b.id!=="bucko");
      if(up.length>3){ const b=up[Math.floor(Math.random()*up.length)];
        downBoy(b.id,"tapped out",b.n+" has gone quietly horizontal on a beanbag and become part of the furniture. A good innings."); }
    }
  }
  // fail states
  if(S.heat>=100){
    if(S.kickon) endScreen("SHUT DOWN","The police attend Leroy's flat at the neighbours' request. Everyone files out holding a single sausage roll each. It was a hell of a run.",false,false);
    else endScreen("LOCKED UP","The night ends in the Perth watch house. Bucko's wedding speech now has a whole new chapter, so, silver linings.",false,false);
    paint();return;
  }
  if(boysUp()<=2){endScreen("PARTY WIPE","The boys have been lost to taxis, security guards and poor decisions. You stand on James St holding six phones, none of them yours.",false,false);paint();return;}
  if(!S.kickon && S.tick>=S.ticksTotal){
    endScreen("SUNRISE","6am. The survivors watch the sun come up over the Horseshoe Bridge eating kebabs. Bucko is getting married. Nothing was burned down.",true,true);
    paint();return;
  }
  if(S.kickon && S.tick>=S.dayEndTick){ dawnEvent(); paint(); return; }
  paint();
}

/* ---------------- boot ---------------- */
function boot(){
  renderBoys(); renderSpot(); renderBar(); paint();
  const c=$("card");
  c.innerHTML=`<h2>SEND IT</h2>
  <p>Bucko's getting married. Eight of you. One night in Northbridge. Eleven hours until sunrise — then, if you're still standing, the kick-ons.</p>
  <p>Keep the buzz in <strong style="color:var(--zone)">THE ZONE</strong> to bank legend points. <strong>Buzz hits zero, the night dies on the spot.</strong> Go too hard and bouncers knock the boys back, cops circle, and heat 100 is the watch house. Tap the boys' handles below to drink, kebab and gear up — the night moves the group from spot to spot on its own. Everything goes on the card — Future You's problem.</p>`;
  const b=document.createElement("button"); b.className="big"; b.textContent="Into the Grass Monkey →";
  b.onclick=()=>{ S.started=true; S.running=true; say("7pm at the Grass Monkey. Pickles is already the loudest person in the state, and Jez has quietly assessed the bar staff's pour technique.","hot"); kickoffEvent(); };
  c.appendChild(b);
  $("overlay").classList.add("show");
  setInterval(step,1500);
}
boot();
</script>
</body>
</html>
