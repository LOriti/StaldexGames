<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow" />
<title>SEND IT — A Northbridge Bucks Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0b14; --panel:#171224; --panel2:#1f1930; --line:#2c2340;
  --text:#ece7f2; --dim:#9a90b0;
  --neon:#ff2e88; --amber:#ffb347; --zone:#2ee6a8; --danger:#ff5252; --klr:#7c5cff;
  --disp:"Fraunces",serif; --body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--text);font-family:var(--body);height:100%}
body{padding:8px 10px;max-width:900px;margin:0 auto;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;gap:6px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.neon{
  font-family:var(--disp);font-weight:900;font-size:clamp(26px,6vw,40px);letter-spacing:.02em;
  color:var(--neon);
  text-shadow:0 0 5px rgba(255,46,136,.9),0 0 18px rgba(255,46,136,.5);
  animation:flick 7s infinite;
}
@keyframes flick{0%,86%,88%,92%,100%{opacity:1}87%,91%{opacity:.35;text-shadow:none}}
@media (prefers-reduced-motion: reduce){.neon{animation:none}}
.sub{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:right}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats.afters{grid-template-columns:repeat(4,1fr)}
#moveVal{color:var(--neon)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 8px;text-align:center}
.stat.hidden{display:none}
.stat .lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stat .val{font-family:var(--disp);font-weight:900;font-size:18px}
#legendVal{color:var(--amber)}
#billVal{color:var(--danger)}
#degenVal{color:var(--zone)}

.gauge{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.gauge .row{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.track{position:relative;height:18px;border-radius:5px;background:#0a0812;overflow:hidden;border:1px solid var(--line)}
.track.slim{height:9px;margin-top:6px}
.zoneBand{position:absolute;top:0;bottom:0;background:rgba(46,230,168,.14);border-left:1px dashed rgba(46,230,168,.6);border-right:1px dashed rgba(46,230,168,.6)}
.zoneBand span{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.2em;color:var(--zone);white-space:nowrap}
.fill{position:absolute;top:0;bottom:0;left:0;transition:width .5s ease}
#buzzFill{background:linear-gradient(90deg,#5a4b7d,var(--neon))}
#heatFill{background:linear-gradient(90deg,#7d3a2b,var(--danger))}
.state{font-size:11px;margin-top:5px;font-weight:600;min-height:14px}

.boys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
@media(min-width:640px){.boys{grid-template-columns:repeat(8,1fr)}}
.boy{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 2px;text-align:center;font-size:10.5px;transition:opacity .4s}
.boy .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boy .st{color:var(--dim);font-size:9px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boy.buck .nm{color:var(--amber)}
.boy.warn{border-color:var(--danger)}
.boy.wait{opacity:.55;border-style:dashed}
.boy.gone{opacity:.28;filter:grayscale(1)}

.spot{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.spot .dot{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);flex:none}
.spot .nm{font-weight:700;font-size:13px;color:var(--text)}
.spot .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.spot .vibe{margin-left:auto;font-size:10px;color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Feed: newest line on top, older lines clipped — never scrolls. */
.logBox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;flex:1;min-height:60px;overflow:hidden;display:flex;flex-direction:column;font-size:12.5px;line-height:1.5;-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent);mask-image:linear-gradient(to bottom,#000 62%,transparent)}
.logBox p{margin-bottom:4px;color:var(--dim);flex:none}
.logBox p:first-child{color:var(--text)}
.logBox p.hot{color:var(--text)}
.logBox p.leg{color:var(--amber)}
.logBox p.bad{color:var(--danger)}
.logBox p.gd{color:var(--zone)}

.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.act{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 3px 9px;cursor:pointer;text-align:center;color:var(--text);overflow:hidden}
.act:active{transform:scale(.96)}
.act:disabled{opacity:.4;cursor:default}
.act .ico{font-size:22px;line-height:1.1}
.act .nm{font-size:11px;font-weight:700;margin-top:2px}
.act .pr{font-size:9.5px;color:var(--dim)}
.act .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--neon);width:0%}
.act.gear{border-color:#3a2c66}
.act.gear .pr{color:var(--klr)}
.card button:disabled{opacity:.4;cursor:default}

.overlay{position:fixed;inset:0;background:rgba(6,4,12,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;max-width:460px;width:100%;padding:18px;max-height:88vh;overflow-y:auto}
.card h2{font-family:var(--disp);font-weight:900;font-size:22px;margin-bottom:7px;color:var(--neon)}
.card p{color:var(--dim);font-size:13.5px;line-height:1.5;margin-bottom:12px}
.card .tog{display:flex;gap:6px;margin:0 0 10px}
.card .tog .tg{flex:1;width:auto;margin:0;padding:7px 4px;text-align:center;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.card .tog .tg.on{background:var(--neon);color:var(--ink);border-color:var(--neon)}
.card .stiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px;margin:0 0 9px}
.card .stile{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 4px;text-align:center}
.card .stile .tl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.card .stile .tv{font-family:var(--disp);font-weight:900;font-size:21px;margin-top:2px;color:var(--text)}
.card .stile .tv.amber{color:var(--amber)}.card .stile .tv.zone{color:var(--zone)}.card .stile .tv.danger{color:var(--danger)}.card .stile .tv.neon{color:var(--neon)}
.card .rankstrip{display:flex;flex-wrap:wrap;gap:5px 14px;justify-content:center;font-size:12.5px;color:var(--dim);margin:0 0 11px}
.card .rankstrip b{color:var(--text)} .card .rankstrip b.zone{color:var(--zone)} .card .rankstrip b.neon{color:var(--neon)}
.card .addhd{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--zone);text-align:center;margin:4px 0 8px;padding-top:9px;border-top:1px solid var(--line)}
.card details{margin:0 0 9px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.card details>summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:12px;font-weight:700;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card details>summary::-webkit-details-marker{display:none}
.card details>summary::after{content:"▸";color:var(--dim);font-weight:400}
.card details[open]>summary::after{content:"▾"}
.card .rcpt{background:#f4f1e8;color:#1a1710;border-radius:6px;margin:0 12px 12px;padding:13px 15px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7}
.card .rc-h{font-weight:700;text-align:center;font-size:13px;letter-spacing:.05em}
.card .rc-sub{text-align:center;color:#6b6357;font-size:11px;margin-bottom:7px}
.card .rc-d{color:#b7ab97;letter-spacing:.08em;overflow:hidden;white-space:nowrap}
.card .rc-l{display:flex;justify-content:space-between}
.card .rc-b{font-weight:700}
.card .rc-f{text-align:center;color:#6b6357;font-size:11px;margin-top:8px}
.card .reelInner{padding:0 12px 10px}
.card .reelInner div{font-size:11px;color:var(--dim);line-height:1.5;margin-bottom:2px}
.card button{display:block;width:100%;margin-top:7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;text-align:left}
.card button:hover{border-color:var(--neon)}
.card .big{background:var(--neon);color:var(--ink);text-align:center;border-color:var(--neon);font-size:14px}
.card .kick{background:var(--zone);color:var(--ink);text-align:center;border-color:var(--zone);font-size:14px}
</style>
</head>
<body>

<header>
  <div class="neon">SEND IT</div>
  <div class="sub">One bucks night in Northbridge<br>last til sunrise</div>
</header>

<div class="stats" id="statsRow">
  <div class="stat"><div class="lbl">Time</div><div class="val" id="clockVal">7:00pm</div></div>
  <div class="stat"><div class="lbl">Legend</div><div class="val" id="legendVal">0</div></div>
  <div class="stat" id="billStat"><div class="lbl">Card Bill</div><div class="val" id="billVal">$0</div></div>
  <div class="stat hidden" id="degenStat"><div class="lbl">Degen</div><div class="val" id="degenVal">0</div></div>
  <div class="stat hidden" id="moveStat"><div class="lbl">Movement</div><div class="val" id="moveVal">0</div></div>
</div>

<div class="gauge">
  <div class="row"><span>Buzz — hit zero and the night's over</span><span id="buzzPct">0</span></div>
  <div class="track">
    <div class="zoneBand" id="zoneBand"><span>THE ZONE</span></div>
    <div class="fill" id="buzzFill"></div>
  </div>
  <div class="row" style="margin-top:6px"><span>Heat</span><span id="heatPct">0</span></div>
  <div class="track slim"><div class="fill" id="heatFill"></div></div>
  <div class="state" id="buzzState">Stone-cold sober. Embarrassing, frankly.</div>
</div>

<div class="boys" id="boysRow"></div>

<div class="spot" id="spotRow"></div>

<div class="logBox" id="logBox"></div>

<div class="acts" id="actsRow"></div>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
"use strict";
/* ---------------- state ---------------- */
const S = {
  tick:0, ticksTotal:132, running:false, over:false, kickon:false,
  buzz:0, heat:0, bill:0, billMark:0, legend:0, streak:0,
  seated:0, dexTicks:0, mdTicks:0, cokeTicks:0, ketTicks:0, soakTicks:0,
  venue:0, walking:0, arcPos:0, moveCd:13, ambientCd:0, started:false,
  day:1, dayEndTick:0, pendingConflict:null, usedChat:{}, usedChaos:new Set(),
  degen:0, aftersStart:0, nightLegend:0, nightBoys:8, nightPeak:0, nightBill:0, peakBuzz:0, shadow:false, usedShadow:new Set(),
  venueTicks:0, momentum:0, notoriety:0, visited:new Set(["gm"]),
  counts:{}, spend:{drink:0,gear:0,food:0}, forkCount:0, usedHeat:new Set(), usedDJ:new Set(),
  bunkered:false, takeover:false, allegiance:0, milestone:0, usedBunker:new Set(),
  counterCd:12, usedCounter:new Set(), pendingQuiz:null, usedDerail:new Set(),
  lastFood:0, lastWater:0, hygieneWarned:false,
  kCount:0, travisHole:0, rayDone:false, sandyCd:0,
  jezCd:14, robinCd:11, leroyCd:17, picklesCd:9,
  reel:[],
  flags:{cone:false,deano:false,tattoo:false,bruce:false,rivals:false,rivalAlly:false,squad:false},
  boys:[
    {id:"bucko",  n:"Bucko",  buck:true, up:true, st:"the buck"},
    {id:"travis", n:"Travis", up:true, st:"suspiciously chipper"},
    {id:"sandy",  n:"Sandy",  up:true, st:"pacing it"},
    {id:"jez",    n:"Jez",    up:true, st:"hospo veteran"},
    {id:"robin",  n:"Robin",  up:true, st:"the joker"},
    {id:"ray",    n:"Ray",    up:true, st:"mingling"},
    {id:"leroy",  n:"Leroy",  up:true, st:"scheming"},
    {id:"pickles", n:"Pickles", up:true, st:"loud American"},
  ],
  cds:{}, eventCd:8
};
const ZONE=[42,75];
const KEBAB=5, KICKON=6;

/* Indices 5 (KEBAB) and 6 (KICKON) are fixed by the constants above — new venues append after. */
const VENUES=[
  {id:"gm",      tier:0,    n:"Grass Monkey",   tag:"pub",        price:1.0,  legend:1.0, heat:.5,  door:false, blurb:"Sticky carpet. Honest schooners.", left:false},
  {id:"mustard", tier:1,    n:"Mustard Bar",    tag:"live music", price:1.15, legend:1.4, heat:.8,  door:false, blurb:"A cover band doing Barnesy. Again.", left:false},
  {id:"sneaky",  tier:1,    n:"Sneaky Terry's", tag:"speakeasy",  price:1.5,  legend:1.6, heat:.6,  door:true,  blurb:"You knock on a fridge to get in. The fridge is judgemental.", left:false},
  {id:"retro",   tier:2,    n:"Retro Shitty",   tag:"club",       price:1.7,  legend:2.4, heat:1.5, door:true,  opens:36, blurb:"Doof doof. The bouncer remembers faces.", left:false},
  {id:"connies", tier:3,    n:"Connies",        tag:"late club",  price:1.6,  legend:2.0, heat:1.2, door:true,  opens:60, blurb:"Best dance floor in the hemisphere. Opens midnight.", left:false},
  {id:"kebab",   tier:null, n:"Kebab Alley",    tag:"street",     price:1.0,  legend:.4,  heat:.3,  door:false, blurb:"Garlic sauce fixes most things.", left:false},
  {id:"flat",    tier:null, n:"Leroy's Flat",   tag:"kick-ons",   price:.4,   legend:1.8, heat:.9,  door:false, blurb:"Someone's already on aux. The neighbours are already awake.", left:false, hidden:true},
  {id:"bowlo",   tier:null, n:"North Perth Bowlo", tag:"lawn bowls club", price:.7, legend:.9, heat:.6, door:false, blurb:"Twenty minutes out of the city. Carpet bowls, a meat raffle, fluorescent light, and destiny.", left:false},
  {id:"wine",    tier:0,    n:"Vin Rouge",      tag:"wine bar",   price:1.6,  legend:1.1, heat:.4,  door:false, blurb:"Natural wine and small plates. Sandy's happy place. Use your inside voice.", left:false},
  {id:"sports",  tier:1,    n:"The Sportie",    tag:"sports bar", price:1.1,  legend:1.3, heat:.9,  door:false, blurb:"Big screens, a pool table, a beer tower with your name on it.", left:false},
  {id:"irish",   tier:1,    n:"Molly's",        tag:"Irish pub",  price:1.2,  legend:1.5, heat:.9,  door:false, blurb:"Guinness done properly. Jez knows the owner. A fiddle is warming up.", left:false},
  {id:"rooftop", tier:2,    n:"Alto",           tag:"rooftop",    price:1.8,  legend:2.2, heat:1.0, door:true,  strict:true, opens:36, blurb:"City views, a dress code, and cocktails that cost like rent.", left:false},
  {id:"dive",    tier:2,    n:"The Bird",       tag:"dive bar",   price:.9,   legend:2.0, heat:1.6, door:true,  opens:48, blurb:"Sticky, dark, cheap spirits, a band nobody's heard of. The meanest door on the strip.", left:false},
];

/* ---------------- helpers ---------------- */
const $=id=>document.getElementById(id);
function say(t,cls){
  const p=document.createElement("p"); if(cls)p.className=cls; p.textContent=t;
  const b=$("logBox"); b.prepend(p); while(b.children.length>7)b.lastChild.remove();
  if((cls==="leg"||cls==="bad") && S.reel.length<60) S.reel.push([clockStr(),t,cls]);
}
function buzz(d){ S.buzz=Math.min(100,Math.max(0,S.buzz+d)); if(S.buzz>S.peakBuzz)S.peakBuzz=S.buzz; }
function leg(d){ S.legend=Math.max(0,Math.round(S.legend+d)); }
function heat(d){ S.heat=Math.min(100,Math.max(0,S.heat+d)); }
function heatRisk(amt,msg){ if(Math.random()<.5){ heat(amt); say(msg,"bad"); } }
function relieve(amt){ S.bill=Math.max(0,S.bill-amt); }
function spend(amt){ if(!amt)return; S.bill+=amt;
  if(S.bill-S.billMark>=250){ S.billMark=S.bill;
    say(["Your bank sends a text: 'Did you REALLY just spend this in Northbridge? Reply YES or NO.' You reply YES without reading it.",
         "Tap. Tap. Tap. The card is warm to the touch now.",
         "Somewhere, your savings account files a missing persons report.",
         "The card declines nothing. The card has given up on you."][Math.floor(Math.random()*4)],"bad"); }
}
function boy(id){ return S.boys.find(b=>b.id===id); }
function boysUp(){ return S.boys.filter(b=>b.up).length; }
function downBoy(id,status,msg){ const b=boy(id); if(!b||!b.up)return; b.up=false; b.outTicks=0; b.st=status; say(msg,"bad"); renderBoys(); }
function benchBoy(id,ticks,status,msg){ const b=boy(id); if(!b||!b.up)return; b.up=false; b.outTicks=ticks; b.st=status; say(msg,"bad"); renderBoys(); }
function clockStr(){ const m=19*60 + S.tick*5; const h24=Math.floor(m/60)%24; const mm=(m%60).toString().padStart(2,"0"); const ap=h24>=12&&h24<24?"pm":"am"; let h=h24%12; if(h===0)h=12; return h+":"+mm+ap; }
/* Hygiene — hours since the last food or water. Past ~24h the sesh gets harder to hold; by ~36h, much harder. */
function hygieneHrs(){ return Math.max((S.tick-S.lastFood)*5/60, (S.tick-S.lastWater)*5/60); }
function hygienePenalty(){ const h=hygieneHrs(); return h<24?0:Math.min(0.6,(h-24)/12*0.6); }
function outOfControl(){
  let o=0;
  if(S.buzz>ZONE[1]) o+=(S.buzz-ZONE[1])/25;       // too maggot
  else if(S.buzz<ZONE[0]) o+=(ZONE[0]-S.buzz)/50;  // the party is fading
  o+=S.heat/220;
  o+=hygienePenalty()*0.8;                          // running on empty makes you sloppy
  return o;
}

/* ---------------- consumables ---------------- */
const ACTS=[
  {id:"beer", ico:"🍺", nm:"Schooner", base:9,  cd:3,  gear:false, do:()=>{ buzz(+8);  say("Schooner down. Crisp.","gd"); }},
  {id:"wine", ico:"🍷", nm:"Vino",     base:12, cd:3,  gear:false, do:()=>{ buzz(+10); say("A sophisticated glass of goon-adjacent red.","gd"); }},
  {id:"cock", ico:"🍸", nm:"Cocktail", base:24, cd:4,  gear:false, do:()=>{ buzz(+16); leg(4); say("An espresso martini. The boys pretend not to judge.","gd"); }},
  {id:"shot", ico:"🥃", nm:"Shots",    base:10, cd:2,  gear:false, do:()=>{ buzz(+12); if(Math.random()<.25){leg(6);say("Tequila for the table. Someone bites the lime, skin-side. Legend behaviour.","leg");} else say("A shot vanishes. Your future self files a complaint.","gd"); }},
  {id:"water",ico:"💧", nm:"Water",    base:0,  cd:4,  gear:false, do:()=>{ buzz(-8); heat(-3); const dry=(S.tick-S.lastWater)*5/60>24; S.lastWater=S.tick; say(dry?"First water in over a day. Your body sends up a flare of pure gratitude. Everything eases a notch.":"A tactical water. Genuinely elite move.","gd"); }},
  {id:"kebab",ico:"🥙", nm:"Kebab",    base:15, cd:10, gear:false, do:()=>{ S.soakTicks=10; heat(-3); const starved=(S.tick-S.lastFood)*5/60>24; S.lastFood=S.tick; say(starved?"First real food in over a day. The whole machine reboots. Soakage acquired and, for once, actually needed — the slide eases right off.":"Soakage acquired. The kebab slows the slide. Buzz decay halved for a bit.","gd"); }},
  {id:"coke", ico:"❄️", nm:"Racks",    base:60, cd:10, gear:true,  do:()=>{ buzz(+20); S.cokeTicks=10; heatRisk(10,"A cubicle door with four sets of shoes under it draws attention.");
      if(S.mdTicks>0){ badStack(); }                                          // coke on a pinger — dangerous
      else if(S.ketTicks>0){ leg(10); say("The rack lands on the ket and the whole night snaps into balance. Calibrated. Untouchable. This is the good stuff.","leg"); }
      else say("Everyone in the cubicle is now an expert on cryptocurrency.","hot"); }},
  {id:"md",   ico:"💊", nm:"Pinger",   base:30, cd:14, gear:true,  do:()=>{ S.mdTicks=16; buzz(+2);
      if(S.cokeTicks>0){ badStack(); }                                        // pinger onto a rack — dangerous
      else if(S.ketTicks>0){ goodRoll(); }                                    // pinger with ket already down — glorious
      else say("Pinger down. Nothing yet... but it's on its way up. Legend ×2 once it lands.","hot"); }},
  {id:"k",    ico:"🐴", nm:"K",        base:35, cd:12, gear:true,  do:()=>{ buzz(+16); S.ketTicks=12; S.kCount++;
      if(S.cokeTicks>0){ leg(10); say("The ket settles onto the coke like a saddle on a horse. You are, briefly, a functioning superbeing — no seat for you tonight.","leg"); }
      else if(S.mdTicks>0){ goodRoll(); }                                     // ket after a pinger — the fabled roll
      else if(S.buzz>70 && Math.random()<.5){ S.seated=5; say("The K takes full hold and the seat becomes your entire universe. You will be here a while.","bad"); }
      else say("The room tips a hard, warm diagonal and simply stays there. This is the good stuff.","hot");
      if(boy("travis").up && S.travisHole===0 && S.kCount>=4 && Math.random() < .25*(S.kCount-3)) travisEvent();
  }},

  o:[["Send Bucko in",()=>{ if(Math.random()<.4){leg(18);say("Bucko, against all odds and physics, wins on the last bowl. The old-timer stands, doffs his club cap, and shouts the whole table a round of shandies. Legend across generations.","leg");}else{leg(8);say("Bucko is comprehensively schooled. The old-timer doesn't gloat — he just nods, having taught a young man something about respect.","gd");} }],

function pingerLands(){

function bouncerQuiz(id){

  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pool[i];pool[i]=pool[j];pool[j]=t; }
  const qs=[pool[0],pool[1]]; let score=0, step=0; const c=$("card");
  function render(){

  }

}

function timeTier(){ return S.tick<24?0 : S.tick<48?1 : S.tick<84?2 : 3; }
function forkOptions(){
  const cur=S.venue, tt=timeTier();

  for(let i=0;i<VENUES.length;i++){
    const v=VENUES[i];
    if(i===cur || i===KEBAB || v.hidden || v.tier==null) continue;
    if(v.opens && S.tick<v.opens) continue;      // not open yet
    if(v.tier<tt-1 || v.tier>tt+1) continue;      // stay near the hour's tier
    if(v.strict && S.notoriety>55) continue;      // posh doors won't have a marked group
    pool.push(i);
  }
  pool.sort((a,b)=>Math.abs(VENUES[a].tier-tt)-Math.abs(VENUES[b].tier-tt));
  const top=pool.slice(0,4);
  for(let n=top.length-1;n>0;n--){ const j=Math.floor(Math.random()*(n+1)); const t=top[n];top[n]=top[j];top[j]=t; }
  let picks=top.slice(0,3);
  if(S.heat>55 && picks.length>0 && picks.indexOf(KEBAB)<0) picks[picks.length-1]=KEBAB; // offer the valve when hot
  return picks;
}

/* events are tagged venue (default), home, or any — so kick-ons never talk about bouncers */
function ctxOk(e){ const c=e.ctx||"venue"; return c==="any"||(S.kickon?c==="home":c==="venue"); }
function atOk(e){ return !e.at || e.at===VENUES[S.venue].id; } // signature events only fire at their venue

function reelHtml(){
  if(!S.reel.length)return "";

  return `<details open><summary>Highlight reel<span></span></summary><div class="reelInner">`+
    picks.map(r=>`<div><span style="color:${r[2]==="leg"?"var(--amber)":"var(--danger)"}">${r[0]}</span> — ${r[1]}</div>`).join("")+`</div></details>`;

function rank(v){ return v>=1000?"CERTIFIED FOLK HERO": v>=600?"ABSOLUTE WEAPON": v>=300?"GOOD SOLDIER": v>=120?"PARTICIPANT":"DESIGNATED DISAPPOINTMENT"; }
function degenRank(d){ return d>=900?"UNGOVERNABLE": d>=500?"FERAL": d>=250?"CERTIFIED DEGEN": d>=100?"LOOSE UNIT":"MERELY KEEN"; }
function movementRank(a){ return a>=2250?"THE DOOF REPUBLIC": a>=1360?"PLANETARY": a>=560?"MULTINATIONAL": a>=200?"CITYWIDE": a>=90?"GONE VIRAL":"LOCAL LEGEND"; }
function fmt(n){ return Math.round(n).toLocaleString("en-US"); }
function tilesRow(t){ return `<div class="stiles">`+t.map(x=>`<div class="stile"><div class="tl">${x[0]}</div><div class="tv ${x[2]||''}">${x[1]}</div></div>`).join("")+`</div>`; }
function rankRow(h){ return `<div class="rankstrip">${h}</div>`; }
/* Same layout, different figures: `full=false` = the night-only snapshot (at sunrise);
   `full=true` = the whole run including kick-ons. Compare apples to apples. */
function statTop(full){
  const kn=S.kickon && !full;
  const leg=kn?S.nightLegend:S.legend, boys=kn?S.nightBoys:boysUp(), peak=kn?S.nightPeak:Math.round(S.peakBuzz), bill=kn?S.nightBill:S.bill;
  return tilesRow([["Legend",fmt(leg),"amber"],["Boys",boys+"/8",""],["Peak buzz",Math.round(peak),""],["Card bill","$"+fmt(bill),"danger"]])
    + rankRow(`<span>Rank <b>${rank(leg)}</b></span><span>Boys <b>${boys}/8</b></span><span>Peak <b>${Math.round(peak)}</b></span>`);
}
function tilesSheet(mode){
  if(mode==="bowlo"){
    return tilesRow([["Movement",fmt(S.allegiance),"neon"],["Degen",fmt(S.degen),"zone"],["Legend",fmt(S.legend),"amber"],["Peak buzz",Math.round(S.peakBuzz),""]])
      + rankRow(`<span>Reach <b class="neon">${movementRank(S.allegiance)}</b></span><span>Degen <b class="zone">${degenRank(S.degen)}</b></span><span>Boys <b>${boysUp()}/8</b></span>`);
  }
  if(mode==="combo"){   // full-run figures up top (bigger), then the kick-ons-only extras

      + `<div class="addhd">+ the kick-ons</div>`
      + tilesRow([["Days survived",S.day,"zone"],["Degen",fmt(S.degen),"zone"]])
      + rankRow(`<span>Degen rank <b class="zone">${degenRank(S.degen)}</b></span>`);
  }
  return statTop(false);  // night-only
}

function scoreSheets(){

function startKickons(){
  S.kickon=true; S.over=false; S.venue=KICKON;
  S.day=1; S.dayEndTick=S.tick+DAY_LEN;
  S.nightLegend=S.legend; S.nightBoys=boysUp(); S.nightPeak=S.peakBuzz; S.nightBill=S.bill; S.aftersStart=S.tick;
  S.buzz=Math.max(S.buzz,30); S.heat=Math.max(0,S.heat-20);
  $("overlay").classList.remove("show");
  renderSpot(); renderBar();
  say("KICK-ONS. The survivors pile into two Ubers to Leroy's flat. Someone is already on aux. The sun is a rumour. Northbridge is shut — it's the flat and the kebab run only.","leg");
  say("New rules: goon-priced drinks, neighbours instead of bouncers. Heat now means noise complaints. Survive the sunrise and you can push on. How far? Only one way to find out.","hot");

/* ---------------- main loop ---------------- */
function step(){
  if(!S.running||S.over)return;
  S.tick++;
  S.venueTicks++;
  if(S.momentum>0 && Math.random()<.5) S.momentum=Math.max(0,S.momentum-1);   // adventure fades if you sit still
  if(S.notoriety>0 && Math.random()<.14) S.notoriety=Math.max(0,S.notoriety-1); // heat memory cools slowly
  for(const k in S.cds) if(S.cds[k]>0)S.cds[k]--;
  if(S.walking>0){ S.walking--; buzz(-2);
    if(S.walking===0){
      if(S.pendingConflict!=null){ const idx=S.pendingConflict; S.pendingConflict=null; S.pendingQuiz=null; securityConflict(idx); paint(); return; }
      if(S.pendingQuiz){ const qid=S.pendingQuiz; S.pendingQuiz=null; say("Arrived at "+VENUES[S.venue].n+" — but "+boy(qid).n+" is stuck at the door.","hot"); bouncerQuiz(qid); paint(); return; }
      if(!S.bunkered && Math.random()<.35 && fireTransit()){ paint(); return; }  // a scene on the walk over
      say("Arrived at "+VENUES[S.venue].n+".","gd");
    }
  }
  if(S.seated>0){S.seated--; if(S.seated===0)say("You have risen from the seat. The seat will be missed.","gd");}
  S.boys.forEach(b=>{ if(!b.up && b.outTicks>0){ b.outTicks--; if(b.outTicks===0){ b.up=true; b.st=b.id==="pickles"?"loud American":"back in"; say(b.n+" has snuck back in through the smokers' area like it never happened.","gd"); renderBoys(); } } });
  let decay = S.kickon?2.8:2.2;
  if(S.dexTicks>0){decay*=.45;S.dexTicks--; if(S.dexTicks===0){buzz(-6);say("The dexie focus evaporates. Your genius business idea suddenly looks completely unhinged on the back of the coaster.","bad");}}
  if(S.soakTicks>0){decay*=.5;S.soakTicks--; if(S.soakTicks===0) say("The kebab's protective magic wears off. The slide resumes at full speed.","hot");}
  if(S.ketTicks>0){decay*=.6;}                    // ket is potent — it holds your buzz right up
  const combo = S.cokeTicks>0 && S.ketTicks>0;    // coke + ket in tandem: pays legend and kills the seat
  if(combo){ leg(2); }
  // Pinger: gentle come-up, then it LANDS — how hard is down to chance (freight train, or a dud).
  if(S.mdTicks>0){
    if(S.mdTicks>10) buzz(+3);
    S.mdTicks--;
    if(S.mdTicks===10) pingerLands();
    if(S.mdTicks===0){
      if(S.mdSmooth){ S.mdSmooth=false; buzz(-8); say("The pinger eases off gently, cushioned by the ket. No crash — just a soft landing and a stupid, grateful grin.","gd"); }
      else if(S.mdOD){ S.mdOD=false; buzz(-28); if(S.buzz>55 && Math.random()<.5) S.seated=5; say("The comedown off that monster lands like a repossession order — jaw unclenches, soul briefly departs. You need to sit down. You are, in fact, already sitting down.","bad"); }
      else { buzz(-18); say("The comedown arrives like a tax invoice. Jaw finally relaxes.","bad"); }
    }
  }
  if(S.cokeTicks>0){S.cokeTicks--; if(S.cokeTicks===0){buzz(-14);heat(-2);say("The rack wears off mid-sentence — the sentence was about crypto — and a thin grey craving slides in behind it. You check the time. It is not later than you think.","bad");}}
  if(S.ketTicks>0){S.ketTicks--; if(S.ketTicks===0){buzz(-8);say("The K-hole spits you back into the room, blinking and somehow taller. Everything is very loud and very close again.","bad");}}
  decay *= 1 + hygienePenalty();   // no food/water for a day-plus and the buzz slides faster
  if(hygieneHrs()>24){ if(!S.hygieneWarned){ S.hygieneWarned=true; say("Over a full day now without proper food or water. The sesh is getting hard to hold — the body is filing complaints in triplicate. A kebab and a water would go a long way.","bad"); } }
  else S.hygieneWarned=false;
  buzz(-decay);
  if(S.buzz<=0 && S.tick>6){
    const e=SOBER_ENDINGS[Math.floor(Math.random()*SOBER_ENDINGS.length)];
    endScreen(e[0],e[1],false,false); paint(); return;
  }
  if(S.seated===0 && S.buzz>=ZONE[0] && S.buzz<=ZONE[1]){
    S.streak++;
    let g = 3 * VENUES[S.venue].legend * (boysUp()/8) * (1+Math.min(S.streak,20)*.05);
    if(!S.kickon){
      const cool = S.venueTicks>16 ? Math.max(0.45, 1-(S.venueTicks-16)*0.028) : 1; // a venue goes cold if you camp it
      g *= cool * (1 + Math.min(S.momentum,100)/100 * 0.6);                          // a lively crawl pays more
    }
    if(S.mdTicks>0)g*=2;
    if(boy("ray").up)g+=0.8;
    leg(g);
  } else S.streak=0;
  // Degen score — accrues in afters AND during the bowlo takeover. Ramps hourly; doubles above the zone.
  if(S.kickon || S.bunkered){
    let d = 1 + Math.floor((S.tick-S.aftersStart)/12);
    if(S.buzz>ZONE[1]) d*=2;
    S.degen += d;
  }
  /* ---- character ticks ---- */
  if(S.travisHole>0){
    S.travisHole--;
    if(!S.kickon && Math.random()<.3){S.travisHole=0;heat(10);downBoy("travis","thrown out","Security escorts Travis to the street with the gentle firmness of men who have seen this exact thing 4,000 times.");}
    else if(S.travisHole===0){const t=boy("travis");if(t.up){t.st="suspiciously chipper";say("Travis returns from the wall. 'What a piece,' he says of the gig poster, and orders a beer like nothing happened.","gd");renderBoys();}}
  }
  if(S.sandyCd>0)S.sandyCd--;
  if(boy("sandy").up && S.buzz>82 && S.sandyCd===0 && Math.random()<.25){ S.sandyCd=18; sandyEvent(); paint(); return; }
  /* Ambient character chatter is throttled to at most one line every couple of ticks,
     so the feed stays readable and the pop-up events carry the night. */
  if(S.ambientCd>0)S.ambientCd--;
  S.jezCd--;
  if(boy("jez").up && S.jezCd<=0 && S.ambientCd<=0){ S.jezCd=13+Math.floor(Math.random()*8); S.ambientCd=2; fireChatter("jez"); }
  S.robinCd--;
  if(boy("robin").up && S.robinCd<=0 && S.ambientCd<=0){ S.robinCd=12+Math.floor(Math.random()*8); S.ambientCd=2; fireChatter("robin"); }
  S.leroyCd--;
  if(boy("leroy").up && S.leroyCd<=0 && S.ambientCd<=0){ S.leroyCd=15+Math.floor(Math.random()*8); S.ambientCd=2; fireChatter("leroy"); }
  S.picklesCd--;
  if(boy("pickles").up && S.picklesCd<=0 && S.ambientCd<=0){ S.picklesCd=9+Math.floor(Math.random()*7); S.ambientCd=2; fireChatter("pickles"); }
  if(!S.rayDone && boy("ray").up && S.tick>=60){ S.rayDone=true; rayEvent(); paint(); return; }
  if(S.buzz>90 && S.ambientCd<=0 && Math.random()<.30){ S.ambientCd=2; heat(8*VENUES[S.venue].heat); if(!S.bunkered) fireChaos(); }
  if(S.shadow && S.ambientCd<=0 && Math.random()<.28){ S.ambientCd=2; fireShadow(); }
  // DJ moments — any venue on the crawl, and they take the lead as the night gets later
  if(!S.kickon && !S.bunkered && S.ambientCd<=0 && (boy("robin").up||boy("pickles").up)){
    const dj=.015 + Math.min(.09, S.tick*0.001);
    if(Math.random()<dj && fireDJ()) S.ambientCd=2;
  }
  // contextual heat scenarios — chance climbs with dangerous combos (maggot + gear + notoriety + late + a door)
  if(!S.kickon && !S.bunkered && S.ambientCd<=0){
    let hs=0;
    if(S.buzz>90) hs+=.05; else if(S.buzz>82) hs+=.03; else if(S.buzz>75) hs+=.015;
    if(gearOn()) hs+=.03;
    if(S.notoriety>30) hs+=.03;
    if(S.tick>60) hs+=.02;
    if(VENUES[S.venue].door) hs+=.02;
    if(hs>0 && Math.random()<hs && fireHeatScenario()) S.ambientCd=2;
  }
  if(S.heat>0 && Math.random()<.5)heat(-1);
  // ===== THE BOWLO SUB-STORYLINE — the night pivots to a global takeover =====
  if(S.bunkered){
    if(S.walking>0){ paint(); return; }
    if(S.takeover){
      if(S.counterCd>0)S.counterCd--;
      if(S.buzz>=40 && S.seated===0) S.allegiance += 4 + Math.floor(boysUp()/2) + Math.floor(S.buzz/12); // the movement feeds on the party
      if(S.milestone>=6) heat(-5);                                       // near-global: the authorities ARE the party now, untouchable
      else if(S.milestone>=1 && Math.random()<.25) heat(2+Math.floor(S.milestone/2)+(S.buzz>85?6:0)); // crackdown grows, and running maggot draws it hard
      if(Math.random()<.01){ const up=S.boys.filter(b=>b.up&&b.id!=="bucko"); if(up.length>3) downBoy(up[Math.floor(Math.random()*up.length)].id,"tapped out at the bowlo","One of the founding cabinet has quietly gone horizontal on the seventh green. A movement is a demanding thing."); }
      if(S.milestone>=2 && S.milestone<6){ const ooc=outOfControl(); if(ooc>0.2 && Math.random()<0.022*ooc){ fireDerail(); paint(); return; } } // unavoidable if you lose the plot
      if(S.milestone<MILESTONES.length && S.allegiance>=MILESTONES[S.milestone].at){
        const m=MILESTONES[S.milestone]; S.milestone++; showEvent(m); paint(); return;
      }
      if(S.milestone>=MILESTONES.length && S.allegiance>=GLOBAL_AT){ globalGovEnd(); paint(); return; }
      // counterinsurgency — the still-free world fights back between milestones; you must manage it
      if(S.milestone>=2 && S.milestone<8 && S.counterCd<=0 && Math.random()<.5){ S.counterCd=13+Math.floor(Math.random()*8); if(fireCounter()){ paint(); return; } }
    } else {
      if(S.tick>=36){ S.takeover=true; takeoverEvent(); paint(); return; } // the club closes and you don't leave
      if(S.buzz>68 && S.ambientCd<=0 && Math.random()<.08){ S.ambientCd=2; heat(5); say("A neighbour in the quiet street leans over the fence: 'This is a bowls club, not a nightclub.' Fair. Noted. Roundly ignored.","bad"); }
      S.eventCd--;
      if(S.eventCd<=0){ S.eventCd=5+Math.floor(Math.random()*4);
        const be=EVENTS.filter(e=>e.at==="bowlo" && !e.used && (!e.c||e.c()));
        if(be.length && Math.random()<.5){ const ev=be[Math.floor(Math.random()*be.length)]; ev.used=true; showEvent(ev); paint(); return; }
        fireBunker();
      }
    }
    if(S.heat>=100){
      if(S.milestone>=3) endScreen("THE COUP","You got so big the old powers panicked, and somewhere someone pulled a plug they shouldn't have been able to reach. The greens fall silent. History will call it a coup. History will be wrong, but too sober to argue.",false,false);
      else endScreen("SHUT DOWN AT THE BOWLO","Before the movement could find its feet, the noise complaints won — the council, the cops, and a very determined man in a dressing gown. A beautiful idea, twenty minutes too early.",false,false);
      paint();return;
    }
    if(S.buzz<=0 && S.tick>6){ endScreen("THE FIZZLE","A global movement needs a heartbeat, and yours flatlined. The sesh cannot run on an empty host. The streams cut out one by one and North Perth quietly goes back to being North Perth.",false,false); paint(); return; }
    if(boysUp()<=2){ endScreen("LEADERSHIP VACUUM","The founding cabinet has been lost to taxis and beanbags. A movement of billions cannot run on two blokes. It dissolves as fast as it formed — into folklore and a very confused Monday.",false,false); paint(); return; }
    paint(); return;
  }
  // venue moves — the night rolls forward through the arc, offered as an event
  S.moveCd--;
  if(!S.kickon && S.walking===0 && S.seated===0 && S.buzz>=12 && S.moveCd<=0 && S.tick<S.ticksTotal-6){
    if(fireMoveEvent()){ paint(); return; } else S.moveCd=8;
  }
  // random events — no repeats, context-gated (venue/house), venue-signature-gated, momentum quickens the pace
  S.eventCd--;
  if(S.eventCd<=0 && (S.kickon || S.tick<S.ticksTotal-4)){
    S.eventCd=Math.max(4, 9+Math.floor(Math.random()*6) - Math.floor(S.momentum/25));
    const avail=EVENTS.filter(e=>!e.used&&(!e.c||e.c())&&ctxOk(e)&&atOk(e)&&!e.transit);
    const sig=avail.filter(e=>e.at===VENUES[S.venue].id);   // this venue's signature scenes
    const follow=avail.filter(e=>e.f);
    let pool=avail;
    if(sig.length && Math.random()<.6) pool=sig;            // strongly favour the pub you're standing in
    else if(follow.length && Math.random()<.5) pool=follow;
    if(pool.length){ const ev=pool[Math.floor(Math.random()*pool.length)]; ev.used=true; showEvent(ev); paint(); return; }
  }
  // kick-on attrition — the further you push, the more the party takes. Scales per day.
  if(S.kickon){
    if(Math.random() < .015*S.day) heat(2+2*S.day);
    if(Math.random() < .012*S.day){
      const up=S.boys.filter(b=>b.up&&b.id!=="bucko");
      if(up.length>3){ const b=up[Math.floor(Math.random()*up.length)];
        downBoy(b.id,"tapped out",b.n+" has gone quietly horizontal on a beanbag and become part of the furniture. A good innings."); }
    }
  }
  // fail states
  if(S.heat>=100){
    if(S.kickon) endScreen("SHUT DOWN","The police attend Leroy's flat at the neighbours' request. Everyone files out holding a single sausage roll each. It was a hell of a run.",false,false);
    else endScreen("LOCKED UP","The night ends in the Perth watch house. Bucko's wedding speech now has a whole new chapter, so, silver linings.",false,false);
    paint();return;
  }
  if(boysUp()<=2){endScreen("PARTY WIPE","The boys have been lost to taxis, security guards and poor decisions. You stand on James St holding six phones, none of them yours.",false,false);paint();return;}
  if(!S.kickon && S.tick>=S.ticksTotal){
    endScreen("SUNRISE","6am. The survivors watch the sun come up over the Horseshoe Bridge eating kebabs. Bucko is getting married. Nothing was burned down.",true,true);
    paint();return;
  }
  if(S.kickon && S.tick>=S.dayEndTick){ dawnEvent(); paint(); return; }
  paint();
}

/* ---------------- boot ---------------- */
function boot(){
  renderBoys(); renderSpot(); renderBar(); paint();
  const c=$("card");
  c.innerHTML=`<h2>SEND IT</h2>
  <p>Bucko's getting married. Eight of you. One night in Northbridge. Eleven hours until sunrise — then, if you're still standing, the kick-ons.</p>
  <p>Keep the buzz in <strong style="color:var(--zone)">THE ZONE</strong> to bank legend points. <strong>Buzz hits zero, the night dies on the spot.</strong> Go too hard and bouncers knock the boys back, cops circle, and heat 100 is the watch house. Tap the boys' handles below to drink, kebab and gear up — the night moves the group from spot to spot on its own. Everything goes on the card — Future You's problem.</p>`;
  const b=document.createElement("button"); b.className="big"; b.textContent="Into the Grass Monkey →";
  b.onclick=()=>{ S.started=true; S.running=true; say("7pm at the Grass Monkey. Pickles is already the loudest person in the state, and Jez has quietly assessed the bar staff's pour technique.","hot"); kickoffEvent(); };
  c.appendChild(b);
  $("overlay").classList.add("show");
  setInterval(step,1500);
}
boot();
</script>
